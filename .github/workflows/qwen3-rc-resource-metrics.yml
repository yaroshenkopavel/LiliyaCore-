name: Qwen3 Frozen RC Resource Metrics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qwen3-rc-resource-metrics.yml'
      - 'tools/physical-runner/liliya_qwen3_resource_metrics_bridge.py'
  workflow_dispatch:
    inputs:
      confirm_large_candidate_download:
        description: Confirm the physical device may download the exact ~1.28 GB Qwen3 candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: qwen3-frozen-rc-resource-metrics
  cancel-in-progress: false

env:
  RC_REF: rc/30b9ad-acceptance
  RC_SHA: 30b9ad2853bf31f17a84b524a6f643ee1d23d72f
  RC_TREE: 232837c30ec576f9e62015154a2516028eec970b
  METRICS_BRIDGE_URL: http://127.0.0.1:18766
  PRIMARY_BRIDGE_URL: http://127.0.0.1:18765

jobs:
  validate-tooling:
    name: Validate bounded resource evidence tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate fixed-purpose metrics bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/physical-runner/liliya_qwen3_resource_metrics_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/physical-runner/liliya_qwen3_resource_metrics_bridge.py')
          text = path.read_text(encoding='utf-8')
          required = [
              'HOST = "127.0.0.1"',
              'PORT = int(os.environ.get("LILIYA_QWEN3_METRICS_BRIDGE_PORT", "18766"))',
              'Qwen3RussianQualityContextCandidateInstrumentedTest',
              '/v1/instrument/qwen3-russian-context-resources',
              'dumpsys meminfo',
              'dumpsys thermalservice',
              'dumpsys battery',
              'run-as',
              'MEASUREMENT_LOCK',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'missing fixed metrics contract: {value}')

          forbidden_routes = re.compile(r'/v1/(?:shell|command|exec)(?:["\'/]|$)')
          if forbidden_routes.search(text):
              raise SystemExit('metrics bridge must not expose arbitrary shell/command/exec endpoints')

          if 'self.path' in text and 'urlsplit(self.path).path' not in text:
              raise SystemExit('metrics bridge route parsing drifted')
          PY

  build-frozen-rc-bundle:
    name: Build exact frozen RC Qwen3 APK bundle
    needs: validate-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen RC implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_REF }}

      - name: Verify frozen RC source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RC_TREE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Compile exact semantic host and instrumentation
        run: |
          gradle \
            :android-semantic-test-host:assembleDebug \
            :android-semantic-test-host:assembleDebugAndroidTest \
            --console=plain

      - name: Collect exact frozen RC APK bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qwen3-frozen-rc-resource-bundle"
          mkdir -p "$out"
          app_apk="android-semantic-test-host/build/outputs/apk/debug/android-semantic-test-host-debug.apk"
          test_apk="android-semantic-test-host/build/outputs/apk/androidTest/debug/android-semantic-test-host-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"
          cp "$app_apk" "$out/liliya-semantic-host-debug.apk"
          cp "$test_apk" "$out/liliya-semantic-host-debug-androidTest.apk"

          python3 - "$out" "$RC_SHA" "$RC_TREE" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          out = Path(sys.argv[1])
          rc_sha = sys.argv[2]
          rc_tree = sys.argv[3]
          files = {}
          for path in sorted(out.iterdir()):
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              files[path.name] = {
                  'sha256': digest.hexdigest(),
                  'size': path.stat().st_size,
              }

          manifest = {
              'evidenceClass': 'qwen3-frozen-rc-resource-test-bundle-v1',
              'sourceCommit': rc_sha,
              'sourceTree': rc_tree,
              'sourceRef': 'rc/30b9ad-acceptance',
              'candidate': {
                  'repository': 'ggml-org/Qwen3-1.7B-GGUF',
                  'revision': 'daeb8e2d528a760970442092f6bf1e55c3b659eb',
                  'file': 'Qwen3-1.7B-Q4_K_M.gguf',
                  'bytes': 1282439264,
                  'sha256': 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5',
                  'quantization': 'Q4_K_M',
                  'promptFormatPolicy': 'MODEL_DEFAULT_CHAT_TEMPLATE',
              },
              'measurementProfile': 'russian-context-resource-metrics-v1',
              'applicationId': 'pro.liliya.android.semanticprovider',
              'testApplicationId': 'pro.liliya.android.semanticprovider.test',
              'instrumentationRunner': 'androidx.test.runner.AndroidJUnitRunner',
              'files': files,
          }
          (out / 'qwen3-frozen-rc-resource-bundle.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          cat "$out/qwen3-frozen-rc-resource-bundle.json"

      - name: Publish exact frozen RC APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-frozen-rc-resource-bundle-${{ env.RC_SHA }}
          path: ${{ runner.temp }}/qwen3-frozen-rc-resource-bundle
          if-no-files-found: error
          retention-days: 30

  physical-resource-metrics:
    name: Physical ARM64 frozen RC Qwen3 resource metrics
    if: github.event_name == 'workflow_dispatch'
    needs: build-frozen-rc-bundle
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 120
    steps:
      - name: Require explicit large-download confirmation
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirm_large_candidate_download }}' = 'true' || {
            echo 'Resource evidence requires explicit ~1.28 GB candidate download confirmation.' >&2
            exit 1
          }

      - name: Verify primary and resource-metrics bridges
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v sha256sum
          command -v curl
          token_file='/data/data/com.termux/files/home/.liliya-physical-bridge-token'
          test -s "$token_file"
          token="$(cat "$token_file")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            "$PRIMARY_BRIDGE_URL/v1/probe" \
            > "$RUNNER_TEMP/qwen3-resource-primary-probe.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            "$METRICS_BRIDGE_URL/v1/probe" \
            > "$RUNNER_TEMP/qwen3-resource-metrics-probe.json"

      - name: Download exact frozen RC APK bundle
        uses: actions/download-artifact@v4
        with:
          name: qwen3-frozen-rc-resource-bundle-${{ env.RC_SHA }}
          path: ${{ runner.temp }}/qwen3-frozen-rc-resource-bundle

      - name: Verify exact frozen RC bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qwen3-frozen-rc-resource-bundle" "$RC_SHA" "$RC_TREE" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          rc_sha = sys.argv[2]
          rc_tree = sys.argv[3]
          manifest = json.loads((root / 'qwen3-frozen-rc-resource-bundle.json').read_text(encoding='utf-8'))
          if manifest.get('sourceCommit') != rc_sha or manifest.get('sourceTree') != rc_tree:
              raise SystemExit('frozen RC source identity mismatch')
          candidate = manifest.get('candidate', {})
          if candidate.get('sha256') != 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5':
              raise SystemExit('candidate hash mismatch')
          if candidate.get('bytes') != 1282439264:
              raise SystemExit('candidate size mismatch')
          for name, identity in manifest['files'].items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing bundle file: {name}')
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != identity['sha256'] or path.stat().st_size != identity['size']:
                  raise SystemExit(f'bundle file mismatch: {name}')
          PY

      - name: Verify real physical ARM64 device through metrics bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qwen3-resource-metrics-probe.json" "$RUNNER_TEMP/qwen3-resource-device.json" <<'PY'
          import json
          import sys

          probe = json.load(open(sys.argv[1], encoding='utf-8'))
          facts = {}
          for key in ('primaryAbi', 'qemu', 'sdk', 'model', 'shellIdentity'):
              item = probe[key]
              if item['exit'] != 0:
                  raise SystemExit(f'bridge probe failed for {key}: {item}')
              facts[key] = item['output']
          if facts['primaryAbi'] != 'arm64-v8a':
              raise SystemExit('not arm64-v8a')
          if facts['qemu'] == '1':
              raise SystemExit('emulator is not accepted')
          if int(facts['sdk']) < 29:
              raise SystemExit('Android API < 29')
          if not facts['shellIdentity'].startswith('uid=2000(shell)'):
              raise SystemExit('metrics bridge is not Android shell identity')
          with open(sys.argv[2], 'w', encoding='utf-8') as stream:
              json.dump(
                  {
                      'evidenceClass': 'qwen3-frozen-rc-resource-device-v1',
                      'sourceCommit': '30b9ad2853bf31f17a84b524a6f643ee1d23d72f',
                      'sourceTree': '232837c30ec576f9e62015154a2516028eec970b',
                      'controlBackend': 'rish-bridge',
                      **facts,
                  },
                  stream,
                  indent=2,
                  sort_keys=True,
              )
              stream.write('\n')
          PY

      - name: Install exact frozen RC semantic APKs
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          auth=(-H "Authorization: Bearer $token")
          bundle="$RUNNER_TEMP/qwen3-frozen-rc-resource-bundle"

          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            "$PRIMARY_BRIDGE_URL/v1/reset-semantic-packages" \
            > "$RUNNER_TEMP/qwen3-resource-reset.json"

          app="$bundle/liliya-semantic-host-debug.apk"
          app_sha="$(sha256sum "$app" | awk '{print $1}')"
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            -H "X-Liliya-Sha256: $app_sha" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$app" \
            "$PRIMARY_BRIDGE_URL/v1/install/semantic-app" \
            > "$RUNNER_TEMP/qwen3-resource-install-app.json"

          test_apk="$bundle/liliya-semantic-host-debug-androidTest.apk"
          test_sha="$(sha256sum "$test_apk" | awk '{print $1}')"
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            -H "X-Liliya-Sha256: $test_sha" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$test_apk" \
            "$PRIMARY_BRIDGE_URL/v1/install/semantic-test" \
            > "$RUNNER_TEMP/qwen3-resource-install-test.json"

      - name: Run fixed Qwen3 instrumentation with resource sampling
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          curl --fail-with-body --silent --show-error \
            --max-time 3700 \
            -X POST \
            -H "Authorization: Bearer $token" \
            "$METRICS_BRIDGE_URL/v1/instrument/qwen3-russian-context-resources" \
            > "$RUNNER_TEMP/qwen3-frozen-rc-resource-metrics.json"

      - name: Validate and summarize resource evidence
        shell: bash
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/qwen3-frozen-rc-resource-metrics.json" \
            "$RUNNER_TEMP/qwen3-resource-device.json" \
            "$RUNNER_TEMP/qwen3-frozen-rc-resource-bundle/qwen3-frozen-rc-resource-bundle.json" \
            "$RUNNER_TEMP/qwen3-frozen-rc-resource-summary.json" \
            "$TOOLING_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          metrics_path = Path(sys.argv[1])
          device_path = Path(sys.argv[2])
          bundle_path = Path(sys.argv[3])
          out_path = Path(sys.argv[4])
          tooling_sha = sys.argv[5]

          metrics = json.loads(metrics_path.read_text(encoding='utf-8'))
          device = json.loads(device_path.read_text(encoding='utf-8'))
          bundle = json.loads(bundle_path.read_text(encoding='utf-8'))

          if not metrics.get('instrumentationPassed'):
              raise SystemExit('instrumentation did not pass')
          if metrics.get('sampleCount', 0) < 1:
              raise SystemExit('no memory samples captured')
          if metrics.get('peakTotalPssKb') is None:
              raise SystemExit('peak TOTAL PSS was not parseable')
          if device.get('primaryAbi') != 'arm64-v8a' or device.get('qemu') == '1':
              raise SystemExit('invalid physical device evidence')
          if bundle.get('sourceCommit') != '30b9ad2853bf31f17a84b524a6f643ee1d23d72f':
              raise SystemExit('bundle does not target frozen RC')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          before = metrics.get('batteryBefore', {}).get('parsed', {})
          after = metrics.get('batteryAfter', {}).get('parsed', {})
          battery_level_delta = None
          if isinstance(before.get('level'), int) and isinstance(after.get('level'), int):
              battery_level_delta = after['level'] - before['level']

          summary = {
              'evidenceClass': 'qwen3-frozen-rc-resource-summary-v1',
              'sourceCommit': '30b9ad2853bf31f17a84b524a6f643ee1d23d72f',
              'sourceTree': '232837c30ec576f9e62015154a2516028eec970b',
              'sourceRef': 'rc/30b9ad-acceptance',
              'evidenceToolingCommit': tooling_sha,
              'candidate': bundle['candidate'],
              'device': device,
              'instrumentationPassed': True,
              'elapsedMillis': metrics.get('elapsedMillis'),
              'sampleCount': metrics.get('sampleCount'),
              'sampleIntervalSeconds': metrics.get('sampleIntervalSeconds'),
              'peakTotalPssKb': metrics.get('peakTotalPssKb'),
              'peakTotalRssKb': metrics.get('peakTotalRssKb'),
              'batteryBefore': before,
              'batteryAfter': after,
              'batteryLevelDelta': battery_level_delta,
              'thermalBeforeAvailable': metrics.get('thermalBefore', {}).get('exit') == 0,
              'thermalAfterAvailable': metrics.get('thermalAfter', {}).get('exit') == 0,
              'storageBeforeAvailable': metrics.get('storageBefore', {}).get('exit') == 0,
              'storageAfterAvailable': metrics.get('storageAfter', {}).get('exit') == 0,
              'rawMetricsSha256': sha256(metrics_path),
              'verdict': 'MEASURED_NO_PRODUCT_BUDGET_APPLIED',
          }
          out_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Publish frozen RC resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-frozen-rc-resource-evidence-${{ env.RC_SHA }}
          path: |
            ${{ runner.temp }}/qwen3-frozen-rc-resource-bundle/qwen3-frozen-rc-resource-bundle.json
            ${{ runner.temp }}/qwen3-resource-primary-probe.json
            ${{ runner.temp }}/qwen3-resource-metrics-probe.json
            ${{ runner.temp }}/qwen3-resource-device.json
            ${{ runner.temp }}/qwen3-resource-reset.json
            ${{ runner.temp }}/qwen3-resource-install-app.json
            ${{ runner.temp }}/qwen3-resource-install-test.json
            ${{ runner.temp }}/qwen3-frozen-rc-resource-metrics.json
            ${{ runner.temp }}/qwen3-frozen-rc-resource-summary.json
          if-no-files-found: error
          retention-days: 30
