name: Physical Live HostBootstrap Qwen Chat Overlay Build

on:
  push:
    branches:
      - acceptance/physical-live-hostbootstrap-qwen-30b9ad
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SHA: 30b9ad2853bf31f17a84b524a6f643ee1d23d72f

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout acceptance overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen RC ancestry and test-only overlay boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_SHA" HEAD
          changed="$(git diff --name-only "$FROZEN_SHA"..HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(
            printf '%s\n' "$changed" |
            grep -v -E \
              '^(android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAuthorityAdmissionInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveStartupAdmissionGateInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAdmittedQwenExecutionInstrumentedTest\.kt|\.github/workflows/physical-live-authority-overlay-build\.yml|\.github/workflows/physical-live-startup-gate-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-source-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-https-overlay-build\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build\.yml)$' \
              || true
          )"
          test -z "$unexpected"
          echo "FROZEN_RC_PRODUCTION_SOURCE_UNCHANGED=YES"
          echo "OVERLAY_SCOPE=TEST_ONLY_HOSTBOOTSTRAP_QWEN_CHAT"

      - name: Verify frozen canonical cold-start path
        shell: bash
        run: |
          set -euo pipefail
          t='android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'
          grep -Fq 'application.configureFirstRun(input)' "$t"
          grep -Fq 'application.startApplicationRuntime()' "$t"
          grep -Fq 'ProductionAndroidAppRuntimeState.READY' "$t"
          grep -Fq 'application.runtimeOwner.send("Hello Liliya")' "$t"
          echo "CANONICAL_COLD_START_PATH_PRESENT=YES"

      - name: Patch canonical cold-start for isolated live Qwen physical acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          s = p.read_text()

          def once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one replacement, got {n}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          once(
              'import androidx.test.ext.junit.runners.AndroidJUnit4\n',
              'import android.content.Context\nimport android.content.ContextWrapper\nimport androidx.test.ext.junit.runners.AndroidJUnit4\n'
          )
          once(
              'import java.io.FileOutputStream\n',
              'import java.io.FileOutputStream\nimport java.io.ByteArrayInputStream\nimport java.net.URL\nimport java.security.KeyStore\nimport java.security.cert.CertificateFactory\nimport java.util.Base64\nimport javax.net.ssl.HttpsURLConnection\nimport javax.net.ssl.SSLContext\nimport javax.net.ssl.TrustManagerFactory\n'
          )
          once(
              'import pro.liliya.core.license.LicenseVersion\n',
              'import pro.liliya.core.license.LicenseVersion\nimport pro.liliya.core.license.JcaEcdsaP256LicenseSignatureVerifier\nimport pro.liliya.core.license.LicenseTrustedKeyResolver\nimport pro.liliya.core.license.LicenseTrustedVerificationKey\nimport pro.liliya.core.license.LicenseVerificationResult\nimport pro.liliya.core.license.LicenseVerifier\nimport pro.liliya.core.license.LicenseServiceOperation\nimport pro.liliya.core.license.LicenseServiceProtocolVersion\nimport pro.liliya.core.license.LicenseServiceRequestId\nimport pro.liliya.core.licensetransport.LicenseHttpTransportClient\nimport pro.liliya.core.licensetransport.LicenseHttpTransportConfig\nimport pro.liliya.core.licensetransport.LicenseServiceTransportRequest\n'
          )

          once(
              '''        val instrumentation = InstrumentationRegistry.getInstrumentation()\n        val targetContext = instrumentation.targetContext.applicationContext\n        val testContext = instrumentation.context\n        val application = targetContext as LiliyaApplication\n        val fixtureRoot = File(targetContext.filesDir, "development-first-working-liliya-cold-start")\n''',
              '''        val instrumentation = InstrumentationRegistry.getInstrumentation()\n        val arguments = InstrumentationRegistry.getArguments()\n        val application = instrumentation.targetContext.applicationContext as LiliyaApplication\n        val baseTargetContext = application as Context\n        val acceptanceRoot = File(baseTargetContext.filesDir, "physical-live-hostbootstrap-qwen-acceptance")\n        acceptanceRoot.deleteRecursively()\n        require(acceptanceRoot.mkdirs())\n        val targetContext = IsolatedFilesContext(baseTargetContext, acceptanceRoot)\n        val testContext = instrumentation.context\n        val fixtureRoot = File(targetContext.filesDir, "cold-start")\n\n        val endpoint = URL(requiredArgument(arguments.getString(ARG_ENDPOINT)))\n        require(endpoint.protocol == "https")\n        val caBytes = Base64.getDecoder().decode(requiredArgument(arguments.getString(ARG_CA_BASE64)))\n        try {\n            installAcceptanceTrust(caBytes)\n        } finally {\n            caBytes.fill(0)\n        }\n        val licenseMaterial = liveLicenseMaterial(application, arguments, endpoint)\n        val qwenUrl = URL(requiredArgument(arguments.getString(ARG_QWEN_CANDIDATE_URL)))\n        require(qwenUrl.protocol == "https")\n        require(qwenUrl.host == "127.0.0.1" || qwenUrl.host == "localhost")\n'''
          )

          once(
              '''            testContext.assets.open(STORIES_15M_ASSET).use { input ->\n                FileOutputStream(modelSource).use { output -> input.copyTo(output) }\n            }\n            assertEquals(STORIES_15M_BYTES, modelSource.length())\n''',
              '''            (qwenUrl.openConnection() as HttpsURLConnection).apply {\n                connectTimeout = 30_000\n                readTimeout = 120_000\n                requestMethod = "GET"\n                setRequestProperty("Accept-Encoding", "identity")\n            }.let { connection ->\n                try {\n                    connection.connect()\n                    assertEquals(HttpsURLConnection.HTTP_OK, connection.responseCode)\n                    if (connection.contentLengthLong > 0L) assertEquals(QWEN_BYTES, connection.contentLengthLong)\n                    connection.inputStream.use { input ->\n                        FileOutputStream(modelSource).use { output -> input.copyTo(output) }\n                    }\n                } finally {\n                    connection.disconnect()\n                }\n            }\n            assertEquals(QWEN_BYTES, modelSource.length())\n            assertEquals(QWEN_SHA256, sha256(modelSource))\n'''
          )

          once('            val containerBytes = 24L * 1024L * 1024L\n',
               '            val containerBytes = QWEN_BYTES + 128L * 1024L * 1024L\n')

          once('            val licenseMaterial = licenseMaterial()\n', '')

          once(
              '''                            expiresAt = Instant.parse("2027-09-10T00:00:00Z")\n''',
              '''                            expiresAt = licenseMaterial.expiresAt\n'''
          )

          once(
              '''                    productId = PRODUCT_ID,\n                    feature = FEATURE,\n                    subject = SUBJECT,\n                    now = FIXTURE_TIME,\n                    minimumRevocationEpoch = 0,\n                    minimumReplaySequence = 1,\n''',
              '''                    productId = licenseMaterial.productId,\n                    feature = licenseMaterial.feature,\n                    subject = licenseMaterial.subject,\n                    now = licenseMaterial.notBefore,\n                    minimumRevocationEpoch = licenseMaterial.revocationEpoch,\n                    minimumReplaySequence = licenseMaterial.replaySequence,\n'''
          )

          once(
              '''            val chatResult = application.runtimeOwner.send("Hello Liliya")\n''',
              '''            val chatResult = application.runtimeOwner.send("Hello Liliya /no_think")\n'''
          )

          once(
              '''            assertTrue(chat.reply.isNotBlank())\n            assertTrue(chat.reply.length <= MAX_OUTPUT_CHARS)\n''',
              '''            assertTrue(chat.reply.isNotBlank())\n            assertTrue(chat.reply.length <= MAX_OUTPUT_CHARS)\n            val evidence = android.os.Bundle().apply {\n                putString("hostQwen.liveLicense", "true")\n                putString("hostQwen.frozenCoreSignatureVerified", "true")\n                putString("hostQwen.authorityAdmission", "true")\n                putString("hostQwen.hostBootstrapReady", "true")\n                putString("hostQwen.runtimeState", "READY")\n                putString("hostQwen.qwenModel", QWEN_FILE_NAME)\n                putString("hostQwen.qwenBytes", QWEN_BYTES.toString())\n                putString("hostQwen.qwenSha256", QWEN_SHA256)\n                putString("hostQwen.qwenRevision", QWEN_REVISION)\n                putString("hostQwen.chatCompleted", "true")\n                putString("hostQwen.chatReplyChars", chat.reply.length.toString())\n                putString("hostQwen.replaySequence", licenseMaterial.replaySequence.toString())\n                putString("hostQwen.isolatedRuntimeStorage", "true")\n            }\n            instrumentation.sendStatus(2, evidence)\n            println("LILIYA_PHYSICAL_LIVE_HOSTBOOTSTRAP_QWEN_CHAT=PASS")\n'''
          )

          once(
              '''            modelDekRoot.deleteRecursively()\n        }\n    }\n\n    private fun generationRejectionReason''',
              '''            modelDekRoot.deleteRecursively()\n            acceptanceRoot.deleteRecursively()\n        }\n    }\n\n    private class IsolatedFilesContext(base: Context, private val root: File) : ContextWrapper(base) {\n        override fun getFilesDir(): File = root\n        override fun getNoBackupFilesDir(): File = File(root, "no-backup").also { it.mkdirs() }\n        override fun getApplicationContext(): Context = this\n    }\n\n    private fun requiredArgument(value: String?): String =\n        value?.takeIf { it.isNotBlank() } ?: error("missing physical HostBootstrap-Qwen argument")\n\n    private fun installAcceptanceTrust(certificateBytes: ByteArray) {\n        val certificate = CertificateFactory.getInstance("X.509")\n            .generateCertificate(ByteArrayInputStream(certificateBytes))\n        val store = KeyStore.getInstance(KeyStore.getDefaultType())\n        store.load(null)\n        store.setCertificateEntry("liliya-local-acceptance-ca", certificate)\n        val tmf = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm())\n        tmf.init(store)\n        val ssl = SSLContext.getInstance("TLS")\n        ssl.init(null, tmf.trustManagers, null)\n        HttpsURLConnection.setDefaultSSLSocketFactory(ssl.socketFactory)\n    }\n\n    private fun liveLicenseMaterial(\n        application: LiliyaApplication,\n        arguments: android.os.Bundle,\n        endpoint: URL\n    ): LicenseMaterial {\n        val encryptedStore = ProductionAndroidProductAuthEncryptedStore.create(application)\n        val probe = encryptedStore.openSecret()\n        try { assertTrue(probe.isNotEmpty()) } finally { probe.fill(0) }\n        val acquisition = ProductionAndroidLicenseEnvelopeAcquisition.acquire(\n            client = LicenseHttpTransportClient(\n                LicenseHttpTransportConfig(endpoint = endpoint, connectTimeoutMillis = 5_000, readTimeoutMillis = 10_000)\n            ),\n            request = LicenseServiceTransportRequest(\n                protocolVersion = LicenseServiceProtocolVersion(1),\n                operation = LicenseServiceOperation.ISSUE,\n                productId = LicenseProductId(LIVE_PRODUCT),\n                subjectReference = LicenseSubject(LIVE_SUBJECT),\n                requestId = LicenseServiceRequestId(LIVE_REQUEST_ID)\n            ),\n            authentication = ProductionAndroidProductAuthCredentialAdapter.bearerFactory(encryptedStore)\n        )\n        val signed = assertIs<ProductionAndroidLicenseEnvelopeAcquisitionResult.Signed>(acquisition)\n        val publicKey = Base64.getDecoder().decode(requiredArgument(arguments.getString(ARG_ENTITLEMENT_KEY_BASE64)))\n        val trusted = LicenseTrustedVerificationKey.of(\n            keyId = signed.envelope.signingKeyId,\n            algorithm = LicenseAlgorithm("ECDSA-P256-SHA256"),\n            material = publicKey\n        )\n        val verified = assertIs<LicenseVerificationResult.Verified>(\n            LicenseVerifier(\n                supportedSchemaVersion = LicenseVersion(1),\n                supportedAlgorithms = setOf(LicenseAlgorithm("ECDSA-P256-SHA256")),\n                trustedKeys = LicenseTrustedKeyResolver { id -> trusted.takeIf { it.keyId == id } },\n                signatureVerifier = JcaEcdsaP256LicenseSignatureVerifier\n            ).verify(signed.envelope)\n        )\n        val entitlement = verified.entitlement\n        return LicenseMaterial(\n            keyId = signed.envelope.signingKeyId,\n            publicKey = publicKey,\n            envelope = signed.envelope,\n            productId = entitlement.productId.value,\n            feature = entitlement.features.first().value,\n            subject = entitlement.subject.value,\n            notBefore = entitlement.notBefore,\n            expiresAt = entitlement.expiresAt,\n            revocationEpoch = entitlement.revocationEpoch.value,\n            replaySequence = entitlement.replaySequence?.value ?: 0L\n        )\n    }\n\n    private fun sha256(file: File): String {\n        val digest = java.security.MessageDigest.getInstance("SHA-256")\n        file.inputStream().use { input ->\n            val buffer = ByteArray(1024 * 1024)\n            while (true) {\n                val n = input.read(buffer)\n                if (n < 0) break\n                if (n > 0) digest.update(buffer, 0, n)\n            }\n        }\n        return digest.digest().joinToString("") { "%02x".format(it) }\n    }\n\n    private fun generationRejectionReason'''
          )

          # Extend LicenseMaterial with verified live entitlement facts.
          once(
              '''    private data class LicenseMaterial(\n        val keyId: LicenseKeyId,\n        val publicKey: ByteArray,\n        val envelope: LicenseSignedEnvelope\n    )\n''',
              '''    private data class LicenseMaterial(\n        val keyId: LicenseKeyId,\n        val publicKey: ByteArray,\n        val envelope: LicenseSignedEnvelope,\n        val productId: String = PRODUCT_ID,\n        val feature: String = FEATURE,\n        val subject: String = SUBJECT,\n        val notBefore: Instant = FIXTURE_TIME,\n        val expiresAt: Instant = Instant.parse("2027-09-10T00:00:00Z"),\n        val revocationEpoch: Long = 0L,\n        val replaySequence: Long = 1L\n    )\n'''
          )

          once(
              '''        maxTotalPlaintextBytes = 32L * 1024L * 1024L,\n        maxTotalCiphertextBodyBytes = 32L * 1024L * 1024L,\n        maxTotalProtectedPayloadBytes = 33L * 1024L * 1024L,\n        maxSegmentCount = 128,\n        minNonFinalSegmentPlaintextBytes = 64L * 1024L,\n        maxSegmentPlaintextBytes = 1024L * 1024L,\n        maxSegmentCiphertextBodyBytes = 1024L * 1024L,\n''',
              '''        maxTotalPlaintextBytes = QWEN_BYTES,\n        maxTotalCiphertextBodyBytes = QWEN_BYTES + 16L * 1024L * 1024L,\n        maxTotalProtectedPayloadBytes = QWEN_BYTES + 32L * 1024L * 1024L,\n        maxSegmentCount = 512,\n        minNonFinalSegmentPlaintextBytes = 64L * 1024L,\n        maxSegmentPlaintextBytes = SEGMENT_BYTES.toLong(),\n        maxSegmentCiphertextBodyBytes = SEGMENT_BYTES.toLong() + 64L,\n'''
          )

          once('                maxTotalPlaintextBytes = STORIES_15M_BYTES,\n',
               '                maxTotalPlaintextBytes = QWEN_BYTES,\n')
          once('                maxSegmentCount = 128,\n',
               '                maxSegmentCount = 512,\n')

          once(
              '''        const val STORIES_15M_ASSET = "stories15M-q4_0.gguf"\n        const val STORIES_15M_BYTES = 19_077_344L\n''',
              '''        const val STORIES_15M_ASSET = QWEN_FILE_NAME\n        const val STORIES_15M_BYTES = QWEN_BYTES\n        const val QWEN_FILE_NAME = "Qwen3-1.7B-Q4_K_M.gguf"\n        const val QWEN_BYTES = 1_282_439_264L\n        const val QWEN_SHA256 = "d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5"\n        const val QWEN_REVISION = "daeb8e2d528a760970442092f6bf1e55c3b659eb"\n        const val ARG_ENDPOINT = "liveLicenseEndpoint"\n        const val ARG_CA_BASE64 = "liveCaBase64"\n        const val ARG_ENTITLEMENT_KEY_BASE64 = "liveEntitlementKeyBase64"\n        const val ARG_QWEN_CANDIDATE_URL = "qwenCandidateUrl"\n        const val LIVE_PRODUCT = "liliya-pro"\n        const val LIVE_SUBJECT = "physical-android-product-auth-subject"\n        const val LIVE_REQUEST_ID = "physical-hostbootstrap-qwen-chat-001"\n'''
          )
          once('        const val SEGMENT_BYTES = 256 * 1024\n',
               '        const val SEGMENT_BYTES = 4 * 1024 * 1024\n')

          p.write_text(s)
          PY

          t='android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'
          grep -Fq 'physical-live-hostbootstrap-qwen-acceptance' "$t"
          grep -Fq 'ProductionAndroidProductAuthEncryptedStore.create(application)' "$t"
          grep -Fq 'QWEN_BYTES = 1_282_439_264L' "$t"
          grep -Fq 'QWEN_SHA256 = "d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5"' "$t"
          grep -Fq 'application.configureFirstRun(input)' "$t"
          grep -Fq 'application.startApplicationRuntime()' "$t"
          grep -Fq 'ProductionAndroidAppRuntimeState.READY' "$t"
          grep -Fq 'application.runtimeOwner.send("Hello Liliya /no_think")' "$t"
          sha256sum "$t" | tee /tmp/PATCHED_TEST_SHA256
          echo "HOSTBOOTSTRAP_QWEN_PATCH=PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned native Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build HostBootstrap Qwen acceptance instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:assembleDebugAndroidTest --console=plain --no-daemon --max-workers=2

      - name: Record APK and overlay identities
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-app/build/outputs/apk/androidTest -type f -name '*.apk' | head -1)"
          test -n "$apk"
          out="$RUNNER_TEMP/physical-live-hostbootstrap-qwen-overlay"
          mkdir -p "$out"
          cp "$apk" "$out/physical-live-hostbootstrap-qwen-androidTest.apk"
          sha256sum "$out/physical-live-hostbootstrap-qwen-androidTest.apk" | tee "$out/SHA256SUMS"
          cp /tmp/PATCHED_TEST_SHA256 "$out/PATCHED_TEST_SHA256"
          printf '%s\n' "$FROZEN_SHA" > "$out/FROZEN_SHA"
          printf '%s\n' "$(git rev-parse HEAD)" > "$out/OVERLAY_SHA"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$out/OVERLAY_TREE"
          printf '%s\n' 'Live License + isolated runtime storage + canonical configureFirstRun/startApplicationRuntime/READY/chat + exact Qwen via loopback HTTPS' > "$out/ACCEPTANCE_SCOPE"

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: physical-live-hostbootstrap-qwen-overlay-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/physical-live-hostbootstrap-qwen-overlay/**
