name: Phone Qwen3 existing installed APK model source check
on:
  push:
    branches: [main]
    paths: [.github/workflows/phone-qwen3-existing-apk-source-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 12
    steps:
      - name: Run existing installed instrumentation without APK changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, platform, urllib.request, urllib.error
          print("SOURCE_SHA="+os.environ.get("GITHUB_SHA",""), flush=True)
          print("RUNNER_NAME="+os.environ.get("RUNNER_NAME",""), flush=True)
          print("HOST_ARCH="+platform.machine(), flush=True)
          if platform.machine() not in ("aarch64","arm64"):
              raise SystemExit("FAIL_ARCH")
          token_path=pathlib.Path("/data/data/com.termux/files/home/.liliya-physical-bridge-token")
          token=token_path.read_text().strip()
          req=urllib.request.Request("http://127.0.0.1:18765/v1/qwen3-existing-source-check",headers={"Authorization":"Bearer "+token})
          try:
              with urllib.request.urlopen(req,timeout=570) as response:
                  payload=json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit("BRIDGE_HTTP_ERROR="+str(exc.code)+" "+exc.read(1000).decode("utf-8","replace"))
          output=payload.get("output","")
          print("ANDROID_INSTRUMENTATION_EXIT="+str(payload.get("exit")),flush=True)
          print("ANDROID_INSTRUMENTATION_LOG_BEGIN",flush=True)
          print(output[-16000:],flush=True)
          print("ANDROID_INSTRUMENTATION_LOG_END",flush=True)
          if payload.get("passed") is not True:
              raise SystemExit("EXISTING_QWEN3_SOURCE_INSTRUMENTATION_NOT_PASS")
          print("EXISTING_QWEN3_SOURCE_INSTRUMENTATION=PASS",flush=True)
          PY
