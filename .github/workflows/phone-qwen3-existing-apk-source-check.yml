name: Phone Qwen3 existing installed APK model source check
on:
  push:
    branches: [technical/phone-gpt-server-preflight-2026-11-03]
    paths: [.github/workflows/phone-qwen3-existing-apk-source-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 12
    steps:
      - name: Run existing installed instrumentation without APK changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          rish='/data/data/com.termux/files/usr/bin/rish'
          dex='/data/data/com.termux/files/usr/bin/rish_shizuku.dex'
          def shizuku(cmd,timeout=500):
              env=os.environ.copy()
              env['RISH_APPLICATION_ID']='com.termux'
              return subprocess.run(['/system/bin/app_process','-Djava.class.path='+dex,'/system/bin','--nice-name=rish','rikka.shizuku.shell.ShizukuShellLoader','-c',cmd],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout,env=env)
          app='pro.liliya.android.semanticprovider.qwenlocal'
          test=app+'.test'
          fd_app='pro.liliya.android.semanticprovider.qwenfd'
          fd_test=fd_app+'.test'
          for package in [app,test,fd_app,fd_test]:
              p=shizuku('pm path '+package,timeout=30)
              if p.returncode or not any(x.startswith('package:') for x in p.stdout.splitlines()):
                  raise SystemExit('ISOLATED_PACKAGE_MISSING: '+package+' '+p.stdout[-1000:])
              print('INSTALLED_PACKAGE_PRESENT='+package,flush=True)
          cmd='am instrument -w -r -e class pro.liliya.android.semanticprovider.host.Qwen3LocalSourcePreflightInstrumentedTest#authorized_local_gguf_matches_exact_candidate '+test+'/androidx.test.runner.AndroidJUnitRunner'
          p=shizuku(cmd)
          print('ANDROID_SOURCE_INSTRUMENTATION_EXIT='+str(p.returncode),flush=True)
          print('ANDROID_SOURCE_LOG_BEGIN',flush=True)
          print(p.stdout[-12000:],flush=True)
          print('ANDROID_SOURCE_LOG_END',flush=True)
          expected_sha='d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5'
          expected_bytes='qwen3Bytes=1282439264'
          if p.returncode!=0 or 'OK (1 test)' not in p.stdout or 'qwen3LocalSource=EXACT_SOURCE_VERIFIED' not in p.stdout or expected_bytes not in p.stdout or ('qwen3Sha256='+expected_sha) not in p.stdout:
              raise SystemExit('EXISTING_QWEN3_SOURCE_INSTRUMENTATION_NOT_PASS')
          print('EXISTING_QWEN3_SOURCE_INSTRUMENTATION=PASS',flush=True)
          fd_cmd='am instrument -w -r -e class pro.liliya.android.semanticprovider.host.Qwen3LocalFdBridgeInstrumentedTest#existing_qwen3_grant_exposes_seekable_descriptor_for_native_model_load '+fd_test+'/androidx.test.runner.AndroidJUnitRunner'
          fd=shizuku(fd_cmd,timeout=180)
          print('ANDROID_FD_INSTRUMENTATION_EXIT='+str(fd.returncode),flush=True)
          print('ANDROID_FD_LOG_BEGIN',flush=True)
          print(fd.stdout[-10000:],flush=True)
          print('ANDROID_FD_LOG_END',flush=True)
          if fd.returncode!=0 or 'OK (1 test)' not in fd.stdout:
              raise SystemExit('EXISTING_QWEN3_FD_PREFLIGHT_NOT_PASS')
          print('EXISTING_QWEN3_FD_PREFLIGHT=PASS',flush=True)
          jni_cmd='am instrument -w -r -e class pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest#generation_and_semantic_jni_coexist_in_one_process '+fd_test+'/androidx.test.runner.AndroidJUnitRunner'
          jni=shizuku(jni_cmd,timeout=120)
          print('ANDROID_JNI_LINK_INSTRUMENTATION_EXIT='+str(jni.returncode),flush=True)
          print('ANDROID_JNI_LINK_LOG_BEGIN',flush=True)
          print(jni.stdout[-8000:],flush=True)
          print('ANDROID_JNI_LINK_LOG_END',flush=True)
          if jni.returncode!=0 or 'OK (1 test)' not in jni.stdout:
              raise SystemExit('EXISTING_QWEN_JNI_LINK_TEST_NOT_PASS')
          print('EXISTING_QWEN_JNI_LINK_TEST=PASS',flush=True)
          PY
