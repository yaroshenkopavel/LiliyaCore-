              '''    fun infer(\n        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        maxOutputChars: Int\n    ): LlamaCppNativeInferenceResult\n\n    fun inferConstrained(\n        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        grammarUtf8: ByteArray,\n        maxOutputChars: Int\n    ): LlamaCppNativeInferenceResult = infer(nativeSessionId, promptUtf8, maxOutputChars)\n\n    fun stream(\n''',
              1
