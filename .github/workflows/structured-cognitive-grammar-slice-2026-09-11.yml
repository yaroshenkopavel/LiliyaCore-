      - name: Apply bounded grammar transport and native sampler chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}")
              p.write_text(text.replace(old, new))

          # Preserve historical redacted toString contracts while carrying grammar structurally.
          replace(
              'core/src/main/kotlin/pro/liliya/core/modelengine/ModelEngineContracts.kt',
              '''    override fun toString(): String =\n        "ModelEngineInferenceRequest(" +\n            "prompt=<redacted:${prompt.length}>, " +\n            "maxOutputChars=$maxOutputChars, " +\n            "grammar=${grammar?.let { "<redacted:${it.length}>" } ?: "<none>"})"\n''',
              '''    override fun toString(): String =\n        "ModelEngineInferenceRequest(prompt=<redacted:${prompt.length}>, maxOutputChars=$maxOutputChars)"\n''',
              1
          )
          replace(
              'core/src/main/kotlin/pro/liliya/core/cognitive/CognitiveModelRequestCompiler.kt',
              '''    override fun toString(): String =\n        "CognitiveCompiledModelRequest(" +\n            "prompt=<redacted:${prompt.length}>, " +\n            "grammar=${grammar?.let { "<redacted:${it.length}>" } ?: "<none>"})"\n''',
              '''    override fun toString(): String =\n        "CognitiveCompiledModelRequest(prompt=<redacted:${prompt.length}>)"\n''',
              1
          )

          replace(
              'core/src/main/kotlin/pro/liliya/core/cognitive/CognitiveModelRuntimeComposition.kt',
              '''                ModelEngineInferenceRequest(\n                    prompt = compiledRequest.prompt,\n                    maxOutputChars = request.maxOutputChars\n                )\n''',
              '''                ModelEngineInferenceRequest(\n                    prompt = compiledRequest.prompt,\n                    maxOutputChars = request.maxOutputChars,\n                    grammar = compiledRequest.grammar\n                )\n''',
              1
          )
          replace(
              'core/src/main/kotlin/pro/liliya/core/cognitive/CognitiveModelRuntimeComposition.kt',
              '''                request = ModelEngineInferenceRequest(\n                    prompt = compiledRequest.prompt,\n                    maxOutputChars = request.maxOutputChars\n                ),\n''',
              '''                request = ModelEngineInferenceRequest(\n                    prompt = compiledRequest.prompt,\n                    maxOutputChars = request.maxOutputChars,\n                    grammar = compiledRequest.grammar\n                ),\n''',
              1
          )

          replace(
              'android-llama-cpp-engine/src/main/kotlin/pro/liliya/android/llamacppengine/LlamaCppNativeBridge.kt',
              '''        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        maxOutputChars: Int\n''',
              '''        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        grammarUtf8: ByteArray?,\n        maxOutputChars: Int\n''',
              1
          )
          replace(
              'android-llama-cpp-engine/src/main/kotlin/pro/liliya/android/llamacppengine/LlamaCppNativeBridge.kt',
              '''        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        maxOutputChars: Int,\n        sink: LlamaCppNativeStreamingSink\n''',
              '''        nativeSessionId: Long,\n        promptUtf8: ByteArray,\n        grammarUtf8: ByteArray?,\n        maxOutputChars: Int,\n        sink: LlamaCppNativeStreamingSink\n''',
              1
          )

