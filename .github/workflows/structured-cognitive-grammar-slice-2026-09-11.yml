name: Structured Cognitive Grammar Slice 2026-09-11

on:
  push:
    branches:
      - development-structured-cognitive-grammar-v0.1
    paths:
      - .github/workflows/structured-cognitive-grammar-slice-2026-09-11.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development-structured-cognitive-grammar-v0.1
          fetch-depth: 0

      - name: Apply bounded grammar slice
        run: |
          set -euo pipefail
          python3 tools/structured_grammar_slice.py
          git rm tools/structured_grammar_slice.py
          git rm .github/workflows/structured-cognitive-grammar-slice-2026-09-11.yml
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - uses: android-actions/setup-android@v3

      - name: Install pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Run bounded grammar acceptance
        run: |
          set -euo pipefail
          gradle \
            :core:test \
            :android-llama-cpp-engine:testDebugUnitTest \
            :android-llama-cpp-engine:assembleDebug \
            --console=plain

      - name: Commit accepted slice
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "Cognitive structured grammar decoding v0.1"
          git push origin HEAD:development-structured-cognitive-grammar-v0.1
