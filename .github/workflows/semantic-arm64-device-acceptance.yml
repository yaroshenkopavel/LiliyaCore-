name: Semantic ARM64 Device Acceptance

on:
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: Successful Semantic Model Provenance run ID containing semantic-onnx-provenance
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  arm64-device:
    name: Physical Android ARM64 Semantic Resource Acceptance
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact ONNX provenance bundle
        uses: actions/download-artifact@v4
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provenance_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact ONNX bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["RUNNER_TEMP"]) / "semantic-onnx-download"
          manifests = list(root.rglob("semantic-onnx-provenance.json"))
          encoders = list(root.rglob("multilingual-e5-small-liliya-v0.1.onnx"))
          tokenizers = list(root.rglob("multilingual-e5-small-tokenizer-v0.1.onnx"))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f"unexpected provenance layout: "
                  f"manifest={manifests}, encoder={encoders}, tokenizer={tokenizers}"
              )

          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          encoder = manifest["encoder"]
          tokenizer = manifest["tokenizer"]

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder["size"]:
              raise SystemExit("encoder size mismatch")
          if digest(encoders[0]) != encoder["sha256"]:
              raise SystemExit("encoder digest mismatch")
          if tokenizers[0].stat().st_size != tokenizer["size"]:
              raise SystemExit("tokenizer size mismatch")
          if digest(tokenizers[0]) != tokenizer["sha256"]:
              raise SystemExit("tokenizer digest mismatch")

          assets = Path("android-offline-semantic-provider/src/androidTest/assets")
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"SELF_REPRODUCED_SHA256={encoder['sha256']}\n")
              env.write(f"SELF_REPRODUCED_SIZE={encoder['size']}\n")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify one physical ARM64 Android device
        shell: bash
        run: |
          set -euo pipefail
          adb start-server
          adb devices
          mapfile -t devices < <(adb devices | awk 'NR>1 && $2=="device" {print $1}')
          test "${#devices[@]}" -eq 1
          serial="${devices[0]}"
          case "$serial" in
            emulator-*) echo "emulator is not accepted for physical ARM64 gate" >&2; exit 1 ;;
          esac
          abi="$(adb -s "$serial" shell getprop ro.product.cpu.abi | tr -d '\r')"
          qemu="$(adb -s "$serial" shell getprop ro.kernel.qemu | tr -d '\r')"
          test "$abi" = "arm64-v8a"
          test "$qemu" != "1"
          echo "ANDROID_DEVICE_SERIAL=$serial" >> "$GITHUB_ENV"

      - name: Compile exact ARM64 resource instrumentation
        run: gradle :android-offline-semantic-provider:assembleDebug :android-offline-semantic-provider:assembleDebugAndroidTest -PsemanticSkipGenerationTestDependency=true --console=plain

      - name: Run exact physical ARM64 semantic resource acceptance
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SERIAL="$ANDROID_DEVICE_SERIAL"
          gradle :android-offline-semantic-provider:connectedDebugAndroidTest             -PsemanticSkipGenerationTestDependency=true             -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256="$SELF_REPRODUCED_SHA256"             -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes="$SELF_REPRODUCED_SIZE"             '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderResourceInstrumentedTest'             --console=plain

          evidence_name="semantic-resource-evidence.json"
          mapfile -t semantic_packages < <(
            adb -s "$ANDROID_DEVICE_SERIAL" shell pm list packages |
              tr -d '\r' |
              sed 's/^package://' |
              grep '^pro\.liliya\.android\.semanticprovider'
          )
          test "${#semantic_packages[@]}" -gt 0

          evidence_found=0
          for package_name in "${semantic_packages[@]}"; do
            if adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" test -f "files/$evidence_name" 2>/dev/null; then
              adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" cat "files/$evidence_name"                 > "$RUNNER_TEMP/semantic-resource-arm64-device.json"
              echo "resource evidence retrieved from app-private package: $package_name"
              evidence_found=1
              break
            fi
          done
          test "$evidence_found" -eq 1
          test -s "$RUNNER_TEMP/semantic-resource-arm64-device.json"

      - name: Validate ARM64 resource evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/semantic-resource-arm64-device.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if evidence.get("primaryAbi") != "arm64-v8a":
              raise SystemExit(f"not ARM64 evidence: {evidence.get('primaryAbi')}")
          if evidence.get("arm64ThresholdsApplied") != "true":
              raise SystemExit("ARM64 thresholds were not applied")

          required = {
              "processPssLoadDeltaBytes",
              "warmShortQueryMedianMs",
              "repeatedProcessPssBeforeBytes",
              "repeatedProcessPssAfterBytes",
              "repeatedProcessPssDeltaBytes",
              "repeatedNativeHeapBeforeBytes",
              "repeatedNativeHeapAfterBytes",
              "repeatedNativeHeapDeltaBytes",
              "flatScan1kMedianMs",
              "flatScan10kMedianMs",
              "flatIndex10kProcessPssDeltaBytes",
              "reloadCycle1LatencyMs",
              "reloadCycle2LatencyMs",
          }
          missing = sorted(required.difference(evidence))
          if missing:
              raise SystemExit(f"missing ARM64 resource evidence fields: {missing}")
          PY

      - name: Publish physical ARM64 resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-arm64-device-resource-evidence
          path: ${{ runner.temp }}/semantic-resource-arm64-device.json
          if-no-files-found: error

      - name: Run physical ARM64 real production rebuild evidence
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SERIAL="$ANDROID_DEVICE_SERIAL"
          gradle :android-offline-semantic-provider:connectedDebugAndroidTest \
            -PsemanticSkipGenerationTestDependency=true \
            -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256="$SELF_REPRODUCED_SHA256" \
            -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes="$SELF_REPRODUCED_SIZE" \
            '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderProductionResourceInstrumentedTest' \
            --console=plain

          evidence_name="post-onnx-production-resource-evidence.json"
          mapfile -t semantic_packages < <(
            adb -s "$ANDROID_DEVICE_SERIAL" shell pm list packages |
              tr -d '\r' |
              sed 's/^package://' |
              grep '^pro\.liliya\.android\.semanticprovider'
          )
          test "${#semantic_packages[@]}" -gt 0

          evidence_found=0
          for package_name in "${semantic_packages[@]}"; do
            if adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" test -f "files/$evidence_name" 2>/dev/null; then
              adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" cat "files/$evidence_name" \
                > "$RUNNER_TEMP/post-onnx-production-resource-arm64-device.json"
              evidence_found=1
              break
            fi
          done
          test "$evidence_found" -eq 1
          test -s "$RUNNER_TEMP/post-onnx-production-resource-arm64-device.json"

      - name: Validate physical ARM64 real rebuild evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/post-onnx-production-resource-arm64-device.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if evidence.get("primaryAbi") != "arm64-v8a":
              raise SystemExit(f"not ARM64 evidence: {evidence.get('primaryAbi')}")
          if evidence.get("arm64ThresholdsApplied") != "true":
              raise SystemExit("ARM64 thresholds were not applied")
          if evidence.get("realEmbeddingRebuild") != "true":
              raise SystemExit("real embedding rebuild evidence missing")

          required = {
              "artifactValidationAndOrtLoadMs",
              "fullStartup1kMs",
              "realRebuild1000LatencyMs",
              "realRebuild5000LatencyMs",
              "realRebuild10000LatencyMs",
              "realRebuild20000LatencyMs",
              "realRebuild1000PeakPssBytes",
              "realRebuild5000PeakPssBytes",
              "realRebuild10000PeakPssBytes",
              "realRebuild20000PeakPssBytes",
              "processPssReady20kBytes",
              "processPssAfterCloseBytes",
          }
          missing = sorted(required.difference(evidence))
          if missing:
              raise SystemExit(f"missing production ARM64 resource evidence fields: {missing}")
          PY

      - name: Publish physical ARM64 production resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-onnx-production-arm64-resource-evidence
          path: ${{ runner.temp }}/post-onnx-production-resource-arm64-device.json
          if-no-files-found: error

      - name: Stage verified llama.cpp generation fixture for combined residency
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-offline-semantic-provider/src/androidTest/assets"
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true" \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344

      - name: Install NDK and CMake for combined residency
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Compile combined ONNX and llama ARM64 instrumentation
        run: gradle :android-offline-semantic-provider:assembleDebug :android-offline-semantic-provider:assembleDebugAndroidTest --console=plain

      - name: Run physical ARM64 combined ONNX and llama residency evidence
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SERIAL="$ANDROID_DEVICE_SERIAL"
          gradle :android-offline-semantic-provider:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256="$SELF_REPRODUCED_SHA256" \
            -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes="$SELF_REPRODUCED_SIZE" \
            '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderCombinedEngineResourceInstrumentedTest' \
            --console=plain

          evidence_name="post-onnx-combined-engine-resource-evidence.json"
          mapfile -t semantic_packages < <(
            adb -s "$ANDROID_DEVICE_SERIAL" shell pm list packages |
              tr -d '\r' |
              sed 's/^package://' |
              grep '^pro\.liliya\.android\.semanticprovider'
          )
          test "${#semantic_packages[@]}" -gt 0

          evidence_found=0
          for package_name in "${semantic_packages[@]}"; do
            if adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" test -f "files/$evidence_name" 2>/dev/null; then
              adb -s "$ANDROID_DEVICE_SERIAL" shell run-as "$package_name" cat "files/$evidence_name" \
                > "$RUNNER_TEMP/post-onnx-combined-engine-resource-arm64-device.json"
              evidence_found=1
              break
            fi
          done
          test "$evidence_found" -eq 1
          test -s "$RUNNER_TEMP/post-onnx-combined-engine-resource-arm64-device.json"

      - name: Validate physical ARM64 combined residency evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/post-onnx-combined-engine-resource-arm64-device.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if evidence.get("primaryAbi") != "arm64-v8a":
              raise SystemExit(f"not ARM64 combined evidence: {evidence.get('primaryAbi')}")
          if evidence.get("targetProductionLlmEvidence") != "false":
              raise SystemExit("controlled GGUF fixture must not be represented as target production LLM evidence")

          required = {
              "semanticReadyPssBytes",
              "semanticReadyNativeHeapBytes",
              "combinedActivePssBytes",
              "combinedActiveNativeHeapBytes",
              "llamaActivationPssDeltaBytes",
              "llamaActivationNativeHeapDeltaBytes",
              "combinedAfterInferencePssBytes",
              "combinedInferencePssDeltaBytes",
              "afterBothClosedPssBytes",
          }
          missing = sorted(required.difference(evidence))
          if missing:
              raise SystemExit(f"missing combined ARM64 resource evidence fields: {missing}")
          if int(evidence["semanticEntryCount"]) != 20000:
              raise SystemExit("combined evidence did not use the 20k semantic index bound")
          if int(evidence["generationFixtureBytes"]) != 19077344:
              raise SystemExit("unexpected generation fixture size")
          PY

      - name: Publish physical ARM64 combined residency evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-onnx-combined-arm64-resource-evidence
          path: ${{ runner.temp }}/post-onnx-combined-engine-resource-arm64-device.json
          if-no-files-found: error
          retention-days: 30
