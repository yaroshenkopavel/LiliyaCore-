name: Phone Qwen3 test host read-only inventory
on:
  push:
    branches: [technical/phone-gpt-server-preflight-2026-11-03]
    paths:
      - .github/workflows/phone-qwen3-host-readonly-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 5
    steps:
      - name: Inspect existing test package identities and storage without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,shutil,io,re,zipfile
          rish='/data/data/com.termux/files/usr/bin/rish'
          dex='/data/data/com.termux/files/usr/bin/rish_shizuku.dex'
          mode=pathlib.Path(dex).stat().st_mode & 0o777
          print('RISH_DEX_MODE='+oct(mode),flush=True)
          if mode & 0o222: raise SystemExit('RISH_DEX_STILL_WRITABLE')
          def shizuku(cmd,timeout=30):
              env=os.environ.copy()
              env['RISH_APPLICATION_ID']='com.termux'
              return subprocess.run(['/system/bin/app_process','-Djava.class.path='+dex,'/system/bin','--nice-name=rish','rikka.shizuku.shell.ShizukuShellLoader','-c',cmd],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout,env=env)
          probe=shizuku('id')
          print('SHIZUKU_DIRECT_APP_PROCESS_PROBE_EXIT='+str(probe.returncode)+' OUTPUT='+repr(probe.stdout),flush=True)
          if probe.returncode: raise SystemExit('SHIZUKU_DIRECT_APP_PROCESS_PROBE_FAILED')
          print('RUNNER_NAME='+os.environ.get('RUNNER_NAME',''))
          who=shizuku('id')
          print('RISH_ID_EXIT='+str(who.returncode)+' OUTPUT='+repr(who.stdout))
          listed=shizuku('pm list packages -3')
          print('THIRD_PARTY_PACKAGES_EXIT='+str(listed.returncode))
          for line in listed.stdout.splitlines():
              if 'liliya' in line.lower() or 'qwen' in line.lower() or 'semanticprovider' in line.lower(): print('PHONE_PACKAGE='+line)
          for package in ('pro.liliya.app','pro.liliya.android.semanticprovider','pro.liliya.android.semanticprovider.test','pro.liliya.android.semanticprovider.qwenlocal','pro.liliya.android.semanticprovider.qwenlocal.test'):
              result=shizuku('pm path '+package)
              found=sum(line.startswith('package:') for line in result.stdout.splitlines())
              print('PKG '+package+' EXIT='+str(result.returncode)+' APK_PATH_COUNT='+str(found)+' OUTPUT='+repr(result.stdout))
          root=pathlib.Path('/storage/emulated/0/Download new')
          model=root/'Qwen3-1.7B-Q4_K_M.gguf'
          print('GGUF_PRESENT='+str(model.is_file()))
          if model.is_file():
              print('GGUF_BYTES='+str(model.stat().st_size))
          usage=shutil.disk_usage(root)
          print('SHARED_FREE_BYTES='+str(usage.free))
          test_packages=('pro.liliya.android.semanticprovider.test','pro.liliya.android.semanticprovider.qwenlocal.test','pro.liliya.android.semanticprovider.qwenfd.test','pro.liliya.android.semanticprovider.llamacancel.test','pro.liliya.android.semanticprovider.llamacancel2.test')
          def shizuku_bytes(cmd,timeout=90):
              env=os.environ.copy()
              env['RISH_APPLICATION_ID']='com.termux'
              return subprocess.run(['/system/bin/app_process','-Djava.class.path='+dex,'/system/bin','--nice-name=rish','rikka.shizuku.shell.ShizukuShellLoader','-c',cmd],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout,env=env)
          for package in test_packages:
              pr=shizuku('pm path '+package)
              apk_path=next((line[len('package:'):] for line in pr.stdout.splitlines() if line.startswith('package:')),None)
              if not apk_path:
                  print('TEST_PACKAGE_ABSENT='+package,flush=True)
                  continue
              blob=shizuku_bytes('cat '+apk_path)
              if blob.returncode:
                  print('TEST_APK_READ_FAILED='+package+' '+blob.stderr.decode(errors='replace')[-500:],flush=True)
                  continue
              classes=set()
              try:
                  with zipfile.ZipFile(io.BytesIO(blob.stdout)) as z:
                      for name in z.namelist():
                          if re.fullmatch(r'classes(?:[0-9]+)?\\.dex',name):
                              for item in re.findall(rb'L[A-Za-z0-9_/$]{2,240};',z.read(name)):
                                  value=item.decode('ascii','ignore')
                                  if any(token in value.lower() for token in ('test','qwen','llama','host')):
                                      classes.add(value)
              except Exception as e:
                  print('TEST_APK_PARSE_FAILED='+package+' '+repr(e),flush=True)
                  continue
              print('TEST_APK_BYTES='+package+' '+str(len(blob.stdout)),flush=True)
              for value in sorted(classes):
                  print('TEST_APK_CLASS='+package+' '+value,flush=True)
          print('HOST_INVENTORY_READONLY=PASS')
          PY
