name: Phone Qwen3 test host read-only inventory
on:
  push:
    branches: [technical/phone-gpt-server-preflight-2026-11-03]
    paths:
      - .github/workflows/phone-qwen3-host-readonly-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 5
    steps:
      - name: Inspect existing test package identities and storage without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,shutil
          rish='/data/data/com.termux/files/usr/bin/rish'
          dex=pathlib.Path('/data/data/com.termux/files/usr/bin/rish_shizuku.dex')
          for item in (pathlib.Path(rish),dex):
              st=item.stat()
              print('RISH_FILE '+str(item)+' real='+str(item.resolve())+' mode='+oct(st.st_mode & 0o777)+' uid='+str(st.st_uid)+' gid='+str(st.st_gid)+' bytes='+str(st.st_size)+' symlink='+str(item.is_symlink()),flush=True)
          try:
              for line in pathlib.Path(rish).read_text(errors='replace').splitlines():
                  if any(word in line.lower() for word in ('dex','chmod','writable','app_process')):
                      print('RISH_SCRIPT='+line[:300],flush=True)
          except Exception as e:
              print('RISH_SCRIPT_READ_ERROR='+repr(e),flush=True)
          probe=subprocess.run([rish,'-c','id'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
          print('RISH_PROBE_EXIT='+str(probe.returncode)+' OUTPUT='+repr(probe.stdout),flush=True)
          if probe.returncode: raise SystemExit('RISH_PROBE_FAILED')
          print('RUNNER_NAME='+os.environ.get('RUNNER_NAME',''))
          who=subprocess.run([rish,'-c','id'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
          print('RISH_ID_EXIT='+str(who.returncode)+' OUTPUT='+repr(who.stdout))
          listed=subprocess.run([rish,'-c','pm list packages -3'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
          print('THIRD_PARTY_PACKAGES_EXIT='+str(listed.returncode))
          for line in listed.stdout.splitlines():
              if 'liliya' in line.lower() or 'qwen' in line.lower() or 'semanticprovider' in line.lower(): print('PHONE_PACKAGE='+line)
          for package in ('pro.liliya.app','pro.liliya.android.semanticprovider','pro.liliya.android.semanticprovider.test','pro.liliya.android.semanticprovider.qwenlocal','pro.liliya.android.semanticprovider.qwenlocal.test'):
              result=subprocess.run([rish,'-c','pm path '+package],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
              found=sum(line.startswith('package:') for line in result.stdout.splitlines())
              print('PKG '+package+' EXIT='+str(result.returncode)+' APK_PATH_COUNT='+str(found)+' OUTPUT='+repr(result.stdout))
          root=pathlib.Path('/storage/emulated/0/Download new')
          model=root/'Qwen3-1.7B-Q4_K_M.gguf'
          print('GGUF_PRESENT='+str(model.is_file()))
          if model.is_file():
              print('GGUF_BYTES='+str(model.stat().st_size))
          usage=shutil.disk_usage(root)
          print('SHARED_FREE_BYTES='+str(usage.free))
          print('HOST_INVENTORY_READONLY=PASS')
          PY
