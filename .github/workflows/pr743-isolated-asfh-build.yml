name: PR743 isolated ASF-H APK build evidence
on:
  workflow_dispatch:
  push:
    branches:
      - test/pr743-isolated-asfh-build-20261113
    paths:
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalInstrumentedActivityLaunch.kt'
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalProductionOfflineResumeColdLaunchUiInstrumentedTest.kt'
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalProductionColdResumeFailClosedInstrumentedTest.kt'
      - '.github/workflows/pr743-isolated-asfh-build.yml'
      - 'android-app/build.gradle.kts'
  pull_request:
    paths:
      - '.github/workflows/pr743-isolated-asfh-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact PR743 source plus evidence workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify PR743 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 7ad12801635ac303b5cc1b3829eb79e31c3ec128^{commit}
          git merge-base --is-ancestor 7ad12801635ac303b5cc1b3829eb79e31c3ec128 HEAD
          echo "PR743_ANCESTRY=PASS"
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'
      - name: Configure memory
        run: bash .github/ci/configure-gradle-memory.sh
      - name: Cache llama source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/liliya-cmake-fetchcontent/*/llama_cpp-src
          key: liliya-llama-src-${{ runner.os }}-${{ hashFiles('android-llama-cpp-engine/src/main/cpp/CMakeLists.txt') }}
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install pinned Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Restore dedicated isolated signing identity when configured
        shell: bash
        env:
          ASFH_KEYSTORE_B64: ${{ secrets.LILIYA_ASFH_KEYSTORE_B64 }}
          ASFH_STORE_PASSWORD: ${{ secrets.LILIYA_ASFH_STORE_PASSWORD }}
          ASFH_KEY_ALIAS: ${{ secrets.LILIYA_ASFH_KEY_ALIAS }}
          ASFH_KEY_PASSWORD: ${{ secrets.LILIYA_ASFH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ASFH_KEYSTORE_B64" && -z "$ASFH_STORE_PASSWORD" && -z "$ASFH_KEY_ALIAS" && -z "$ASFH_KEY_PASSWORD" ]]; then
            echo "::warning::Dedicated ASF-H signing secrets not configured; ephemeral Android debug signer will change across runners"
            exit 0
          fi
          if [[ -z "$ASFH_KEYSTORE_B64" || -z "$ASFH_STORE_PASSWORD" || -z "$ASFH_KEY_ALIAS" || -z "$ASFH_KEY_PASSWORD" ]]; then
            echo "::error::Incomplete dedicated ASF-H signing secrets"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/liliya-asfh-signing"
          printf '%s' "$ASFH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/liliya-asfh-signing/isolated.jks"
          chmod 600 "$RUNNER_TEMP/liliya-asfh-signing/isolated.jks"
          echo "LILIYA_ASFH_KEYSTORE_PATH=$RUNNER_TEMP/liliya-asfh-signing/isolated.jks" >> "$GITHUB_ENV"
          echo "LILIYA_ASFH_STORE_PASSWORD=$ASFH_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LILIYA_ASFH_KEY_ALIAS=$ASFH_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LILIYA_ASFH_KEY_PASSWORD=$ASFH_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ASF_H_STABLE_SIGNING=CONFIGURED"
      - name: Compile isolated APKs and production resume tests
        run: |
          gradle :android-app:testAsfHUnitTest :android-app:assembleAsfH :android-app:assembleAsfHAndroidTest -PliliyaAsfHIsolation=true --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx1536m --console=plain
      - name: Verify isolation and manifest with SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr743-asfh"
          app="android-app/build/outputs/apk/asfH/android-app-asfH.apk"
          test_apk="android-app/build/outputs/apk/androidTest/asfH/android-app-asfH-androidTest.apk"
          test -s "$app"
          test -s "$test_apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$app" | grep -m1 "^package:" | tee "$RUNNER_TEMP/pr743-asfh/app-package.txt"
          grep -Fq "name='pro.liliya.app.asfh'" "$RUNNER_TEMP/pr743-asfh/app-package.txt"
          "$aapt" dump badging "$test_apk" | grep -m1 "^package:" | tee "$RUNNER_TEMP/pr743-asfh/test-package.txt"
          cp "$app" "$RUNNER_TEMP/pr743-asfh/"
          cp "$test_apk" "$RUNNER_TEMP/pr743-asfh/"
          (cd "$RUNNER_TEMP/pr743-asfh" && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > "$RUNNER_TEMP/pr743-asfh/SOURCE_COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/pr743-asfh/SOURCE_TREE"
          echo "ISOLATED_ASFH_BUILD=PASS"
      - name: Verify stable isolated APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          app="android-app/build/outputs/apk/asfH/android-app-asfH.apk"
          test_apk="android-app/build/outputs/apk/androidTest/asfH/android-app-asfH-androidTest.apk"
          expected="b04992d3784447a6a01099f6ad2c7f7196b6cffd86c9f378cc4b406d48e7d953"
          app_digest=$("$apksigner" verify --print-certs "$app" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test_digest=$("$apksigner" verify --print-certs "$test_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$app_digest"
          test "$app_digest" = "$test_digest"
          printf 'APK_SIGNER_SHA256=%s\n' "$app_digest" | tee "$RUNNER_TEMP/pr743-asfh/SIGNER_SHA256"
          if [[ -n "${LILIYA_ASFH_KEYSTORE_PATH:-}" ]]; then
            test "$app_digest" = "$expected"
            echo "ASF_H_STABLE_SIGNING=PASS"
          else
            echo "ASF_H_STABLE_SIGNING=NOT_CONFIGURED"
          fi
      - name: Publish APKs without device installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr743-isolated-asfh-apks-${{ github.sha }}
          path: ${{ runner.temp }}/pr743-asfh/*
          retention-days: 14
          if-no-files-found: error
