name: Physical Live License Acceptance Overlay Build

on:
  push:
    branches:
      - acceptance/physical-live-license-30b9ad
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SHA: 30b9ad2853bf31f17a84b524a6f643ee1d23d72f

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout acceptance overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen RC ancestry and overlay boundary
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$FROZEN_SHA" HEAD

          changed="$(git diff --name-only "$FROZEN_SHA"..HEAD)"

          printf '%s\n' "$changed"

          unexpected="$(
            printf '%s\n' "$changed" |
            grep -v -E \
              '^(android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveLicenseAcquisitionInstrumentedTest\.kt|\.github/workflows/physical-live-license-overlay-build\.yml)$' \
              || true
          )"

          test -z "$unexpected"

          echo "FROZEN_RC_PRODUCTION_SOURCE_UNCHANGED=YES"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned native Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build physical acceptance instrumentation APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :android-app:assembleDebugAndroidTest \
            --console=plain \
            --no-daemon \
            --max-workers=2

      - name: Record APK identity
        shell: bash
        run: |
          set -euo pipefail

          apk="$(
            find android-app/build/outputs/apk/androidTest \
              -type f -name '*.apk' |
              head -1
          )"

          test -n "$apk"
          test -f "$apk"

          mkdir -p "$RUNNER_TEMP/physical-live-license-overlay"

          cp "$apk" \
            "$RUNNER_TEMP/physical-live-license-overlay/physical-live-license-androidTest.apk"

          sha256sum \
            "$RUNNER_TEMP/physical-live-license-overlay/physical-live-license-androidTest.apk" \
            | tee \
              "$RUNNER_TEMP/physical-live-license-overlay/SHA256SUMS"

          printf '%s\n' "$FROZEN_SHA" \
            > "$RUNNER_TEMP/physical-live-license-overlay/FROZEN_SHA"

          printf '%s\n' "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/physical-live-license-overlay/OVERLAY_SHA"

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: physical-live-license-overlay-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/physical-live-license-overlay/**
