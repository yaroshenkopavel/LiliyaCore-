name: PR212 reanchor bridge

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-constrained-decoding-candidate-2026-09-11.yml

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeb5a86d15909f74465e67616121fc4bad802046
          fetch-depth: 0
      - name: Build one-commit PR212 candidate
        shell: bash
        run: |
          set -euxo pipefail
          old=origin/development-first-working-liliya-cold-start-fixture-v0.1
          constrained=origin/maintenance/pr212-constrained-decoding-candidate-2026-09-11
          paths=(
            .github/workflows/android-app-host-ci.yml
            android-app/build.gradle.kts
            android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartFixturePrerequisiteInstrumentedTest.kt
            android-app/src/androidTest/kotlin/pro/liliya/app/ProtectedModelPackagerAndroidProbeInstrumentedTest.kt
          )
          for p in "${paths[@]}"; do
            mkdir -p "$(dirname "$p")"
            git show "$old:$p" > "$p"
          done
          file=android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt
          git show "$constrained:$file" > "$file"
          sed -i '/outputGrammar = STRICT_RESPONSE_GRAMMAR,/d' "$file"
          sed -i '/maxOutputGrammarUtf8Bytes = 4_096/d' "$file"
          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = '        val STRICT_RESPONSE_GRAMMAR = """\n'
          a = s.find(marker)
          if a < 0:
              raise SystemExit('temporary grammar constant start missing')
          end_marker = '        """.trimIndent()\n'
          b = s.find(end_marker, a)
          if b < 0:
              raise SystemExit('temporary grammar constant end missing')
          b += len(end_marker)
          p.write_text(s[:a] + s[b:])
          PY
          git diff --check
          grep -Fq 'DeterministicCognitiveModelRequestCompiler()' "$file"
          grep -Fq 'maxGeneratedTokens = 512' "$file"
          grep -Fq 'const val MAX_OUTPUT_CHARS = 768' "$file"
          grep -Fq 'maxCandidatesPerSource = limits.maxRetrievalResults' "$file"
          ! grep -Fq 'STRICT_RESPONSE_GRAMMAR' "$file"
          git add -A
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --check
          git config user.name yaroshenkopavel
          git config user.email 78513566+yaroshenkopavel@users.noreply.github.com
          git commit -m 'First Working Liliya cold-start fixture v0.1'
          test "$(git rev-parse HEAD^)" = aeb5a86d15909f74465e67616121fc4bad802046
          test "$(git rev-list --count aeb5a86d15909f74465e67616121fc4bad802046..HEAD)" -eq 1
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          git push --force origin HEAD:refs/heads/maintenance/pr212-constrained-decoding-candidate-2026-09-11
