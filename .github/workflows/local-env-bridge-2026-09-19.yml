name: V05 Exact Patch Bridge 2026-09-19

on:
  push:
    branches:
      - technical/local-env-bridge-2026-09-19

permissions:
  contents: write

env:
  TARGET_SHA: d4954d4daa314f1e0f258961255bd533f6f3f23e
  TARGET_TREE: 3748c873f8572b68e6bef7aebe27f5de078b495f
  EXPECTED_TREE: 810a6938c97111e07e48afd2abb9bc5f6baef770
  PRODUCT_BRANCH: development/core-next-episodic-indexed-retrieval-407

jobs:
  publish-exact-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

      - name: Apply exact local staged patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/v05.patch
          git apply --index --binary /tmp/v05.patch
          ACTUAL_TREE="$(git write-tree)"
          echo "ACTUAL_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only

      - name: Create one clean product commit and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git checkout -b "$PRODUCT_BRANCH"
          git commit -m "Core Next: add indexed episodic retrieval (#407)"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
