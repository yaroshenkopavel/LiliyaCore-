name: V04 Exact Patch Bridge 2026-09-19

on:
  push:
    branches:
      - technical/local-env-bridge-2026-09-19

permissions:
  contents: write

env:
  TARGET_SHA: 05363da9a6ef0607ba62bb3822376a44f6eed55d
  TARGET_TREE: cd014d382311b83dc56cf43300ea293845f76c4a
  EXPECTED_TREE: 3748c873f8572b68e6bef7aebe27f5de078b495f
  PRODUCT_BRANCH: development/core-next-episodic-index-404

jobs:
  publish-exact-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

      - name: Apply exact local staged patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/v04.patch
          git apply --index --binary /tmp/v04.patch
          ACTUAL_TREE="$(git write-tree)"
          echo "ACTUAL_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --name-only

      - name: Create one clean product commit and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git checkout -b "$PRODUCT_BRANCH"
          git commit -m "Core Next: add rebuildable episodic secondary index (#404)"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
