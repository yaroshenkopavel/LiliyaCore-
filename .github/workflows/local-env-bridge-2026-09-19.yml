name: Exact Source Bridge 2026-09-19

on:
  push:
    branches:
      - technical/local-env-bridge-2026-09-19

permissions:
  contents: read

env:
  TARGET_SHA: 883af1d546358885102c06a0d19e18642cfc4e62
  TARGET_TREE: cd014d382311b83dc56cf43300ea293845f76c4a

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact target with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"

      - name: Prepare exact source mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/LiliyaCore-worktree.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/export/LiliyaCore-git.tar.gz" .git
          sha256sum "$RUNNER_TEMP/export/LiliyaCore-worktree.tar.gz" "$RUNNER_TEMP/export/LiliyaCore-git.tar.gz" > "$RUNNER_TEMP/export/source.sha256"

      - name: Upload exact source mirror
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-883af1d
          path: |
            ${{ runner.temp }}/export/LiliyaCore-worktree.tar.gz
            ${{ runner.temp }}/export/LiliyaCore-git.tar.gz
            ${{ runner.temp }}/export/source.sha256
          retention-days: 1
          compression-level: 0
