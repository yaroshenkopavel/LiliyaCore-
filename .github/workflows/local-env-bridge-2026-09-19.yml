name: Exact V04 Source Bridge 2026-09-19

on:
  push:
    branches:
      - technical/local-env-bridge-2026-09-19

permissions:
  contents: read

env:
  TARGET_SHA: d4954d4daa314f1e0f258961255bd533f6f3f23e
  TARGET_TREE: 3748c873f8572b68e6bef7aebe27f5de078b495f

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/LiliyaCore-v04-worktree.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/export/LiliyaCore-v04-git.tar.gz" .git
          sha256sum "$RUNNER_TEMP/export/"*.tar.gz > "$RUNNER_TEMP/export/source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-d4954d4
          path: ${{ runner.temp }}/export/
          retention-days: 1
          compression-level: 0
