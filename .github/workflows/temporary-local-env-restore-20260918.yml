name: Temporary Local Environment Restore Bridge

on:
  push:
    branches:
      - infra/local-env-restore-20260918
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_SHA: 25d9b6a8e118154bedafa5772b6fc0bd89469f2f
  GRADLE_USER_HOME: ${{ runner.temp }}/liliya-gradle-home

jobs:
  export-local-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-anchor to exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach "$CANONICAL_SHA"
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          printf 'HEAD=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git status --short --branch

      - name: Export exact source mirror before build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          tar --exclude='./.gradle' --exclude='*/build' --exclude='*/.cxx' \
            -I 'zstd -8 -T0' -cf "$RUNNER_TEMP/export/liliyacore-source.tar.zst" .
          test -s "$RUNNER_TEMP/export/liliyacore-source.tar.zst"
          tar -I zstd -tf "$RUNNER_TEMP/export/liliyacore-source.tar.zst" | grep -q '^./.git/'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Verify pinned versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/29.0.13113456"
          test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Warm project-only dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            --console=plain --no-daemon

      - name: Prove offline gate on exact source
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            --offline --console=plain --no-daemon

      - name: Package portable toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export/parts"

          JAVA_ROOT="$JAVA_HOME"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"

          tar -C "$JAVA_ROOT" -I 'zstd -8 -T0' -cf "$RUNNER_TEMP/export/jdk17.tar.zst" .
          tar -C "$GRADLE_ROOT" -I 'zstd -8 -T0' -cf "$RUNNER_TEMP/export/gradle-9.6.1.tar.zst" .
          tar -C "$GRADLE_USER_HOME" -I 'zstd -8 -T0' -cf "$RUNNER_TEMP/export/gradle-home.tar.zst" .

          tar -C "$ANDROID_HOME" -I 'zstd -8 -T0' -cf "$RUNNER_TEMP/export/android-sdk-core.tar.zst" \
            platforms/android-35 \
            build-tools/35.0.0 \
            build-tools/36.0.0 \
            platform-tools \
            licenses

          tar -C "$ANDROID_HOME/ndk/29.0.13113456" -I 'zstd -8 -T0' \
            -cf "$RUNNER_TEMP/export/ndk-29.0.13113456.tar.zst" .
          tar -C "$ANDROID_HOME/cmake/3.31.6" -I 'zstd -8 -T0' \
            -cf "$RUNNER_TEMP/export/cmake-3.31.6.tar.zst" .

          split -b 220M -d -a 2 "$RUNNER_TEMP/export/gradle-home.tar.zst" "$RUNNER_TEMP/export/parts/gradle-home.part."
          split -b 220M -d -a 2 "$RUNNER_TEMP/export/ndk-29.0.13113456.tar.zst" "$RUNNER_TEMP/export/parts/ndk.part."

          {
            echo "canonical_sha=$(git rev-parse HEAD)"
            echo "canonical_tree=$(git rev-parse HEAD^{tree})"
            echo "java_home=$JAVA_HOME"
            echo "gradle_root=$GRADLE_ROOT"
            echo "android_home=$ANDROID_HOME"
            echo "gradle_home_bytes=$(stat -c %s "$RUNNER_TEMP/export/gradle-home.tar.zst")"
            echo "ndk_bytes=$(stat -c %s "$RUNNER_TEMP/export/ndk-29.0.13113456.tar.zst")"
          } > "$RUNNER_TEMP/export/environment-manifest.txt"

          sha256sum \
            "$RUNNER_TEMP/export/liliyacore-source.tar.zst" \
            "$RUNNER_TEMP/export/jdk17.tar.zst" \
            "$RUNNER_TEMP/export/gradle-9.6.1.tar.zst" \
            "$RUNNER_TEMP/export/gradle-home.tar.zst" \
            "$RUNNER_TEMP/export/android-sdk-core.tar.zst" \
            "$RUNNER_TEMP/export/ndk-29.0.13113456.tar.zst" \
            "$RUNNER_TEMP/export/cmake-3.31.6.tar.zst" \
            > "$RUNNER_TEMP/export/SHA256SUMS"

          ls -lh "$RUNNER_TEMP/export" "$RUNNER_TEMP/export/parts"
          cat "$RUNNER_TEMP/export/environment-manifest.txt"

      - name: Upload source mirror
        uses: actions/upload-artifact@v4
        with:
          name: local-env-source
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/liliyacore-source.tar.zst

      - name: Upload Java 17
        uses: actions/upload-artifact@v4
        with:
          name: local-env-jdk17
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/jdk17.tar.zst

      - name: Upload Gradle 9.6.1
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/gradle-9.6.1.tar.zst

      - name: Upload Android SDK core
        uses: actions/upload-artifact@v4
        with:
          name: local-env-android-sdk-core
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/android-sdk-core.tar.zst

      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: local-env-cmake
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/cmake-3.31.6.tar.zst

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: local-env-manifest
          retention-days: 1
          path: |
            ${{ runner.temp }}/export/environment-manifest.txt
            ${{ runner.temp }}/export/SHA256SUMS

      - name: Upload Gradle cache part 00
        if: ${{ hashFiles('.bridge/never') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.00

      - name: Upload Gradle cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.01

      - name: Upload Gradle cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.02

      - name: Upload Gradle cache part 03
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.03

      - name: Upload Gradle cache part 04
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-04
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.04

      - name: Upload Gradle cache part 05
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-05
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/gradle-home.part.05

      - name: Upload NDK part 00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/ndk.part.00

      - name: Upload NDK part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/ndk.part.01

      - name: Upload NDK part 02
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/ndk.part.02

      - name: Upload NDK part 03
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: ${{ runner.temp }}/export/parts/ndk.part.03
