name: Local Environment Bridge

on:
  push:
    branches:
      - foundation/local-snapshot-bridge-2026-09-12

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 78f4b7f5333977e6aae26fc890da3599b8d47f97
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Warm project-only Gradle home
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/liliya-gradle-home"
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            --console=plain

      - name: Prove exact gate offline
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/liliya-gradle-home"
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            --offline \
            --console=plain

      - name: Pack toolchain and cache
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/liliya-export"
          mkdir -p "$out"

          printf '%s\n' "JAVA_HOME=$JAVA_HOME" > "$out/environment.txt"
          printf '%s\n' "ANDROID_HOME=$ANDROID_HOME" >> "$out/environment.txt"
          printf '%s\n' "GRADLE=$(readlink -f "$(command -v gradle)")" >> "$out/environment.txt"
          java -version 2>> "$out/environment.txt"
          gradle --version >> "$out/environment.txt"

          tar -C "$(dirname "$JAVA_HOME")" -czf "$out/jdk17.tar.gz" "$(basename "$JAVA_HOME")"

          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_root="$(cd "$(dirname "$gradle_bin")/.." && pwd)"
          tar -C "$(dirname "$gradle_root")" -czf "$out/gradle-9.6.1.tar.gz" "$(basename "$gradle_root")"

          tar -C "$ANDROID_HOME" -czf "$out/android-sdk-build.tar.gz" \
            platforms/android-35 \
            build-tools/35.0.0 \
            platform-tools \
            licenses \
            cmdline-tools || true

          tar -C "$ANDROID_HOME" -czf "$out/android-native-toolchain.tar.gz" \
            ndk/29.0.13113456 \
            cmake/3.31.6

          tar -C "$RUNNER_TEMP" -czf "$out/gradle-home.tar.gz" liliya-gradle-home

          sha256sum "$out"/*.tar.gz > "$out/SHA256SUMS"

          mkdir -p "$out/chunks"
          for f in "$out"/*.tar.gz; do
            base="$(basename "$f")"
            split -b 400M -d -a 2 "$f" "$out/chunks/${base}.part-"
          done
          cp "$out/SHA256SUMS" "$out/chunks/"
          cp "$out/environment.txt" "$out/chunks/"
          ls -lh "$out/chunks"

      - name: Upload environment bridge
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-env-78f4b7f5
          path: ${{ runner.temp }}/liliya-export/chunks/*
          if-no-files-found: error
          retention-days: 1
