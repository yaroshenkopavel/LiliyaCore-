name: Local Environment Bridge

on:
  push:
    branches:
      - foundation/local-snapshot-bridge-2026-09-12

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 78f4b7f5333977e6aae26fc890da3599b8d47f97
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Warm project-only Gradle home
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/liliya-gradle-home"
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            --console=plain

      - name: Prove same-workspace gate offline
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/liliya-gradle-home"
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            --offline \
            --console=plain

      - name: Prepare exact pinned llama.cpp source cache
        shell: bash
        run: |
          set -euo pipefail
          llama="$RUNNER_TEMP/llama-cpp-pinned"
          rm -rf "$llama"
          git init -q "$llama"
          git -C "$llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$llama" fetch --depth=1 origin 0f3a71be15af836d277c9f918adfafb45732677e
          git -C "$llama" checkout -q --detach FETCH_HEAD
          test "$(git -C "$llama" rev-parse HEAD)" = "0f3a71be15af836d277c9f918adfafb45732677e"

      - name: Pack toolchain, dependency cache and pinned native source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.local-env-export"
          rm -rf "$out"
          mkdir -p "$out/chunks" "$out/jdk17-root"

          printf '%s\n' "CANONICAL_MAIN=78f4b7f5333977e6aae26fc890da3599b8d47f97" > "$out/environment.txt"
          printf '%s\n' "CANONICAL_TREE=59b351cd3bb5bf4e21fde079ba1797a175e9b14a" >> "$out/environment.txt"
          printf '%s\n' "LLAMA_CPP_COMMIT=0f3a71be15af836d277c9f918adfafb45732677e" >> "$out/environment.txt"
          java -version 2>> "$out/environment.txt"
          gradle --version >> "$out/environment.txt"

          cp -aL "$JAVA_HOME/." "$out/jdk17-root/"
          tar -C "$out" -czf "$out/jdk17.tar.gz" jdk17-root
          rm -rf "$out/jdk17-root"

          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_root="$(cd "$(dirname "$gradle_bin")/.." && pwd)"
          tar -C "$(dirname "$gradle_root")" -czf "$out/gradle-9.6.1.tar.gz" "$(basename "$gradle_root")"

          tar -C "$ANDROID_HOME" -czf "$out/android-sdk-build.tar.gz" \
            platforms/android-35 \
            build-tools/35.0.0 \
            platform-tools \
            licenses \
            cmdline-tools

          tar -C "$ANDROID_HOME" -czf "$out/android-native-toolchain.tar.gz" \
            ndk/29.0.13113456 \
            cmake/3.31.6

          tar -C "$RUNNER_TEMP" -czf "$out/gradle-home.tar.gz" liliya-gradle-home
          tar -C "$RUNNER_TEMP" -czf "$out/llama-cpp-pinned.tar.gz" llama-cpp-pinned

          sha256sum "$out"/*.tar.gz > "$out/SHA256SUMS"
          for f in "$out"/*.tar.gz; do
            base="$(basename "$f")"
            split -b 280M -d -a 2 "$f" "$out/chunks/${base}.part-"
          done
          cp "$out/SHA256SUMS" "$out/chunks/"
          cp "$out/environment.txt" "$out/chunks/"
          ls -lh "$out"/*.tar.gz "$out/chunks"/*

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: local-env-metadata-78f4b7f5
          path: |
            .local-env-export/chunks/SHA256SUMS
            .local-env-export/chunks/environment.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-jdk17-p00-78f4b7f5
          path: .local-env-export/chunks/jdk17.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-jdk17-p01-78f4b7f5
          path: .local-env-export/chunks/jdk17.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Gradle p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-p00-78f4b7f5
          path: .local-env-export/chunks/gradle-9.6.1.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload Gradle p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-p01-78f4b7f5
          path: .local-env-export/chunks/gradle-9.6.1.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK build p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-sdk-build-p00-78f4b7f5
          path: .local-env-export/chunks/android-sdk-build.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload SDK build p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-sdk-build-p01-78f4b7f5
          path: .local-env-export/chunks/android-sdk-build.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload native p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-native-p00-78f4b7f5
          path: .local-env-export/chunks/android-native-toolchain.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload native p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-native-p01-78f4b7f5
          path: .local-env-export/chunks/android-native-toolchain.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload native p02
        uses: actions/upload-artifact@v4
        with:
          name: local-env-native-p02-78f4b7f5
          path: .local-env-export/chunks/android-native-toolchain.tar.gz.part-02
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload native p03
        uses: actions/upload-artifact@v4
        with:
          name: local-env-native-p03-78f4b7f5
          path: .local-env-export/chunks/android-native-toolchain.tar.gz.part-03
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Gradle home p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-p00-78f4b7f5
          path: .local-env-export/chunks/gradle-home.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload Gradle home p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-p01-78f4b7f5
          path: .local-env-export/chunks/gradle-home.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Gradle home p02
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-p02-78f4b7f5
          path: .local-env-export/chunks/gradle-home.tar.gz.part-02
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Gradle home p03
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-p03-78f4b7f5
          path: .local-env-export/chunks/gradle-home.tar.gz.part-03
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Gradle home p04
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-p04-78f4b7f5
          path: .local-env-export/chunks/gradle-home.tar.gz.part-04
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload llama.cpp p00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-llama-p00-78f4b7f5
          path: .local-env-export/chunks/llama-cpp-pinned.tar.gz.part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload llama.cpp p01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-llama-p01-78f4b7f5
          path: .local-env-export/chunks/llama-cpp-pinned.tar.gz.part-01
          if-no-files-found: ignore
          retention-days: 1
