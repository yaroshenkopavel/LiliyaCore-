name: Liliya Windows Laptop Control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "Allowed command: health, core-test, or asf-h-usb-evidence"
        required: true
        type: choice
        options:
          - health
          - core-test
          - asf-h-usb-evidence
      ref:
        description: "Optional repository ref for core-test or asf-h-usb-evidence"
        required: false
        default: "main"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: liliya-windows-laptop-control
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'yaroshenkopavel' &&
       startsWith(github.event.comment.body, '/liliya-laptop '))
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.resolve.outputs.command }}
      ref: ${{ steps.resolve.outputs.ref }}
      allowed: ${{ steps.resolve.outputs.allowed }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            let command;
            let ref;
            if (event === 'workflow_dispatch') {
              command = context.payload.inputs.command;
              ref = context.payload.inputs.ref || 'main';
            } else {
              const body = (context.payload.comment.body || '').trim();
              const match = body.match(/^\/liliya-laptop\s+(health|core-test|asf-h-usb-evidence)$/);
              if (!match) {
                core.setOutput('allowed', 'false');
                return;
              }
              command = match[1];
              if (context.payload.issue.pull_request) {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number
                });
                if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                  core.setFailed('Refusing to execute code from a fork on the laptop runner.');
                  return;
                }
                ref = pr.data.head.sha;
              } else {
                ref = 'main';
              }
            }
            if (!['health', 'core-test', 'asf-h-usb-evidence'].includes(command)) {
              core.setOutput('allowed', 'false');
              return;
            }
            core.setOutput('command', command);
            core.setOutput('ref', ref);
            core.setOutput('allowed', 'true');

  laptop:
    needs: resolve
    if: needs.resolve.outputs.allowed == 'true'
    runs-on: [self-hosted, Windows, X64, liliya-laptop]
    timeout-minutes: 60
    steps:
      - name: Laptop identity and health
        if: needs.resolve.outputs.command == 'health'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "LILIYA_LAPTOP_HEALTH=START"
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "USER=$env:USERNAME"
          Write-Host "PS_VERSION=$($PSVersionTable.PSVersion)"
          Write-Host "JAVA="
          java -version
          Write-Host "GIT="
          git --version
          Write-Host "GRADLE="
          gradle --version
          Write-Host "POSTGRESQL_SERVICES="
          Get-Service | Where-Object { $_.Name -like 'postgresql*' } |
            Select-Object Name,Status,StartType | Format-Table -AutoSize
          Write-Host "PORTS="
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in 5432,8200,8443 } |
            Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize
          Write-Host "LILIYA_SERVER_EXISTS=$(Test-Path 'C:\LiliyaServer')"
          Write-Host "LILIYA_LAPTOP_HEALTH=PASS"

      - name: Checkout requested exact ref
        if: needs.resolve.outputs.command == 'core-test' || needs.resolve.outputs.command == 'asf-h-usb-evidence'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1

      - name: Core targeted test gate
        if: needs.resolve.outputs.command == 'core-test'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Core-only test must not depend on or probe the interactive user's private profile.
          # The runner service executes as NETWORK SERVICE; probing C:\Users\123 can fail by ACL.
          # Keep Gradle/Kotlin memory bounded for the 8 GB laptop and avoid a separate Kotlin daemon.
          $env:GRADLE_USER_HOME = Join-Path $env:RUNNER_TEMP 'liliya-gradle-user-home'
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          @'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          '@ | Set-Content -Path (Join-Path $env:GRADLE_USER_HOME 'gradle.properties') -Encoding ASCII

          Write-Host '=== Windows laptop Gradle/Kotlin memory policy ==='
          Get-Content (Join-Path $env:GRADLE_USER_HOME 'gradle.properties')
          Write-Host '=== Physical memory ==='
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,FreePhysicalMemory |
            Format-List

          gradle.bat :core:test --configure-on-demand --no-daemon --console=plain --info --stacktrace

      - name: Set up Java 17 for ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install pinned Android toolchain for ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build and measure exact ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        shell: powershell
        env:
          EXPECTED_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_REF) {
            throw "EXACT_REF_MISMATCH expected=$env:EXPECTED_REF actual=$head"
          }
          Write-Host "ASF_H_EXACT_HEAD=$head"

          $env:GRADLE_USER_HOME = Join-Path $env:RUNNER_TEMP 'liliya-asfh-gradle-user-home'
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          @'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          '@ | Set-Content -Path (Join-Path $env:GRADLE_USER_HOME 'gradle.properties') -Encoding ASCII

          $adb = (Get-Command adb.exe -ErrorAction Stop).Source
          $deviceLines = @(& $adb devices | Select-Object -Skip 1 | Where-Object { $_ -match '\tdevice })
          if ($deviceLines.Count -ne 1) {
            throw "EXACTLY_ONE_AUTHORIZED_USB_ADB_DEVICE_REQUIRED count=$($deviceLines.Count)"
          }
          Write-Host "ASF_H_USB_DEVICE=$($deviceLines[0])"

          gradle.bat :android-app:assembleDebug :android-app:assembleDebugAndroidTest --console=plain
          if ($LASTEXITCODE -ne 0) { throw "ASF_H_APK_BUILD_FAILED_$LASTEXITCODE" }

          $app = 'android-app\build\outputs\apk\debug\android-app-debug.apk'
          $test = 'android-app\build\outputs\apk\androidTest\debug\android-app-debug-androidTest.apk'
          if (!(Test-Path $app) -or !(Test-Path $test)) {
            throw 'ASF_H_APK_OUTPUT_MISSING'
          }

          $out = Join-Path $env:RUNNER_TEMP 'asf-h-usb-adb-evidence'
          & '.\tools\physical-runner\Measure-AsfHUsbAdb.ps1' -Adb $adb -AppApk $app -TestApk $test -OutputDir $out
          if ($LASTEXITCODE -ne 0) { throw "ASF_H_USB_MEASUREMENT_FAILED_$LASTEXITCODE" }

          $evidence = Join-Path $out 'asf-h-usb-adb-physical-resource-evidence.json'
          if (!(Test-Path $evidence)) { throw 'ASF_H_USB_EVIDENCE_MISSING' }
          $raw = Get-Content $evidence -Raw
          $parsed = $raw | ConvertFrom-Json
          if ($parsed.sourceCommit -ne $head) {
            throw "ASF_H_SOURCE_COMMIT_MISMATCH expected=$head actual=$($parsed.sourceCommit)"
          }
          if ($parsed.transport -ne 'usb-adb') {
            throw "ASF_H_TRANSPORT_MISMATCH actual=$($parsed.transport)"
          }
          if (@($parsed.results).Count -ne 2) {
            throw 'ASF_H_RESULT_COUNT_MISMATCH'
          }
          if (@($parsed.results | Where-Object { -not $_.instrumentationPassed }).Count -ne 0) {
            throw 'ASF_H_INSTRUMENTATION_FAILED'
          }

          $bytes = [Text.Encoding]::UTF8.GetBytes($raw)
          $base64 = [Convert]::ToBase64String($bytes)
          Write-Host 'ASF_H_EVIDENCE_JSON_BASE64_BEGIN'
          Write-Host $base64
          Write-Host 'ASF_H_EVIDENCE_JSON_BASE64_END'
          Write-Host 'ASF_H_USB_EVIDENCE=PASS'

      - name: Upload ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asf-h-usb-adb-evidence-${{ needs.resolve.outputs.ref }}
          path: ${{ runner.temp }}\asf-h-usb-adb-evidence
          if-no-files-found: warn
