name: Liliya Windows Laptop Control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "Allowed command: health, usb-preflight, sdk-prep, llama-source-prep, core-test, or asf-h-usb-evidence"
        required: true
        type: choice
        options:
          - health
          - usb-preflight
          - sdk-prep
          - llama-source-prep
          - core-test
          - asf-h-usb-evidence
      ref:
        description: "Optional repository ref for core-test or asf-h-usb-evidence"
        required: false
        default: "main"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  resolve:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'yaroshenkopavel') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'yaroshenkopavel' &&
       startsWith(github.event.comment.body, '/liliya-laptop '))
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.resolve.outputs.command }}
      ref: ${{ steps.resolve.outputs.ref }}
      allowed: ${{ steps.resolve.outputs.allowed }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            let command;
            let ref;
            if (event === 'workflow_dispatch') {
              command = context.payload.inputs.command;
              ref = context.payload.inputs.ref || 'main';
            } else {
              const body = (context.payload.comment.body || '').trim();
              const match = body.match(/^\/liliya-laptop\s+(health|usb-preflight|sdk-prep|llama-source-prep|core-test|asf-h-usb-evidence)$/);
              if (!match) {
                core.setOutput('allowed', 'false');
                return;
              }
              command = match[1];
              if (context.payload.issue.pull_request) {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number
                });
                if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                  core.setFailed('Refusing to execute code from a fork on the laptop runner.');
                  return;
                }
                ref = pr.data.head.sha;
              } else {
                ref = 'main';
              }
            }
            if (!['health', 'usb-preflight', 'sdk-prep', 'llama-source-prep', 'core-test', 'asf-h-usb-evidence'].includes(command)) {
              core.setOutput('allowed', 'false');
              return;
            }
            // Never execute unreviewed pull-request code or arbitrary refs on the
            // self-hosted Windows runner sharing a host with licensing services.
            const mainBranch = context.payload.repository.default_branch;
            const branchInfo = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: mainBranch
            });
            const trustedSha = branchInfo.data.commit.sha;
            if (ref === mainBranch) ref = trustedSha;
            if (command !== 'health' && ref !== trustedSha) {
              core.setFailed('LAPTOP_UNTRUSTED_REF_REJECTED: only exact default-branch SHA may execute on this host');
              return;
            }
            core.setOutput('command', command);
            core.setOutput('ref', ref);
            core.setOutput('allowed', 'true');
            if (event === 'issue_comment' && context.payload.issue.pull_request) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              core.info(['LILIYA_LAPTOP_CONTROL_ACK', `command=${command}`, `ref=${ref}`, `run=${runUrl}`].join(' '));
            }

  laptop:
    needs: resolve
    concurrency:
      group: liliya-windows-laptop-physical
      cancel-in-progress: false
    # Reject non-main dispatches before allocating the privileged host runner.
    if: needs.resolve.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, liliya-laptop]
    timeout-minutes: 60
    steps:
      - name: Laptop identity and health
        if: needs.resolve.outputs.command == 'health'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "LILIYA_LAPTOP_HEALTH=START"
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "USER=$env:USERNAME"
          Write-Host "PS_VERSION=$($PSVersionTable.PSVersion)"
          Write-Host "JAVA="
          java -version
          Write-Host "GIT="
          git --version
          Write-Host "GRADLE="
          gradle --version
          Write-Host "POSTGRESQL_SERVICES="
          Get-Service | Where-Object { $_.Name -like 'postgresql*' } |
            Select-Object Name,Status,StartType | Format-Table -AutoSize
          Write-Host "PORTS="
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in 5432,8200,8443 } |
            Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize
          Write-Host "LILIYA_SERVER_EXISTS=$(Test-Path 'C:\LiliyaServer')"
          # Read-only boundary observations. Do not open secrets or probe backend ports.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          try {
            # Enumeration success (including an empty directory) is the access signal.
            $null = [IO.Directory]::GetFileSystemEntries('C:\LiliyaServer')
            Write-Host "RUNNER_BACKEND_DIR_LISTABLE=True"
          } catch [UnauthorizedAccessException] {
            Write-Host "RUNNER_BACKEND_DIR_LISTABLE=False"
          } catch [IO.DirectoryNotFoundException] {
            Write-Host "RUNNER_BACKEND_DIR_MISSING=True"
          } catch {
            Write-Host "RUNNER_BACKEND_DIR_CHECK_INDETERMINATE=True"
          }
          # Fixed path allowlist only. Report no names, ACL entries, or file contents.
          $boundaryPaths = [ordered]@{
            OPENBAO_CONFIG = 'C:\LiliyaServer\config\openbao'
            BACKEND_CONFIG = 'C:\LiliyaServer\config'
            BACKEND_BACKUP = 'C:\LiliyaServer\backups'
          }
          foreach ($entry in $boundaryPaths.GetEnumerator()) {
            $status = 'INDETERMINATE'
            try {
              $null = [IO.Directory]::GetFileSystemEntries($entry.Value)
              $status = 'LISTABLE'
            } catch [UnauthorizedAccessException] {
              $status = 'DENIED'
            } catch [IO.DirectoryNotFoundException] {
              $status = 'MISSING'
            } catch {
              $status = 'INDETERMINATE'
            }
            Write-Host "RUNNER_BOUNDARY_$($entry.Key)=$status"
          }
          # Metadata-only probes for fixed sensitive file paths: never open files.
          $protectedFiles = [ordered]@{
            OPENBAO_CA = 'C:\LiliyaServer\config\openbao\tls\ca.crt'
            OPENBAO_BAO_EXE = 'C:\LiliyaServer\bin\bao.exe'
          }
          foreach ($entry in $protectedFiles.GetEnumerator()) {
            $status = 'INDETERMINATE'
            try {
              $item = Get-Item -LiteralPath $entry.Value -ErrorAction Stop
              $status = if ($item.PSIsContainer) { 'UNEXPECTED_DIRECTORY' } else { 'METADATA_VISIBLE' }
            } catch [System.UnauthorizedAccessException] {
              $status = 'DENIED'
            } catch [System.Management.Automation.ItemNotFoundException] {
              $status = 'MISSING'
            } catch {
              $status = 'INDETERMINATE'
            }
            Write-Host "RUNNER_FILE_METADATA_$($entry.Key)=$status"
          }
          Write-Host "RUNNER_IS_ADMIN=$isAdmin"
          Write-Host "RUNNER_BOUNDARY_AUDIT=OBSERVATIONS_ONLY"
          Write-Host "LILIYA_LAPTOP_HEALTH=PASS"

      - name: Read-only USB ADB preflight
        if: needs.resolve.outputs.command == 'usb-preflight'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner executes as NETWORK SERVICE; never probe interactive
          # user profiles (Test-Path raises UnauthorizedAccessException there).
          $adbCandidates = @()
          if ($env:RUNNER_TOOL_CACHE) {
            $adbCandidates += Join-Path $env:RUNNER_TOOL_CACHE 'liliya-android-sdk-api35-buildtools35-v1\platform-tools\adb.exe'
          }
          $adbCandidates += 'C:\Android\Sdk\platform-tools\adb.exe'
          $pathAdb = Get-Command adb.exe -ErrorAction SilentlyContinue
          if ($pathAdb) { $adbCandidates += $pathAdb.Source }
          $adb = $null
          foreach ($candidate in $adbCandidates) {
            try {
              if (Test-Path -LiteralPath $candidate -ErrorAction Stop) {
                $adb = $candidate
                break
              }
            } catch [System.UnauthorizedAccessException] {
              continue
            }
          }
          if (-not $adb) {
            # Provision only official ADB platform-tools into job-owned temp.
            # Do not read or modify the interactive user's profile.
            $zip = Join-Path $env:RUNNER_TEMP 'platform-tools-latest-windows.zip'
            $dest = Join-Path $env:RUNNER_TEMP 'liliya-usb-preflight-tools'
            Write-Host 'USB_PREFLIGHT_ADB_PROVISION=OFFICIAL_PLATFORM_TOOLS'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
            $adb = Join-Path $dest 'platform-tools\adb.exe'
            if (-not (Test-Path -LiteralPath $adb)) { throw 'USB_PREFLIGHT_PLATFORM_TOOLS_PROVISION_FAILED' }
          }
          Write-Host 'USB_PREFLIGHT=START'
          $listing = @(& $adb devices -l)
          $listing | ForEach-Object { Write-Host $_ }
          $usb = @($listing | Where-Object { $_ -match '^([^:\s]+)\s+device(?:\s|$)' })
          if ($usb.Count -ne 1) {
            throw "USB_PREFLIGHT_EXPECT_ONE_USB_DEVICE count=$($usb.Count)"
          }
          $serial = [regex]::Match($usb[0], '^([^\s]+)').Groups[1].Value
          $model = (& $adb -s $serial shell getprop ro.product.model | Out-String).Trim()
          $abi = (& $adb -s $serial shell getprop ro.product.cpu.abi | Out-String).Trim()
          $sdk = (& $adb -s $serial shell getprop ro.build.version.sdk | Out-String).Trim()
          Write-Host "USB_PREFLIGHT_SERIAL=$serial"
          Write-Host "USB_PREFLIGHT_MODEL=$model"
          Write-Host "USB_PREFLIGHT_ABI=$abi"
          Write-Host "USB_PREFLIGHT_SDK=$sdk"
          if ($abi -ne 'arm64-v8a' -or [int]$sdk -lt 29) {
            throw 'USB_PREFLIGHT_TARGET_MISMATCH'
          }
          Write-Host 'USB_PREFLIGHT=PASS_NO_INSTALL_NO_RESET'

      - name: Checkout requested exact ref
        if: needs.resolve.outputs.command == 'core-test' || needs.resolve.outputs.command == 'asf-h-usb-evidence'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1

      - name: Core targeted test gate
        if: needs.resolve.outputs.command == 'core-test'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Core-only test must not depend on or probe the interactive user's private profile.
          # The runner service executes as NETWORK SERVICE; probing C:\Users\123 can fail by ACL.
          # Keep Gradle/Kotlin memory bounded for the 8 GB laptop and avoid a separate Kotlin daemon.
          $env:GRADLE_USER_HOME = Join-Path $env:RUNNER_TEMP 'liliya-gradle-user-home'
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          @'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          '@ | Set-Content -Path (Join-Path $env:GRADLE_USER_HOME 'gradle.properties') -Encoding ASCII

          Write-Host '=== Windows laptop Gradle/Kotlin memory policy ==='
          Get-Content (Join-Path $env:GRADLE_USER_HOME 'gradle.properties')
          Write-Host '=== Physical memory ==='
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,FreePhysicalMemory |
            Format-List

          gradle.bat :core:test --configure-on-demand --no-daemon --console=plain --info --stacktrace

      - name: Validate ASF-H measurement script before SDK provisioning
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'tools\physical-runner\Measure-AsfHUsbAdb.ps1'
          if (!(Test-Path $script)) { throw 'ASF_H_MEASUREMENT_SCRIPT_MISSING' }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'ASF_H_MEASUREMENT_SCRIPT_PARSE_FAILED'
          }
          Write-Host 'ASF_H_SCRIPT_PREFLIGHT=PASS'

      - name: Set up Java 17 for ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence' || needs.resolve.outputs.command == 'sdk-prep'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision service-owned Android SDK for ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence' || needs.resolve.outputs.command == 'sdk-prep'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Persist SDK across jobs on this dedicated self-hosted runner.
          $cacheRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { Join-Path $env:RUNNER_TEMP 'tool-cache' }
          $sdk = Join-Path $cacheRoot 'liliya-android-sdk-api35-buildtools35-v1'
          $zip = Join-Path $env:RUNNER_TEMP 'android-commandlinetools.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-unpack'
          $url = 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip'

          $adb = Join-Path $sdk 'platform-tools\adb.exe'
          $platform = Join-Path $sdk 'platforms\android-35\android.jar'
          $buildTools = Join-Path $sdk 'build-tools\35.0.0\aapt2.exe'
          $sdkManager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          $cacheValid = (Test-Path $adb) -and (Test-Path $platform) -and
                        (Test-Path $buildTools) -and (Test-Path $sdkManager)
          if ($cacheValid) {
            Write-Host 'ANDROID_SDK_CACHE=HIT'
          } else {
            Write-Host 'ANDROID_SDK_CACHE=MISS'
            Remove-Item $sdk -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $sdk,$unpack | Out-Null

            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            if (!(Test-Path $zip)) { throw 'ANDROID_CMDLINE_TOOLS_DOWNLOAD_MISSING' }
            Expand-Archive -LiteralPath $zip -DestinationPath $unpack -Force
  
            $cmdlineLatest = Join-Path $sdk 'cmdline-tools\latest'
            New-Item -ItemType Directory -Force -Path $cmdlineLatest | Out-Null
            $source = Join-Path $unpack 'cmdline-tools'
            if (!(Test-Path (Join-Path $source 'bin\sdkmanager.bat'))) {
              throw 'ANDROID_SDKMANAGER_ARCHIVE_LAYOUT_INVALID'
            }
            Copy-Item -Path (Join-Path $source '*') -Destination $cmdlineLatest -Recurse -Force
  
            $sdkmanager = Join-Path $cmdlineLatest 'bin\sdkmanager.bat'
            $answers = Join-Path $env:RUNNER_TEMP 'android-sdk-license-answers.txt'
            (1..100 | ForEach-Object { 'y' }) | Set-Content -LiteralPath $answers -Encoding ascii
  
            $licenseCmd = '""' + $sdkmanager + '" --sdk_root="' + $sdk + '" --licenses < "' + $answers + '""'
            & cmd.exe /d /s /c $licenseCmd
            if ($LASTEXITCODE -ne 0) { throw "ANDROID_SDK_LICENSES_FAILED_$LASTEXITCODE" }
  
            $installCmd = '""' + $sdkmanager + '" --sdk_root="' + $sdk + '" "platform-tools" "platforms;android-35" "build-tools;35.0.0" < "' + $answers + '""'
            & cmd.exe /d /s /c $installCmd
            if ($LASTEXITCODE -ne 0) { throw "ANDROID_SDK_PACKAGES_FAILED_$LASTEXITCODE" }
  
          }

          $adb = Join-Path $sdk 'platform-tools\adb.exe'
          $platform = Join-Path $sdk 'platforms\android-35\android.jar'
          $buildTools = Join-Path $sdk 'build-tools\35.0.0\aapt2.exe'
          if (!(Test-Path $adb)) { throw "ADB_MISSING path=$adb" }
          if (!(Test-Path $platform)) { throw "ANDROID_PLATFORM_35_MISSING path=$platform" }
          if (!(Test-Path $buildTools)) { throw "ANDROID_BUILD_TOOLS_35_MISSING path=$buildTools" }
          # Install missing native build prerequisites once in persistent service SDK.
          # The physical measurement stage must never be the first consumer.
          $required = @(
            @{ Path = 'build-tools\36.0.0\aapt2.exe'; Package = 'build-tools;36.0.0' },
            @{ Path = 'ndk\29.0.13113456\source.properties'; Package = 'ndk;29.0.13113456' },
            @{ Path = 'cmake\3.31.6\bin\cmake.exe'; Package = 'cmake;3.31.6' }
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $sdk $_.Path)) })
          if ($missing.Count -gt 0) {
            Write-Host "ANDROID_NATIVE_PREREQ_MISSING=$($missing.Count)"
            $answers = Join-Path $env:RUNNER_TEMP 'android-sdk-native-answers.txt'
            (1..100 | ForEach-Object { 'y' }) | Set-Content -LiteralPath $answers -Encoding ascii
            $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
            $packages = ($missing | ForEach-Object { '"' + $_.Package + '"' }) -join ' '
            $installCmd = '""' + $sdkmanager + '" --sdk_root="' + $sdk + '" ' + $packages + ' < "' + $answers + '""'
            & cmd.exe /d /s /c $installCmd
            if ($LASTEXITCODE -ne 0) { throw "ANDROID_NATIVE_PREREQ_INSTALL_FAILED_$LASTEXITCODE" }
          }
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $sdk $item.Path))) {
              throw "ANDROID_NATIVE_PREREQ_NOT_READY_$($item.Package)"
            }
            Write-Host "ANDROID_NATIVE_PREREQ_READY=$($item.Package)"
          }
          Write-Host 'ANDROID_SERVICE_SDK_PREP=PASS'
          Write-Host "ANDROID_SDK_CACHE_PATH=$sdk"

          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdk 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $sdk 'build-tools\35.0.0') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "ANDROID_SDK=$sdk"
          & $adb version

      - name: Prepare pinned llama.cpp checkout in persistent cache
        if: needs.resolve.outputs.command == 'llama-source-prep'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '0f3a71be15af836d277c9f918adfafb45732677e'
          $cacheRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { Join-Path $env:RUNNER_TEMP 'tool-cache' }
          $sourceDir = Join-Path $cacheRoot "liliya-llama-source-$commit"
          $gitDir = Join-Path $sourceDir '.git'
          if (-not (Test-Path -LiteralPath $gitDir)) {
            New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
            & git -C $sourceDir init
            if ($LASTEXITCODE -ne 0) { throw 'LLAMA_SOURCE_GIT_INIT_FAILED' }
            & git -C $sourceDir remote add origin 'https://github.com/ggml-org/llama.cpp.git'
            if ($LASTEXITCODE -ne 0) { throw 'LLAMA_SOURCE_REMOTE_FAILED' }
          }
          $current = (& git -C $sourceDir rev-parse HEAD 2>$null | Out-String).Trim()
          if ($current -ne $commit) {
            # Only obtain the reviewed commit, not the full upstream history.
            & git -C $sourceDir -c protocol.version=2 fetch --depth=1 origin $commit
            if ($LASTEXITCODE -ne 0) { throw 'LLAMA_SOURCE_PINNED_FETCH_FAILED' }
            & git -C $sourceDir -c core.longpaths=true checkout --force --detach $commit
            if ($LASTEXITCODE -ne 0) { throw 'LLAMA_SOURCE_CHECKOUT_FAILED' }
          }
          $current = (& git -C $sourceDir rev-parse HEAD | Out-String).Trim()
          $dirty = (& git -C $sourceDir status --porcelain --untracked-files=no | Out-String).Trim()
          if ($current -ne $commit -or $dirty) { throw 'LLAMA_SOURCE_EXACT_COMMIT_OR_CLEAN_CHECK_FAILED' }
          Write-Host "LLAMA_SOURCE_PREP=PASS commit=$commit"

      - name: Build and measure exact ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence'
        shell: powershell
        env:
          EXPECTED_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_REF) {
            throw "EXACT_REF_MISMATCH expected=$env:EXPECTED_REF actual=$head"
          }
          Write-Host "ASF_H_EXACT_HEAD=$head"

          $env:GRADLE_USER_HOME = Join-Path $env:RUNNER_TEMP 'liliya-asfh-gradle-user-home'
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          @'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          '@ | Set-Content -Path (Join-Path $env:GRADLE_USER_HOME 'gradle.properties') -Encoding ASCII

          $adb = (Get-Command adb.exe -ErrorAction Stop).Source
          $deviceLines = @(& $adb devices | Select-Object -Skip 1 | Where-Object { $_ -match '\tdevice$' })
          if ($deviceLines.Count -ne 1) {
            throw "EXACTLY_ONE_AUTHORIZED_USB_ADB_DEVICE_REQUIRED count=$($deviceLines.Count)"
          }
          Write-Host "ASF_H_USB_DEVICE=$($deviceLines[0])"

          # Fail closed: physical job never initiates a full-history upstream clone.
          $commit = '0f3a71be15af836d277c9f918adfafb45732677e'
          $cacheRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { Join-Path $env:RUNNER_TEMP 'tool-cache' }
          $sourceDir = Join-Path $cacheRoot "liliya-llama-source-$commit"
          if (-not (Test-Path (Join-Path $sourceDir '.git'))) {
            throw 'LLAMA_SOURCE_CACHE_MISSING_RUN_LLAMA_SOURCE_PREP_FIRST'
          }
          $actual = (& git -C $sourceDir rev-parse HEAD | Out-String).Trim()
          $dirty = (& git -C $sourceDir status --porcelain --untracked-files=no | Out-String).Trim()
          if ($actual -ne $commit -or $dirty) { throw 'LLAMA_SOURCE_CACHE_NOT_TRUSTED' }
          $env:LILIYA_LLAMA_CPP_SOURCE_DIR = $sourceDir
          Write-Host "LLAMA_SOURCE_CACHE=EXACT_PINNED_PASS"

          gradle.bat :android-app:assembleAsfH :android-app:assembleAsfHAndroidTest -PliliyaAsfHIsolation=true --console=plain
          if ($LASTEXITCODE -ne 0) { throw "ASF_H_APK_BUILD_FAILED_$LASTEXITCODE" }

          $app = 'android-app\build\outputs\apk\asfH\android-app-asfH.apk'
          $test = 'android-app\build\outputs\apk\androidTest\asfH\android-app-asfH-androidTest.apk'
          if (!(Test-Path $app) -or !(Test-Path $test)) {
            throw 'ASF_H_APK_OUTPUT_MISSING'
          }

          $out = Join-Path $env:RUNNER_TEMP 'asf-h-usb-adb-evidence'
          & '.\tools\physical-runner\Measure-AsfHUsbAdb.ps1' -Adb $adb -AppApk $app -TestApk $test -OutputDir $out
          if ($LASTEXITCODE -ne 0) { throw "ASF_H_USB_MEASUREMENT_FAILED_$LASTEXITCODE" }

          $evidence = Join-Path $out 'asf-h-usb-adb-physical-resource-evidence.json'
          if (!(Test-Path $evidence)) { throw 'ASF_H_USB_EVIDENCE_MISSING' }
          $raw = Get-Content $evidence -Raw
          $parsed = $raw | ConvertFrom-Json
          if ($parsed.sourceCommit -ne $head) {
            throw "ASF_H_SOURCE_COMMIT_MISMATCH expected=$head actual=$($parsed.sourceCommit)"
          }
          if ($parsed.transport -ne 'usb-adb') {
            throw "ASF_H_TRANSPORT_MISMATCH actual=$($parsed.transport)"
          }
          if (@($parsed.results).Count -ne 2) {
            throw 'ASF_H_RESULT_COUNT_MISMATCH'
          }
          if (@($parsed.results | Where-Object { -not $_.instrumentationPassed }).Count -ne 0) {
            throw 'ASF_H_INSTRUMENTATION_FAILED'
          }

          $bytes = [Text.Encoding]::UTF8.GetBytes($raw)
          $base64 = [Convert]::ToBase64String($bytes)
          Write-Host 'ASF_H_EVIDENCE_JSON_BASE64_BEGIN'
          Write-Host $base64
          Write-Host 'ASF_H_EVIDENCE_JSON_BASE64_END'
          Write-Host 'ASF_H_USB_EVIDENCE=PASS'

      - name: Upload ASF-H USB evidence
        if: needs.resolve.outputs.command == 'asf-h-usb-evidence' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asf-h-usb-adb-evidence-${{ needs.resolve.outputs.ref }}
          path: ${{ runner.temp }}\asf-h-usb-adb-evidence
          if-no-files-found: warn

  report-to-pr:
    needs: [resolve, laptop]
    if: ${{ always() && needs.resolve.outputs.allowed == 'true' && github.event_name == 'issue_comment' && github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Publish exact run result to triggering PR
        uses: actions/github-script@v7
        env:
          CONTROL_COMMAND: ${{ needs.resolve.outputs.command }}
          CONTROL_REF: ${{ needs.resolve.outputs.ref }}
          LAPTOP_RESULT: ${{ needs.laptop.result }}
        with:
          script: |
            const command = process.env.CONTROL_COMMAND;
            const ref = process.env.CONTROL_REF;
            const result = process.env.LAPTOP_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ['LILIYA_LAPTOP_CONTROL_RESULT', `command=${command}`, `ref=${ref}`, `laptop_result=${result}`, `run=${runUrl}`].join('\n');
            core.info(body);
