name: Current Main Release APK Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/current-main-release-apk-evidence.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: e542be403a0e8decffccdab5269acf1a24ff6145
  SOURCE_TREE: 4c1aae9e1c2821ce4fd4d73289777f153ec6010f
  LLAMA_CPP_COMMIT: 0f3a71be15af836d277c9f918adfafb45732677e

jobs:
  unsigned-release:
    name: Build exact current-main unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Record evidence tooling identity
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/evidence-tooling-sha.txt"

      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.1'

      - name: Configure hosted CI Gradle/Kotlin memory
        shell: bash
        run: bash .github/ci/configure-gradle-memory.sh

      - name: Cache reviewed llama.cpp source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/liliya-cmake-fetchcontent/*/llama_cpp-src
          key: liliya-release-llama-src-${{ runner.os }}-${{ env.LLAMA_CPP_COMMIT }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android release toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager             "platforms;android-35"             "build-tools;35.0.0"             "platform-tools"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - name: Build exact unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:assembleRelease             --max-workers=2             -Pkotlin.daemon.jvmargs=-Xmx1536m             --console=plain

      - name: Normalize release native symbols
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/release/android-app-release-unsigned.apk"
          bash .github/scripts/normalize-release-native-symbols.sh "$apk"

      - name: Verify release payload boundary
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/release/android-app-release-unsigned.apk"
          test -f "$apk"

          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$zipalign" -c -P 16 -v 4 "$apk"
          echo "ZIPALIGN_CHECK=PASS"

          listing="$RUNNER_TEMP/android-app-release-files.txt"
          unzip -Z1 "$apk" > "$listing"

          if grep -E               'stories15M-q4_0\.gguf|multilingual-e5-small-liliya-v0\.1\.onnx|multilingual-e5-small-tokenizer-v0\.1\.onnx'               "$listing"; then
            echo "test model asset leaked into production release APK" >&2
            exit 1
          fi

          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Fq                 'pro/liliya/packager/ProtectedModelOfflinePackager'; then
              echo "offline protected-model packager leaked into production release APK: $dex" >&2
              exit 1
            fi
          done < <(grep -E '^classes([0-9]+)?\.dex$' "$listing")

      - name: Record unsigned release identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/release/android-app-release-unsigned.apk"
          out="$RUNNER_TEMP/current-main-release-apk-evidence"
          mkdir -p "$out"

          cp "$apk" "$out/android-app-release-unsigned.apk"
          cp "$RUNNER_TEMP/android-app-release-files.txt" "$out/android-app-release-files.txt"

          sha="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat --format=%s "$apk")"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          badging="$RUNNER_TEMP/android-app-release-badging.txt"
          "$aapt" dump badging "$apk" > "$badging"
          cp "$badging" "$out/android-app-release-badging.txt"

          package_line="$(grep -m1 '^package:' "$badging")"
          native_line="$(grep -m1 '^native-code:' "$badging" || true)"
          test -n "$package_line"
          echo "$package_line" | grep -Fq "name='pro.liliya.app'"
          echo "$package_line" | grep -Fq "versionCode='1'"
          echo "$package_line" | grep -Fq "versionName='0.1'"
          echo "$native_line" | grep -Fq "'arm64-v8a'"
          if echo "$native_line" | grep -Eq "'armeabi|x86"; then
            echo "unexpected non-arm64 native ABI in release APK: $native_line" >&2
            exit 1
          fi

          TOOLING_SHA="$(cat "$RUNNER_TEMP/evidence-tooling-sha.txt")"           APK_SHA="$sha" APK_SIZE="$size" PACKAGE_LINE="$package_line" NATIVE_LINE="$native_line"           python3 - "$out/current-main-release-apk-manifest.json" <<'PY'
          import json
          import os
          import sys

          manifest = {
              "evidenceClass": "current-main-unsigned-release-apk",
              "testedSourceCommit": os.environ["SOURCE_SHA"],
              "testedSourceTree": os.environ["SOURCE_TREE"],
              "evidenceToolingCommit": os.environ["TOOLING_SHA"],
              "llamaCppCommit": os.environ["LLAMA_CPP_COMMIT"],
              "toolchain": {
                  "java": "17",
                  "gradle": "9.6.1",
                  "compileSdk": 35,
                  "buildTools": "35.0.0",
                  "ndk": "29.0.13113456",
                  "cmake": "3.31.6",
              },
              "artifact": {
                  "file": "android-app-release-unsigned.apk",
                  "sha256": os.environ["APK_SHA"],
                  "bytes": int(os.environ["APK_SIZE"]),
                  "applicationId": "pro.liliya.app",
                  "versionCode": 1,
                  "versionName": "0.1",
                  "targetAbi": "arm64-v8a",
                  "signingState": "UNSIGNED",
              },
              "aaptPackageLine": os.environ["PACKAGE_LINE"],
              "aaptNativeCodeLine": os.environ["NATIVE_LINE"],
              "privateSigningMaterialPresent": False,
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          echo "$sha  android-app-release-unsigned.apk" > "$out/SHA256SUMS"

      - name: Upload exact unsigned release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-unsigned-release-apk-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/current-main-release-apk-evidence/**
