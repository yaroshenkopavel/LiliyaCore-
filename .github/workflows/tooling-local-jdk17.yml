name: Local JDK17 Bootstrap

on:
  push:
    branches:
      - foundation/tooling-local-jdk17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk17:
    name: Temurin JDK 17 Runtime Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify and pack exact Java home
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          du -sh "$JAVA_HOME"
          tar -C "$(dirname "$JAVA_HOME")"             -czf "$RUNNER_TEMP/temurin-jdk17.tar.gz"             "$(basename "$JAVA_HOME")"

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: temurin-jdk17-linux-x64
          path: ${{ runner.temp }}/temurin-jdk17.tar.gz
          if-no-files-found: error
          retention-days: 1
