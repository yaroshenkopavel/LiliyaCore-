name: Next Slice Full Scratch Gate

on:
  push:
    branches:
      - tooling/local-toolchain-bridge-2026-09-12
    paths:
      - .github/workflows/next-slice-full-scratch.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: 78f4b7f5333977e6aae26fc890da3599b8d47f97
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > android-app/src/main/kotlin/pro/liliya/app/ProductionAndroidFirstRunAuthenticatedConfigurationInstall.kt <<'EOF'
          package pro.liliya.app

          /**
           * Explicit process-local installation boundary for one authenticated first-run composition.
           *
           * Configuration Install != Network Execution.
           * Configuration Install != Credential Storage.
           * Configuration Install != License Verification or Authority Policy.
           *
           * The input remains caller-owned. Composition is inert and installation preserves the existing
           * install-once owner semantics without manufacturing endpoint, credential, trust, authority, or
           * model defaults.
           */
          internal object ProductionAndroidFirstRunAuthenticatedConfigurationInstall {
              fun install(
                  input: ProductionAndroidFirstRunAuthenticatedConfigurationInput
              ): Boolean =
                  ProductionAndroidFirstRunConfigurationOwner.install(
                      ProductionAndroidFirstRunAuthenticatedConfigurationComposition.create(input)
                  )
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-app/src/main/kotlin/pro/liliya/app/LiliyaApplication.kt')
          text = path.read_text()
          anchor = '''    internal fun configureFirstRunAcquisition(\n        configuration: ProductionAndroidFirstRunConfiguration\n    ): Boolean = ProductionAndroidFirstRunConfigurationOwner.install(configuration)\n'''
          replacement = anchor + '''\n    internal fun configureAuthenticatedFirstRun(\n        input: ProductionAndroidFirstRunAuthenticatedConfigurationInput\n    ): Boolean =\n        ProductionAndroidFirstRunAuthenticatedConfigurationInstall.install(input)\n'''
          if anchor not in text:
              raise SystemExit('LiliyaApplication anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          cat > android-app/src/test/kotlin/pro/liliya/app/ProductionAndroidFirstRunAuthenticatedConfigurationInstallContractTest.kt <<'EOF'
          package pro.liliya.app

          import java.net.URL
          import kotlin.test.assertEquals
          import kotlin.test.assertFalse
          import kotlin.test.assertSame
          import kotlin.test.assertTrue
          import org.junit.After
          import org.junit.Test
          import pro.liliya.core.license.LicenseProductId
          import pro.liliya.core.license.LicenseServiceOperation
          import pro.liliya.core.license.LicenseServiceProtocolVersion
          import pro.liliya.core.license.LicenseServiceRequestId
          import pro.liliya.core.license.LicenseSubject
          import pro.liliya.core.licensetransport.LicenseHttpBearerCredential
          import pro.liliya.core.licensetransport.LicenseHttpEngine
          import pro.liliya.core.licensetransport.LicenseHttpTransportClient
          import pro.liliya.core.licensetransport.LicenseHttpTransportConfig
          import pro.liliya.core.licensetransport.LicenseServiceTransportRequest

          class ProductionAndroidFirstRunAuthenticatedConfigurationInstallContractTest {
              @After
              fun clearOwner() {
                  ProductionAndroidFirstRunConfigurationOwner.clearForTests()
              }

              @Test
              fun install_is_inert_and_preserves_exact_product_input_owner() {
                  var credentialCalls = 0
                  var engineCalls = 0
                  var productInputCalls = 0
                  val productInput = ProductionAndroidFirstRunProductInputPort { _, _ ->
                      productInputCalls++
                      error("product input must not execute during configuration install")
                  }
                  val installed = ProductionAndroidFirstRunAuthenticatedConfigurationInstall.install(
                      input(
                          productInput = productInput,
                          engine = LicenseHttpEngine { _, _ ->
                              engineCalls++
                              error("transport must not execute during configuration install")
                          },
                          credentialFactory = ProductionAndroidLicenseBearerCredentialFactory {
                              credentialCalls++
                              LicenseHttpBearerCredential.of("attempt-secret".encodeToByteArray())
                          }
                      )
                  )
                  assertTrue(installed)
                  assertEquals(0, credentialCalls)
                  assertEquals(0, engineCalls)
                  assertEquals(0, productInputCalls)
                  assertSame(productInput, ProductionAndroidFirstRunConfigurationOwner.current()?.productInput)
              }

              @Test
              fun install_once_rejects_replacement_without_executing_either_configuration() {
                  var credentialCalls = 0
                  var engineCalls = 0
                  var productInputCalls = 0
                  val firstProductInput = ProductionAndroidFirstRunProductInputPort { _, _ ->
                      productInputCalls++
                      error("not executed")
                  }
                  val secondProductInput = ProductionAndroidFirstRunProductInputPort { _, _ ->
                      productInputCalls++
                      error("not executed")
                  }
                  val engine = LicenseHttpEngine { _, _ ->
                      engineCalls++
                      error("not executed")
                  }
                  val credentials = ProductionAndroidLicenseBearerCredentialFactory {
                      credentialCalls++
                      LicenseHttpBearerCredential.of("attempt-secret".encodeToByteArray())
                  }
                  assertTrue(ProductionAndroidFirstRunAuthenticatedConfigurationInstall.install(input(firstProductInput, engine, credentials)))
                  assertFalse(ProductionAndroidFirstRunAuthenticatedConfigurationInstall.install(input(secondProductInput, engine, credentials)))
                  assertEquals(0, credentialCalls)
                  assertEquals(0, engineCalls)
                  assertEquals(0, productInputCalls)
                  assertSame(firstProductInput, ProductionAndroidFirstRunConfigurationOwner.current()?.productInput)
              }

              private fun input(
                  productInput: ProductionAndroidFirstRunProductInputPort,
                  engine: LicenseHttpEngine,
                  credentialFactory: ProductionAndroidLicenseBearerCredentialFactory
              ) = ProductionAndroidFirstRunAuthenticatedConfigurationInput(
                  licenseClient = LicenseHttpTransportClient(
                      config = LicenseHttpTransportConfig(
                          endpoint = URL("https://license.example/v1/license"),
                          connectTimeoutMillis = 1_000,
                          readTimeoutMillis = 1_000
                      ),
                      engine = engine
                  ),
                  licenseRequest = LicenseServiceTransportRequest(
                      protocolVersion = LicenseServiceProtocolVersion(1),
                      operation = LicenseServiceOperation.ISSUE,
                      productId = LicenseProductId("liliya-pro"),
                      subjectReference = LicenseSubject("first-run-subject"),
                      requestId = LicenseServiceRequestId("first-run-authenticated-install")
                  ),
                  bearerCredentialFactory = credentialFactory,
                  productInput = productInput
              )
          }
          EOF
          git diff --check

      - name: Targeted contract
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :android-app:testDebugUnitTest \
            --tests 'pro.liliya.app.ProductionAndroidFirstRunAuthenticatedConfigurationInstallContractTest'

      - name: Full relevant gate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            :android-app:assembleDebug
