name: Qwen3 final answer parser unit tests
on:
  push:
    branches: [test/qwen3-timed-instrumentation-2026-11-05]
    paths:
      - 'android-llama-cpp-engine/src/main/kotlin/pro/liliya/android/llamacppengine/Qwen3FinalAnswerParser.kt'
      - 'android-llama-cpp-engine/src/test/kotlin/pro/liliya/android/llamacppengine/Qwen3FinalAnswerParserTest.kt'
      - '.github/workflows/qwen3-answer-parser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Configure memory policy
        run: bash .github/ci/configure-gradle-memory.sh
      - name: Run isolated parser tests
        run: gradle :android-llama-cpp-engine:testDebugUnitTest --tests 'pro.liliya.android.llamacppengine.Qwen3FinalAnswerParserTest' --console=plain
