name: Liliya Local Exact Source Bridge
on:
  push:
    branches:
      - technical/local-env-bridge-2026-10-31
permissions:
  contents: write
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 975c7e054555dc6a0dd98d42537ee0c6df5dd795
    steps:
      - name: Publish exact-source run index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/run-id"
          INDEX_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/latest-source-run-id.txt?ref=technical/local-env-bridge-2026-10-31" --jq .sha 2>/dev/null || true)"
          if [ -n "$INDEX_SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.github/latest-source-run-id.txt" -f message="infra: exact main source run index [skip ci]" -f content="$(base64 -w0 "$RUNNER_TEMP/run-id")" -f sha="$INDEX_SHA" -f branch="technical/local-env-bridge-2026-10-31"
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.github/latest-source-run-id.txt" -f message="infra: exact main source run index [skip ci]" -f content="$(base64 -w0 "$RUNNER_TEMP/run-id")" -f branch="technical/local-env-bridge-2026-10-31"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact canonical source and export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          TARGET_TREE="$(git rev-parse HEAD^{tree})"
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/LiliyaCore-worktree.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/export/LiliyaCore-git.tar.gz" .git
          { echo "target_sha=$TARGET_SHA"; echo "target_tree=$TARGET_TREE"; } > "$RUNNER_TEMP/export/source.env"
          ( cd "$RUNNER_TEMP/export" && sha256sum LiliyaCore-worktree.tar.gz LiliyaCore-git.tar.gz > SHA256SUMS )
          test -s "$RUNNER_TEMP/export/LiliyaCore-worktree.tar.gz"
          test -s "$RUNNER_TEMP/export/LiliyaCore-git.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-exact-source-2026-10-31
          path: |
            ${{ runner.temp }}/export/LiliyaCore-worktree.tar.gz
            ${{ runner.temp }}/export/LiliyaCore-git.tar.gz
            ${{ runner.temp }}/export/source.env
            ${{ runner.temp }}/export/SHA256SUMS
          retention-days: 1
          compression-level: 0
