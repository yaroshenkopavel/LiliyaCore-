name: Container Publish H4D Migration

on:
  push:
    branches:
      - ops/container-restore-151187f

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: 151187f16488e4e97d84763bfc60883dfb99941b
          fetch-depth: 0

      - name: Apply locally verified H4D migration and publish one exact-tree commit
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          BASE=151187f16488e4e97d84763bfc60883dfb99941b
          EXPECTED_TREE=555366e6fbe6568eba8edbc21e98e46cbcf8eb79
          test "$(git rev-parse HEAD)" = "$BASE"
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/h4d.patch"
          git apply --index "$RUNNER_TEMP/h4d.patch"
          git diff --cached --check
          git -c user.name='yaroshenkopavel' -c user.email='78513566+yaroshenkopavel@users.noreply.github.com' commit -m 'fix: route H4D acceptance through activation gate'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin HEAD:development/core-next-governed-learning
