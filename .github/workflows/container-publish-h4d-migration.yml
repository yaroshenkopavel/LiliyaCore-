name: Container Publish H4D Migration

on:
  push:
    branches:
      - ops/container-restore-151187f

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target head
        uses: actions/checkout@v4
        with:
          ref: 646584b4d8be115a11451320f34e35ff13126161
          fetch-depth: 0

      - name: Apply exact locally verified semantic rebuild contract patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=646584b4d8be115a11451320f34e35ff13126161
          EXPECTED_TREE=b755962950cc09682eaa0135a7660d1129d3f78a
          test "$(git rev-parse HEAD)" = "$BASE"
          cat > "$RUNNER_TEMP/semantic-rebuild-contract.patch" <<'PATCH'
          diff --git a/android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt b/android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt
          index 74e17f65..e2ed787e 100644
          --- a/android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt
          +++ b/android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt
          @@ -370,6 +370,7 @@ class AndroidHeartRuntimeColdStartInstrumentedTest {
                   compilerSawKnowledge = false
                   compilerSawSelf = false
                   compilerSawPersonality = false
          +        compilerSawProductRuntimeLearned = false
           
                   val instrumentation = InstrumentationRegistry.getInstrumentation()
                   val targetContext = instrumentation.targetContext
          @@ -607,11 +608,12 @@ class AndroidHeartRuntimeColdStartInstrumentedTest {
                   val afterRecoveryCompleted = assertIs<ProductConversationResult.Completed>(
                       recoveredConversation.send(
                           ProductChatRequest(
          -                    "Continue after explicit semantic recovery.",
          +                    "What explicit product runtime learning evidence did you remember?",
                               ProductChatGenerationMode.ONE_SHOT
                           )
                       )
                   )
          +        assertTrue(compilerSawProductRuntimeLearned)
                   val afterRecoveryEvidence =
                       assertNotNull(afterRecoveryCompleted.learningFollowUpReference())
                   val reboundFollowUp = assertNotNull(product.learningFollowUp())
          @@ -1027,6 +1029,9 @@ class AndroidHeartRuntimeColdStartInstrumentedTest {
               @Volatile
               private var compilerSawLearned = false
           
          +    @Volatile
          +    private var compilerSawProductRuntimeLearned = false
          +
               @Volatile
               private var compilerSawSelf = false
           
          @@ -1066,6 +1071,9 @@ class AndroidHeartRuntimeColdStartInstrumentedTest {
                       if (contents.contains(LEARNED_EVIDENCE)) {
                           compilerSawLearned = true
                       }
          +            if (contents.contains(PRODUCT_RUNTIME_LEARNED_EVIDENCE)) {
          +                compilerSawProductRuntimeLearned = true
          +            }
                       check(compilerSawMemory)
                       check(compilerSawKnowledge)
                       CognitiveModelRequestCompilerResult.Compiled(
          PATCH
          sed -i 's/^          //' "$RUNNER_TEMP/semantic-rebuild-contract.patch"
          git apply --index "$RUNNER_TEMP/semantic-rebuild-contract.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='yaroshenkopavel' -c user.email='78513566+yaroshenkopavel@users.noreply.github.com' commit -m 'test: verify learned memory after semantic rebuild'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push --force-with-lease=refs/heads/development/core-next-governed-learning:$BASE origin HEAD:refs/heads/development/core-next-governed-learning
