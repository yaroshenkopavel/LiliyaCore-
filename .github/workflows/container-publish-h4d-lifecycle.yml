name: Container Publish H4D Lifecycle

on:
  push:
    branches:
      - ops/container-restore-151187f
    paths:
      - .github/workflows/container-publish-h4d-lifecycle.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development/core-next-governed-learning

      - name: Verify exact target head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=c22fc36d770057ae9863c0d6b38b38b7d8b307f8
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply exact H4D lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/h4d.patch.b64 <<'EOF'

          base64 -d /tmp/h4d.patch.b64 > /tmp/h4d.patch
          git apply --check /tmp/h4d.patch
          git apply /tmp/h4d.patch
          git add android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt
          test "$(git write-tree)" = "0ae7e755bf211a492e7cb9208f55adf1f3e5116f"

      - name: Commit and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name yaroshenkopavel
          git config user.email 78513566+yaroshenkopavel@users.noreply.github.com
          git commit -m "test: route H4D through learning lifecycle"
          git push --force-with-lease=refs/heads/development/core-next-governed-learning:c22fc36d770057ae9863c0d6b38b38b7d8b307f8 origin HEAD:refs/heads/development/core-next-governed-learning
