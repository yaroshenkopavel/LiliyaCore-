name: Local First Restore Bridge

on:
  push:
    branches:
      - tooling/local-first-restore-2026-09-12

jobs:
  jdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Package dereferenced Java 17
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bridge-out
          REAL_JAVA_HOME="$(readlink -f "$JAVA_HOME")"
          echo "REAL_JAVA_HOME=$REAL_JAVA_HOME"
          "$REAL_JAVA_HOME/bin/java" -version
          tar -chzf /tmp/jdk17.tar.gz -C "$(dirname "$REAL_JAVA_HOME")" "$(basename "$REAL_JAVA_HOME")"
          split -b 250M -d -a 2 /tmp/jdk17.tar.gz bridge-out/jdk17.part.
          sha256sum bridge-out/jdk17.part.* > bridge-out/JDK17_SHA256SUMS.txt
          gzip -t /tmp/jdk17.tar.gz
          ls -lh bridge-out

      - name: Upload JDK part 00
        uses: actions/upload-artifact@v4
        with:
          name: restore-jdk17-00
          path: bridge-out/jdk17.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload JDK part 01
        if: ${{ hashFiles('bridge-out/jdk17.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-jdk17-01
          path: bridge-out/jdk17.part.01
          retention-days: 1
          compression-level: 0
      - name: Upload JDK checksums
        uses: actions/upload-artifact@v4
        with:
          name: restore-jdk17-checksums
          path: bridge-out/JDK17_SHA256SUMS.txt
          retention-days: 1
