name: Local First Restore Bridge

on:
  push:
    branches:
      - tooling/local-first-restore-2026-09-12

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified toolchain artifacts from successful restore run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: yaroshenkopavel/LiliyaCore-
          run-id: 34708596986
          pattern: local-first-toolchain-part*
          merge-multiple: true
          path: bridge-out

      - name: Verify exact part set and checksums
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh bridge-out
          echo '0614a35c24e732e1b8eee44bac9295bfe289330216a02757885e82d61863c06b  bridge-out/android-sdk-base.part.00' | sha256sum -c -
          echo '8ada51c4f0eefa8af1b477d0c17d3fb602e44c619ec1cb9fecc8ee27304cfdd2  bridge-out/cmake-3.31.6.part.00' | sha256sum -c -
          echo '19c6a57efeda8ee43bfc726c555ebee4ef321f335715a2e698ad6878ebb5090a  bridge-out/gradle-9.6.1.part.00' | sha256sum -c -
          echo '3fd63ace272e56198a74d9c8d7171ac211cf5b8848f0a35941a307d5842a999c  bridge-out/gradle-home.part.00' | sha256sum -c -
          echo '160aa483ac4e18051bc4334ed04178ff4e2ba41d3284ad43b6dccbafe3f72c02  bridge-out/gradle-home.part.01' | sha256sum -c -
          echo 'f0a238790eaf0154e2bda393d4010f1bdc23435ff4397ada6a3ae91fbe4aa72d  bridge-out/jdk17.part.00' | sha256sum -c -
          echo 'd7db7d4d4dafb618343df485b350121d1da14f78f51bfa8485f4bcd49abb01f5  bridge-out/ndk-29.0.13113456.part.00' | sha256sum -c -
          echo '17d0a75a01a0c03eb69fd97733f7a0a5a08e48cb56f7935bb344a098bf016261  bridge-out/ndk-29.0.13113456.part.01' | sha256sum -c -
          echo 'e47a6c59fcc44f0ff9239aec10c0f0c74a54597e16b2e1071332cc787d392394  bridge-out/ndk-29.0.13113456.part.02' | sha256sum -c -

      - name: Upload Android SDK base
        uses: actions/upload-artifact@v4
        with:
          name: restore-sdk-base
          path: bridge-out/android-sdk-base.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: restore-cmake
          path: bridge-out/cmake-3.31.6.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload Gradle runtime
        uses: actions/upload-artifact@v4
        with:
          name: restore-gradle-runtime
          path: bridge-out/gradle-9.6.1.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload Gradle home 00
        uses: actions/upload-artifact@v4
        with:
          name: restore-gradle-home-00
          path: bridge-out/gradle-home.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload Gradle home 01
        uses: actions/upload-artifact@v4
        with:
          name: restore-gradle-home-01
          path: bridge-out/gradle-home.part.01
          retention-days: 1
          compression-level: 0
      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: restore-jdk17
          path: bridge-out/jdk17.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload NDK 00
        uses: actions/upload-artifact@v4
        with:
          name: restore-ndk-00
          path: bridge-out/ndk-29.0.13113456.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload NDK 01
        uses: actions/upload-artifact@v4
        with:
          name: restore-ndk-01
          path: bridge-out/ndk-29.0.13113456.part.01
          retention-days: 1
          compression-level: 0
      - name: Upload NDK 02
        uses: actions/upload-artifact@v4
        with:
          name: restore-ndk-02
          path: bridge-out/ndk-29.0.13113456.part.02
          retention-days: 1
          compression-level: 0
