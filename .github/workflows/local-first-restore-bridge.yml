name: Local First Restore Bridge

on:
  push:
    branches:
      - tooling/local-first-restore-2026-09-12

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANONICAL_SHA: 78f4b7f5333977e6aae26fc890da3599b8d47f97
      GRADLE_USER_HOME: ${{ github.workspace }}/bridge-gradle-home
    steps:
      - name: Checkout bridge branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical source and create standalone mirror
        shell: bash
        run: |
          set -euxo pipefail
          git cat-file -e "${CANONICAL_SHA}^{commit}"
          rm -rf /tmp/LiliyaCore-local
          git clone --local "$GITHUB_WORKSPACE" /tmp/LiliyaCore-local
          cd /tmp/LiliyaCore-local
          git checkout --detach "$CANONICAL_SHA"
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          rm -rf .gradle
          find . -type d \( -name build -o -name .cxx \) -prune -exec rm -rf {} + || true
          cd /tmp
          tar -czf "$GITHUB_WORKSPACE/liliyacore-local-mirror.tar.gz" LiliyaCore-local

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Install Gradle 9.6.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          rm -rf /tmp/gradle-9.6.1
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.6.1/bin/gradle --version

      - name: Warm project-only offline cache and verify
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          cd /tmp/LiliyaCore-local
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          /tmp/gradle-9.6.1/bin/gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:compileDebugAndroidTestKotlin \
            --console=plain --no-daemon
          /tmp/gradle-9.6.1/bin/gradle :core:test --offline --console=plain --no-daemon

      - name: Package exact local toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bridge-out sdk-stage
          tar -czf bridge-out/jdk17.tar.gz -C "$(dirname "$JAVA_HOME")" "$(basename "$JAVA_HOME")"
          tar -czf bridge-out/gradle-9.6.1.tar.gz -C /tmp gradle-9.6.1
          tar -czf bridge-out/gradle-home.tar.gz -C "$(dirname "$GRADLE_USER_HOME")" "$(basename "$GRADLE_USER_HOME")"
          mkdir -p sdk-stage/platforms sdk-stage/build-tools sdk-stage/ndk sdk-stage/cmake
          cp -a "$ANDROID_SDK_ROOT/platform-tools" sdk-stage/
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" sdk-stage/platforms/
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" sdk-stage/build-tools/
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" sdk-stage/build-tools/
          cp -a "$ANDROID_SDK_ROOT/licenses" sdk-stage/ || true
          tar -czf bridge-out/android-sdk-base.tar.gz -C sdk-stage platform-tools platforms build-tools licenses 2>/dev/null || tar -czf bridge-out/android-sdk-base.tar.gz -C sdk-stage platform-tools platforms build-tools
          tar -czf bridge-out/ndk-29.0.13113456.tar.gz -C "$ANDROID_SDK_ROOT/ndk" 29.0.13113456
          tar -czf bridge-out/cmake-3.31.6.tar.gz -C "$ANDROID_SDK_ROOT/cmake" 3.31.6
          for f in bridge-out/*.tar.gz; do
            base="${f%.tar.gz}"
            split -b 300M -d -a 2 "$f" "${base}.part."
            rm "$f"
          done
          sha256sum bridge-out/* > bridge-out/SHA256SUMS.txt
          ls -lh bridge-out

      - name: Upload source mirror
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-mirror
          path: liliyacore-local-mirror.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: local-first-restore-checksums
          path: bridge-out/SHA256SUMS.txt
          retention-days: 1

      - name: Upload toolchain parts 00
        uses: actions/upload-artifact@v4
        with:
          name: local-first-toolchain-part00
          path: bridge-out/*.part.00
          retention-days: 1
          compression-level: 0

      - name: Upload toolchain parts 01
        if: ${{ hashFiles('bridge-out/*.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-first-toolchain-part01
          path: bridge-out/*.part.01
          retention-days: 1
          compression-level: 0

      - name: Upload toolchain parts 02
        if: ${{ hashFiles('bridge-out/*.part.02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-first-toolchain-part02
          path: bridge-out/*.part.02
          retention-days: 1
          compression-level: 0

      - name: Upload toolchain parts 03
        if: ${{ hashFiles('bridge-out/*.part.03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-first-toolchain-part03
          path: bridge-out/*.part.03
          retention-days: 1
          compression-level: 0
