name: First Working Liliya Firebase ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: Successful Semantic Model Provenance run ID containing semantic-onnx-provenance
        required: false
        default: '33981322350'
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/first-working-liliya-firebase-arm64-bundle.yml'
      - '.github/scripts/verify-first-working-liliya-firebase-apk-pair.sh'
      - 'android-app/ci/run_firebase_first_working_liliya_acceptance.sh'

permissions:
  contents: read
  actions: read

jobs:
  build-bundle:
    name: Build exact First Working Liliya Firebase ARM64 APK bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@v4
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provenance_run_id || '33981322350' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["RUNNER_TEMP"]) / "semantic-onnx-download"
          manifests = list(root.rglob("semantic-onnx-provenance.json"))
          encoders = list(root.rglob("multilingual-e5-small-liliya-v0.1.onnx"))
          tokenizers = list(root.rglob("multilingual-e5-small-tokenizer-v0.1.onnx"))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f"unexpected provenance layout: manifest={manifests}, "
                  f"encoder={encoders}, tokenizer={tokenizers}"
              )

          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          encoder = manifest["encoder"]
          tokenizer = manifest["tokenizer"]

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder["size"] or digest(encoders[0]) != encoder["sha256"]:
              raise SystemExit("encoder provenance mismatch")
          if tokenizers[0].stat().st_size != tokenizer["size"] or digest(tokenizers[0]) != tokenizer["sha256"]:
              raise SystemExit("tokenizer provenance mismatch")

          assets = Path("android-app/src/androidTest/assets")
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)
          PY

      - name: Stage verified real-model cold-start fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-app/src/androidTest/assets"
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true" \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Compile exact app and instrumentation APK pair
        run: gradle :android-app:assembleDebug :android-app:assembleDebugAndroidTest --console=plain

      - name: Collect exact Firebase bundle and manifest
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id || '33981322350' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-working-liliya-firebase-arm64-bundle"
          mkdir -p "$out"

          app_apk="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test_apk="android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"

          cp "$app_apk" "$out/"
          cp "$test_apk" "$out/"
          cp android-app/ci/run_firebase_first_working_liliya_acceptance.sh "$out/"
          chmod +x "$out/run_firebase_first_working_liliya_acceptance.sh"

          python3 - "$out" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          out = Path(sys.argv[1])
          files = []
          for path in sorted(out.iterdir()):
              if path.is_file():
                  files.append({
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })

          manifest = {
              "evidenceClass": "first-working-liliya-firebase-physical-arm64-input-bundle",
              "acceptanceEvidence": False,
              "exactCommitSha": os.environ["EXACT_SHA"],
              "semanticProvenanceRunId": os.environ["PROVENANCE_RUN_ID"],
              "applicationId": "pro.liliya.app",
              "testClass": "pro.liliya.app.DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest",
              "deviceModel": "z3q",
              "deviceApi": 33,
              "deviceAbi": "arm64-v8a",
              "fixtureSha256": "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04",
              "fixtureSizeBytes": 19077344,
              "requiresExternalAuthorizedGcloud": True,
              "files": files,
          }
          (out / "first-working-liliya-firebase-bundle-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat "$out/first-working-liliya-firebase-bundle-manifest.json"

      - name: Upload exact Firebase ARM64 input bundle
        uses: actions/upload-artifact@v4
        with:
          name: first-working-liliya-firebase-arm64-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/first-working-liliya-firebase-arm64-bundle
          if-no-files-found: error
          retention-days: 30

  verify-bundle:
    name: Verify First Working Liliya Firebase APK pair
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact Firebase input bundle
        uses: actions/download-artifact@v4
        with:
          name: first-working-liliya-firebase-arm64-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/first-working-liliya-firebase-arm64-bundle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Syntax-check external Firebase runner
        shell: bash
        run: bash -n android-app/ci/run_firebase_first_working_liliya_acceptance.sh

      - name: Verify target package, instrumentation class and ARM64 ABI
        shell: bash
        run: bash .github/scripts/verify-first-working-liliya-firebase-apk-pair.sh
