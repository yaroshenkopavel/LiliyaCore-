name: Semantic Model Provenance

on:
  workflow_dispatch:
  push:
    branches:
      - semantic/**
    paths:
      - 'android-offline-semantic-provider/ci/reproduce_semantic_model_q8.sh'
      - 'android-offline-semantic-provider/ci/semantic-converter-python311.constraints.txt'
      - 'android-offline-semantic-provider/THIRD_PARTY_NOTICES.md'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/SelfReproducedSemanticModelFixture.kt'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderRealModelInstrumentedTest.kt'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderResourceInstrumentedTest.kt'
      - '.github/workflows/semantic-model-provenance.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-offline-semantic-provider/ci/reproduce_semantic_model_q8.sh'
      - 'android-offline-semantic-provider/ci/semantic-converter-python311.constraints.txt'
      - 'android-offline-semantic-provider/THIRD_PARTY_NOTICES.md'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/SelfReproducedSemanticModelFixture.kt'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderRealModelInstrumentedTest.kt'
      - 'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderResourceInstrumentedTest.kt'
      - '.github/workflows/semantic-model-provenance.yml'

permissions:
  contents: read

jobs:
  reproduce-semantic-model:
    name: Reproduce and verify multilingual-e5-small Q8_0
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.16
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Reproduce pinned semantic Q8_0 candidate
        shell: bash
        run: bash android-offline-semantic-provider/ci/reproduce_semantic_model_q8.sh "$RUNNER_TEMP/semantic-model-provenance"

      - name: Publish structural provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-model-provenance
          path: |
            ${{ runner.temp }}/semantic-model-provenance/semantic-model-provenance.txt
            android-offline-semantic-provider/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build pinned semantic JNI for arm64
        run: gradle :android-offline-semantic-provider:assembleRelease --console=plain

      - name: Stage self-reproduced candidate as instrumentation fixture
        shell: bash
        run: |
          set -euo pipefail
          source_model="$RUNNER_TEMP/semantic-model-provenance/liliya-multilingual-e5-small-q8_0.gguf"
          asset_dir="android-offline-semantic-provider/src/androidTest/assets"
          asset="$asset_dir/multilingual-e5-small-q8_0.gguf"
          mkdir -p "$asset_dir"
          test -f "$source_model"
          cp "$source_model" "$asset"
          echo "SELF_REPRODUCED_SHA256=$(sha256sum "$asset" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SELF_REPRODUCED_SIZE=$(stat --format=%s "$asset")" >> "$GITHUB_ENV"

      - name: Compile self-reproduced instrumentation contract
        run: gradle :android-offline-semantic-provider:assembleDebugAndroidTest --console=plain

      - name: Run ephemeral self-reproduced fixture through native quality path
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :android-offline-semantic-provider:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256=${SELF_REPRODUCED_SHA256} -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes=${SELF_REPRODUCED_SIZE} '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest#pinned_multilingual_e5_q8_loads_and_closes_without_embedding' --console=plain
            adb logcat -c || true
            embedding_status=0; gradle :android-offline-semantic-provider:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256=${SELF_REPRODUCED_SHA256} -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes=${SELF_REPRODUCED_SIZE} '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest#pinned_multilingual_e5_q8_runs_through_validator_native_session_and_close' --console=plain || embedding_status=$?; if [ "$embedding_status" -ne 0 ]; then echo '=== STRUCTURAL NATIVE CRASH EVIDENCE ==='; adb logcat -d 2>/dev/null | grep -E 'unsupported types:|GGML_ASSERT|GGML_ABORT|ggml_compute_forward_add_non_quantized|ABI:|Fatal signal|signal [0-9]+|backtrace:|#[0-9]+ pc .*lib(liliya-semantic|llama|ggml)' || true; exit "$embedding_status"; fi
            gradle :android-offline-semantic-provider:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256=${SELF_REPRODUCED_SHA256} -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes=${SELF_REPRODUCED_SIZE} '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest' --console=plain
            resource_status=0; gradle :android-offline-semantic-provider:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSha256=${SELF_REPRODUCED_SHA256} -Pandroid.testInstrumentationRunnerArguments.semanticFixtureSizeBytes=${SELF_REPRODUCED_SIZE} '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderResourceInstrumentedTest' --console=plain > "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-preflight.txt" 2>&1 || resource_status=$?; cat "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-preflight.txt"; exit "$resource_status"
            instrumentation_component="$(adb shell pm list instrumentation | tr -d '\r' | grep 'pro.liliya.android.semanticprovider' | head -n 1 | sed 's/^instrumentation://; s/ .*//')"; test -n "$instrumentation_component"; adb shell am instrument -w -r -e semanticFixtureSha256 "$SELF_REPRODUCED_SHA256" -e semanticFixtureSizeBytes "$SELF_REPRODUCED_SIZE" -e class pro.liliya.android.semanticprovider.OfflineSemanticProviderResourceInstrumentedTest "$instrumentation_component" > "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-status.txt" 2>&1; cat "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-status.txt"
            python - "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-status.txt" "$RUNNER_TEMP/semantic-model-provenance/semantic-resource-x86_64-preflight.json" <<'PY'
            import json
            from pathlib import Path
            import sys

            source = Path(sys.argv[1])
            target = Path(sys.argv[2])
            prefix = "INSTRUMENTATION_STATUS: semanticResource."
            evidence = {}
            for raw_line in source.read_text(encoding="utf-8", errors="replace").splitlines():
                line = raw_line.strip()
                if not line.startswith(prefix):
                    continue
                key, separator, value = line[len(prefix):].partition("=")
                if separator:
                    evidence[key] = value.strip()

            required = {
                "primaryAbi",
                "abi",
                "fixtureBytes",
                "fixtureSha256",
                "fixtureAcceptance",
                "llamaRevision",
                "profileDimension",
                "loadLatencyMs",
                "processPssBeforeLoadBytes",
                "processPssAfterLoadBytes",
                "processPssLoadDeltaBytes",
                "nativeHeapLoadDeltaBytes",
                "warmShortQueryMedianMs",
                "paragraphLatencyMs",
                "repeatedEmbeddingCount",
                "flatScan1kMedianMs",
                "flatScan10kMedianMs",
                "flatIndex10kProcessPssDeltaBytes",
                "flatIndex10kRawVectorBytes",
                "flatIndexCandidateBound",
                "arm64ThresholdsApplied",
                "reloadCycle1LatencyMs",
                "reloadCycle2LatencyMs",
            }
            missing = sorted(required.difference(evidence))
            if missing:
                raise SystemExit(f"missing semantic resource evidence keys: {missing}")
            if evidence["arm64ThresholdsApplied"] != "false":
                raise SystemExit("translated x86_64 preflight must not claim ARM64 threshold evidence")

            target.write_text(
                json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            print(target.read_text(encoding="utf-8"))
            PY

      - name: Publish translated resource preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-resource-x86_64-preflight
          path: |
            ${{ runner.temp }}/semantic-model-provenance/semantic-resource-x86_64-preflight.txt
            ${{ runner.temp }}/semantic-model-provenance/semantic-resource-x86_64-status.txt
            ${{ runner.temp }}/semantic-model-provenance/semantic-resource-x86_64-preflight.json
          if-no-files-found: error
          retention-days: 30
