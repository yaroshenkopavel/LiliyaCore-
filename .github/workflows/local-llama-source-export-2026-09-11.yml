name: Local llama.cpp Source Export 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/local-llama-source-export-2026-09-11.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export exact pinned llama.cpp git mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir llama.cpp
          cd llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth=1 origin 0f3a71be15af836d277c9f918adfafb45732677e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0f3a71be15af836d277c9f918adfafb45732677e"
          git fsck --full
          cd ..
          tar -czf llama-cpp-git-0f3a71be15af836d277c9f918adfafb45732677e.tar.gz llama.cpp
          gzip -t llama-cpp-git-0f3a71be15af836d277c9f918adfafb45732677e.tar.gz

      - name: Upload exact git mirror
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-git-0f3a71be15af836d277c9f918adfafb45732677e
          path: llama-cpp-git-0f3a71be15af836d277c9f918adfafb45732677e.tar.gz
          retention-days: 7
          if-no-files-found: error
