name: Post-RC Governed Learning Physical Semantic Rebuild

on:
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: Successful Semantic Model Provenance run ID containing semantic-onnx-provenance
        required: false
        default: '33981322350'
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/post-rc-governed-learning-physical-semantic-rebuild.yml'
      - 'tools/physical-runner/liliya_physical_rish_bridge.py'
      - 'android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate post-RC governed-learning physical contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate fixed physical seam
        shell: bash
        run: |
          set -euo pipefail
          bridge='tools/physical-runner/liliya_physical_rish_bridge.py'
          test_file='android-semantic-test-host/src/androidTest/kotlin/pro/liliya/android/semanticprovider/host/AndroidHeartRuntimeColdStartInstrumentedTest.kt'
          grep -Fq 'GOVERNED_LEARNING_SEMANTIC_REBUILD_TEST' "$bridge"
          grep -Fq '/v1/instrument/governed-learning-semantic-rebuild' "$bridge"
          grep -Fq 'AndroidHeartRuntimeColdStartInstrumentedTest#' "$bridge"
          grep -Fq 'product_runtime_assembly_routes_conversation_evidence_to_explicit_governed_learning' "$bridge"
          grep -Fq 'fun product_runtime_assembly_routes_conversation_evidence_to_explicit_governed_learning()' "$test_file"
          grep -Fq 'assertTrue(compilerSawProductRuntimeLearned)' "$test_file"
          if grep -Eq '/v1/(shell|command|exec)' "$bridge"; then
            echo 'physical bridge must not expose arbitrary command execution' >&2
            exit 1
          fi
          python3 -m py_compile "$bridge"

  build-bundle:
    name: Build exact post-RC semantic rebuild APK bundle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provenance_run_id || '33981322350' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'semantic-onnx-download'
          manifests = list(root.rglob('semantic-onnx-provenance.json'))
          encoders = list(root.rglob('multilingual-e5-small-liliya-v0.1.onnx'))
          tokenizers = list(root.rglob('multilingual-e5-small-tokenizer-v0.1.onnx'))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit('unexpected semantic provenance layout')
          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          for path, key in ((encoders[0], 'encoder'), (tokenizers[0], 'tokenizer')):
              expected = manifest[key]
              if path.stat().st_size != expected['size'] or digest(path) != expected['sha256']:
                  raise SystemExit(f'{key} provenance mismatch')
          assets = Path('android-offline-semantic-provider/src/androidTest/assets')
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)
          PY
      - name: Prepare verified real-model fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir='android-offline-semantic-provider/src/androidTest/assets'
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            'https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true' \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install pinned Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Compile exact semantic host instrumentation
        run: gradle :android-semantic-test-host:assembleDebug :android-semantic-test-host:assembleDebugAndroidTest --console=plain
      - name: Collect exact post-RC bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/post-rc-governed-learning-semantic-rebuild"
          mkdir -p "$out"
          cp android-semantic-test-host/build/outputs/apk/debug/android-semantic-test-host-debug.apk "$out/liliya-semantic-host-debug.apk"
          cp android-semantic-test-host/build/outputs/apk/androidTest/debug/android-semantic-test-host-debug-androidTest.apk "$out/liliya-semantic-host-debug-androidTest.apk"
          SOURCE_COMMIT="$(git rev-parse HEAD)" SOURCE_TREE="$(git rev-parse HEAD^{tree})" BUNDLE_DIR="$out" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['BUNDLE_DIR'])
          files = {}
          for name in ('liliya-semantic-host-debug.apk', 'liliya-semantic-host-debug-androidTest.apk'):
              path = root / name
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              files[name] = {'sha256': h, 'size': path.stat().st_size}
          payload = {
              'evidenceClass': 'post-rc-governed-learning-semantic-rebuild-candidate',
              'acceptanceEvidence': False,
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'sourceTree': os.environ['SOURCE_TREE'],
              'test': 'AndroidHeartRuntimeColdStartInstrumentedTest#product_runtime_assembly_routes_conversation_evidence_to_explicit_governed_learning',
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cat "$out/manifest.json"
      - name: Upload exact post-RC bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-rc-governed-learning-semantic-rebuild-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/post-rc-governed-learning-semantic-rebuild/**

  physical-arm64:
    name: Physical ARM64 governed-learning semantic rebuild candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build-bundle]
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Download exact post-RC bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: post-rc-governed-learning-semantic-rebuild-${{ github.sha }}
          path: ${{ runner.temp }}/post-rc-governed-learning-semantic-rebuild
      - name: Verify physical ARM64 host and fixed local bridge
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) echo 'runner host must be ARM64' >&2; exit 1;; esac
          token_file='/data/data/com.termux/files/home/.liliya-physical-bridge-token'
          test -s "$token_file"
          token="$(cat "$token_file")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18765/v1/probe \
            > "$RUNNER_TEMP/probe.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['RUNNER_TEMP']) / 'probe.json').read_text())
          if p['primaryAbi']['output'] != 'arm64-v8a': raise SystemExit('physical device must be arm64-v8a')
          if p['qemu']['output'] == '1': raise SystemExit('emulator is not accepted')
          PY
      - name: Install exact semantic APK pair
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          root="$RUNNER_TEMP/post-rc-governed-learning-semantic-rebuild"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $token" http://127.0.0.1:18765/v1/reset-semantic-packages > "$RUNNER_TEMP/reset.json"
          for spec in \
            "semantic-app:liliya-semantic-host-debug.apk" \
            "semantic-test:liliya-semantic-host-debug-androidTest.apk"; do
            endpoint="${spec%%:*}"; file="${spec#*:}"; path="$root/$file"
            sha="$(sha256sum "$path" | awk '{print $1}')"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $token" \
              -H "X-Liliya-Sha256: $sha" \
              --data-binary "@$path" \
              "http://127.0.0.1:18765/v1/install/$endpoint" \
              > "$RUNNER_TEMP/install-$endpoint.json"
          done
      - name: Run exact governed-learning semantic rebuild method
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18765/v1/instrument/governed-learning-semantic-rebuild \
            | tee "$RUNNER_TEMP/governed-learning-semantic-rebuild.txt"
          grep -Fq 'OK (1 test)' "$RUNNER_TEMP/governed-learning-semantic-rebuild.txt"
      - name: Upload physical candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-rc-governed-learning-semantic-rebuild-physical-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/probe.json
            ${{ runner.temp }}/reset.json
            ${{ runner.temp }}/install-*.json
            ${{ runner.temp }}/governed-learning-semantic-rebuild.txt
