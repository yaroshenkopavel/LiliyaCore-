name: Local First Exact Source Bridge 2026-10-11
on:
  push:
    branches: [technical/local-env-bridge-2026-10-11]
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44ccbc140d3730b56c0601a8a3b8cfc2ba045a1f
          fetch-depth: 0
      - name: Verify exact code identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '44ccbc140d3730b56c0601a8a3b8cfc2ba045a1f'
          test "$(git rev-parse HEAD^{tree})" = '1bdcf93ff6692ab251ace13f73a5d978805a9cbc'
      - name: Export worktree and Git metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source/worktree.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/source/git.tar.gz" .git
          echo 'head=44ccbc140d3730b56c0601a8a3b8cfc2ba045a1f' > "$RUNNER_TEMP/source/manifest.txt"
          echo 'tree=1bdcf93ff6692ab251ace13f73a5d978805a9cbc' >> "$RUNNER_TEMP/source/manifest.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum worktree.tar.gz git.tar.gz >> manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-source-exact-44ccbc14
          path: ${{ runner.temp }}/source/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Configure existing hosted memory policy
        shell: bash
        run: bash .github/ci/configure-gradle-memory.sh
      - name: Warm and verify core dependency cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/liliya-gradle-home
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cp "$HOME/.gradle/gradle.properties" "$GRADLE_USER_HOME/gradle.properties"
          echo '=== Active isolated Gradle memory configuration ==='
          cat "$GRADLE_USER_HOME/gradle.properties"
          gradle :core:test --configure-on-demand --console=plain --no-daemon
          gradle :core:test --configure-on-demand --offline --console=plain --no-daemon
          mkdir -p "$RUNNER_TEMP/cache-export"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/cache-export/gradle-home.tar.gz" liliya-gradle-home
          sha256sum "$RUNNER_TEMP/cache-export/gradle-home.tar.gz" > "$RUNNER_TEMP/cache-export/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-core-gradle-cache-44ccbc14
          path: ${{ runner.temp }}/cache-export/
          retention-days: 1
          if-no-files-found: error

      - name: Export verified JDK and Gradle binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain-export"
          REAL_JAVA_HOME="$(readlink -f "$JAVA_HOME")"
          test -x "$REAL_JAVA_HOME/bin/java"
          tar -C "$(dirname "$REAL_JAVA_HOME")" -czf "$RUNNER_TEMP/toolchain-export/jdk17.tar.gz" "$(basename "$REAL_JAVA_HOME")"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          test -x "$GRADLE_ROOT/bin/gradle"
          tar -C "$(dirname "$GRADLE_ROOT")" -czf "$RUNNER_TEMP/toolchain-export/gradle.tar.gz" "$(basename "$GRADLE_ROOT")"
          tar -tzf "$RUNNER_TEMP/toolchain-export/jdk17.tar.gz" > "$RUNNER_TEMP/toolchain-export/jdk-list.txt"
          tar -tzf "$RUNNER_TEMP/toolchain-export/gradle.tar.gz" > "$RUNNER_TEMP/toolchain-export/gradle-list.txt"
          grep -F '/bin/java' "$RUNNER_TEMP/toolchain-export/jdk-list.txt" > /dev/null
          grep -F '/bin/gradle' "$RUNNER_TEMP/toolchain-export/gradle-list.txt" > /dev/null
          (cd "$RUNNER_TEMP/toolchain-export" && sha256sum jdk17.tar.gz gradle.tar.gz > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-jdk17-gradle961-44ccbc14
          path: ${{ runner.temp }}/toolchain-export/
          retention-days: 1
          if-no-files-found: error
  export-android-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Install exact Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | sdkmanager --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'platform-tools' 'ndk;29.0.13113456' 'cmake;3.31.6'
          test -f "$ANDROID_HOME/ndk/29.0.13113456/source.properties"
          test -x "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          mkdir -p "$RUNNER_TEMP/sdk-export/core" "$RUNNER_TEMP/sdk-export/ndk"
          for p in platforms/android-35 build-tools/35.0.0 build-tools/36.0.0 platform-tools cmake/3.31.6; do
            mkdir -p "$RUNNER_TEMP/sdk-export/core/$(dirname "$p")"
            cp -a "$ANDROID_HOME/$p" "$RUNNER_TEMP/sdk-export/core/$p"
          done
          tar -C "$RUNNER_TEMP/sdk-export/core" -czf "$RUNNER_TEMP/sdk-export/android-sdk-core.tar.gz" .
          tar -C "$ANDROID_HOME/ndk" -czf "$RUNNER_TEMP/sdk-export/ndk.tar.gz" 29.0.13113456
          gzip -t "$RUNNER_TEMP/sdk-export/ndk.tar.gz"
          split -b 240M -d -a 2 "$RUNNER_TEMP/sdk-export/ndk.tar.gz" "$RUNNER_TEMP/sdk-export/ndk/part."
          (cd "$RUNNER_TEMP/sdk-export" && sha256sum android-sdk-core.tar.gz ndk.tar.gz > manifest-sha256.txt)
          (cd "$RUNNER_TEMP/sdk-export/ndk" && sha256sum part.* > ../parts-sha256.txt)
          ls -lh "$RUNNER_TEMP/sdk-export/ndk"/
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-core-44ccbc14
          path: ${{ runner.temp }}/sdk-export/android-sdk-core.tar.gz
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-ndk-part00-44ccbc14
          path: ${{ runner.temp }}/sdk-export/ndk/part.00
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-ndk-part01-44ccbc14
          path: ${{ runner.temp }}/sdk-export/ndk/part.01
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-ndk-part02-44ccbc14
          path: ${{ runner.temp }}/sdk-export/ndk/part.02
          retention-days: 2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-ndk-part03-44ccbc14
          path: ${{ runner.temp }}/sdk-export/ndk/part.03
          retention-days: 2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-ndk-part04-44ccbc14
          path: ${{ runner.temp }}/sdk-export/ndk/part.04
          retention-days: 2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: liliya-sdk-manifest-44ccbc14
          path: |
            ${{ runner.temp }}/sdk-export/manifest-sha256.txt
            ${{ runner.temp }}/sdk-export/parts-sha256.txt
          retention-days: 2
          if-no-files-found: error
