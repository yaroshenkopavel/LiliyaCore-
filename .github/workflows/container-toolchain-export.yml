name: Container Toolchain Repack

on:
  push:
    branches:
      - ops/container-restore-151187f

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Download already-built toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f
          path: ${{ runner.temp }}/parts
          github-token: ${{ github.token }}
          run-id: 35122319216

      - name: Verify expected split files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/parts"
          test -f liliya-local-base-toolchain.tar.gz.part-00
          test -f liliya-local-base-toolchain.tar.gz.part-01
          test -f liliya-local-base-toolchain.tar.gz.part-02
          test -f liliya-local-base-toolchain.tar.gz.part-03
          test -f liliya-local-base-toolchain.tar.gz.sha256
          ls -lh

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f-part-00
          path: ${{ runner.temp }}/parts/liliya-local-base-toolchain.tar.gz.part-00
          compression-level: 0
          retention-days: 3

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f-part-01
          path: ${{ runner.temp }}/parts/liliya-local-base-toolchain.tar.gz.part-01
          compression-level: 0
          retention-days: 3

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f-part-02
          path: ${{ runner.temp }}/parts/liliya-local-base-toolchain.tar.gz.part-02
          compression-level: 0
          retention-days: 3

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f-part-03
          path: ${{ runner.temp }}/parts/liliya-local-base-toolchain.tar.gz.part-03
          compression-level: 0
          retention-days: 3

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: liliya-local-base-toolchain-151187f-sha256
          path: ${{ runner.temp }}/parts/liliya-local-base-toolchain.tar.gz.sha256
          compression-level: 0
          retention-days: 3
