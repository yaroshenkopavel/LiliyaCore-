name: Structured decoding candidate finalizer 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/structured-decoding-finalizer-2026-09-11.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and publish exact locally audited tree
        shell: bash
        env:
          EXPECTED_MAIN: 5f949ec37cb17fad408509e2a1453c270aac1f63
          EXPECTED_TREE: bb8df9bb1f6ac88e27f6b128111f06820b4bee60
          TARGET_BRANCH: development-structured-cognitive-decoding-v0.1
          PATCH_B64_GZ: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          printf '%s' "$PATCH_B64_GZ" | base64 -d | gzip -d > /tmp/structured.patch
          git apply --index /tmp/structured.patch
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name yaroshenkopavel
          git config user.email '78513566+yaroshenkopavel@users.noreply.github.com'
          git commit -m 'Add constrained cognitive response decoding v0.1'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = '1'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH" --force
