name: Container Toolchain Runbook Export

on:
  push:
    branches:
      - ops/container-restore-151187f

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed-learning head
        uses: actions/checkout@v4
        with:
          ref: 151187f16488e4e97d84763bfc60883dfb99941b
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "151187f16488e4e97d84763bfc60883dfb99941b"
          git status --short --branch
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install verified Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Warm clean project-only Gradle home
        shell: bash
        run: |
          set -euo pipefail
          LILIYA_GRADLE_HOME="$RUNNER_TEMP/liliya-gradle-home"
          rm -rf "$LILIYA_GRADLE_HOME"
          mkdir -p "$LILIYA_GRADLE_HOME"
          GRADLE_USER_HOME="$LILIYA_GRADLE_HOME" gradle \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            :android-semantic-test-host:assembleDebugAndroidTest \
            --console=plain --no-daemon

      - name: Prove relevant offline gate
        shell: bash
        run: |
          set -euo pipefail
          LILIYA_GRADLE_HOME="$RUNNER_TEMP/liliya-gradle-home"
          GRADLE_USER_HOME="$LILIYA_GRADLE_HOME" gradle \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            :android-semantic-test-host:assembleDebugAndroidTest \
            --offline --console=plain --no-daemon

      - name: Package portable components
        shell: bash
        run: |
          set -euo pipefail
          LILIYA_GRADLE_HOME="$RUNNER_TEMP/liliya-gradle-home"
          out="$RUNNER_TEMP/liliya-runbook-export"
          mkdir -p "$out"
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_home="$(dirname "$(dirname "$gradle_bin")")"

          tar -C "$java_home" -czf "$out/jdk17.tar.gz" .
          tar -C "$gradle_home" -czf "$out/gradle-9.6.1.tar.gz" .
          tar -C "$(dirname "$LILIYA_GRADLE_HOME")" -czf "$out/gradle-home.tar.gz" "$(basename "$LILIYA_GRADLE_HOME")"

          sdkstage="$RUNNER_TEMP/android-sdk-compile"
          mkdir -p "$sdkstage/platforms" "$sdkstage/build-tools"
          cp -a "$ANDROID_HOME/licenses" "$sdkstage/"
          cp -a "$ANDROID_HOME/platform-tools" "$sdkstage/"
          cp -a "$ANDROID_HOME/platforms/android-35" "$sdkstage/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$sdkstage/build-tools/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$sdkstage/build-tools/"
          tar -C "$sdkstage" -czf "$out/android-sdk-compile.tar.gz" .

          tar -C "$ANDROID_HOME/ndk" -czf "$out/ndk.tar.gz" 29.0.13113456
          tar -C "$ANDROID_HOME/cmake" -czf "$out/cmake.tar.gz" 3.31.6

          split -b 400M -d -a 2 "$out/gradle-home.tar.gz" "$out/gradle-home.part."
          split -b 400M -d -a 2 "$out/ndk.tar.gz" "$out/ndk.part."
          rm "$out/gradle-home.tar.gz" "$out/ndk.tar.gz"
          (cd "$out" && sha256sum *.tar.gz gradle-home.part.* ndk.part.* > SHA256SUMS)
          ls -lh "$out"

      - name: Upload JDK17
        uses: actions/upload-artifact@v4
        with:
          name: runbook-jdk17
          path: ${{ runner.temp }}/liliya-runbook-export/jdk17.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Gradle runtime
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-9.6.1
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-9.6.1.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload compile SDK
        uses: actions/upload-artifact@v4
        with:
          name: runbook-android-sdk-compile
          path: ${{ runner.temp }}/liliya-runbook-export/android-sdk-compile.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: runbook-cmake-3.31.6
          path: ${{ runner.temp }}/liliya-runbook-export/cmake.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Gradle home 00
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-home-00
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-home.part.00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload Gradle home 01
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-home-01
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-home.part.01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload Gradle home 02
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-home-02
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-home.part.02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload Gradle home 03
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-home-03
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-home.part.03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload Gradle home 04
        uses: actions/upload-artifact@v4
        with:
          name: runbook-gradle-home-04
          path: ${{ runner.temp }}/liliya-runbook-export/gradle-home.part.04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload NDK 00
        uses: actions/upload-artifact@v4
        with:
          name: runbook-ndk-00
          path: ${{ runner.temp }}/liliya-runbook-export/ndk.part.00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload NDK 01
        uses: actions/upload-artifact@v4
        with:
          name: runbook-ndk-01
          path: ${{ runner.temp }}/liliya-runbook-export/ndk.part.01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload NDK 02
        uses: actions/upload-artifact@v4
        with:
          name: runbook-ndk-02
          path: ${{ runner.temp }}/liliya-runbook-export/ndk.part.02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload NDK 03
        uses: actions/upload-artifact@v4
        with:
          name: runbook-ndk-03
          path: ${{ runner.temp }}/liliya-runbook-export/ndk.part.03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: runbook-checksums
          path: ${{ runner.temp }}/liliya-runbook-export/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
