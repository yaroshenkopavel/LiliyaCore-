name: Qwen3 Candidate Physical Evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qwen3-candidate-physical-evidence.yml'
      - 'tools/physical-runner/**'
      - 'android-offline-semantic-provider/src/androidTest/**'
      - 'android-offline-semantic-provider/build.gradle.kts'
      - 'android-semantic-test-host/**'
      - 'android-llama-cpp-engine/**'
      - 'android-protected-model-staging/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qwen3-candidate-physical-evidence.yml'
      - 'tools/physical-runner/**'
      - 'android-offline-semantic-provider/src/androidTest/**'
      - 'android-offline-semantic-provider/build.gradle.kts'
      - 'android-semantic-test-host/**'
      - 'android-llama-cpp-engine/**'
      - 'android-protected-model-staging/**'
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: Successful Semantic Model Provenance run ID containing semantic-onnx-provenance
        required: true
        default: '33981322350'
        type: string
      confirm_large_candidate_download:
        description: Confirm the physical device may download the exact ~1.28 GB Qwen3 candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  validate-contract:
    name: Validate Qwen3 physical evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate fixed bridge and candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/physical-runner/liliya_physical_rish_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          bridge = Path('tools/physical-runner/liliya_physical_rish_bridge.py').read_text(encoding='utf-8')
          candidate = Path(
              'android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/'
              'OfflineSemanticProviderProductionGenerationCandidateInstrumentedTest.kt'
          ).read_text(encoding='utf-8')

          required_bridge = [
              'HOST = "127.0.0.1"',
              'Authorization',
              '/v1/install/semantic-app',
              '/v1/install/semantic-test',
              '/v1/reset-semantic-packages',
              '/v1/instrument/qwen3-candidate',
              'OfflineSemanticProviderProductionGenerationCandidateInstrumentedTest',
          ]
          for value in required_bridge:
              if value not in bridge:
                  raise SystemExit(f'missing fixed bridge contract: {value}')
          if re.search(r'/v1/(?:shell|command|exec)(?:["\'/]|$)', bridge):
              raise SystemExit('bridge must not expose arbitrary shell/command/exec endpoints')

          required_candidate = [
              'Qwen3-1.7B-Q4_K_M.gguf',
              '1_282_439_264L',
              'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5',
              'daeb8e2d528a760970442092f6bf1e55c3b659eb',
              'LlamaCppPromptFormatPolicy.MODEL_DEFAULT_CHAT_TEMPLATE',
              'What is two plus two? /no_think',
              'maxGeneratedTokens = 64',
              'maxOutputChars = 512',
          ]
          for value in required_candidate:
              if value not in candidate:
                  raise SystemExit(f'candidate contract drift: {value}')
          PY

  build-exact-bundle:
    name: Build exact Qwen3 candidate physical APK bundle
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact ONNX provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provenance_run_id || '33981322350' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact ONNX bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ['RUNNER_TEMP']) / 'semantic-onnx-download'
          manifests = list(root.rglob('semantic-onnx-provenance.json'))
          encoders = list(root.rglob('multilingual-e5-small-liliya-v0.1.onnx'))
          tokenizers = list(root.rglob('multilingual-e5-small-tokenizer-v0.1.onnx'))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f'unexpected provenance layout: manifest={manifests}, '
                  f'encoder={encoders}, tokenizer={tokenizers}'
              )

          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          encoder = manifest['encoder']
          tokenizer = manifest['tokenizer']

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder['size'] or digest(encoders[0]) != encoder['sha256']:
              raise SystemExit('encoder provenance mismatch')
          if tokenizers[0].stat().st_size != tokenizer['size'] or digest(tokenizers[0]) != tokenizer['sha256']:
              raise SystemExit('tokenizer provenance mismatch')

          assets = Path('android-offline-semantic-provider/src/androidTest/assets')
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Compile exact semantic host and candidate instrumentation
        run: |
          gradle \
            :android-semantic-test-host:assembleDebug \
            :android-semantic-test-host:assembleDebugAndroidTest \
            --console=plain

      - name: Collect exact APK bundle and manifest
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id || '33981322350' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qwen3-candidate-physical-bundle"
          mkdir -p "$out"

          app_apk="android-semantic-test-host/build/outputs/apk/debug/android-semantic-test-host-debug.apk"
          test_apk="android-semantic-test-host/build/outputs/apk/androidTest/debug/android-semantic-test-host-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"

          cp "$app_apk" "$out/liliya-semantic-host-debug.apk"
          cp "$test_apk" "$out/liliya-semantic-host-debug-androidTest.apk"

          SOURCE_TREE="$(git rev-parse HEAD^{tree})" python3 - "$out" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          out = Path(sys.argv[1])
          files = {}
          for path in sorted(out.iterdir()):
              if path.is_file():
                  h = hashlib.sha256()
                  with path.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          h.update(chunk)
                  files[path.name] = {
                      'sha256': h.hexdigest(),
                      'size': path.stat().st_size,
                  }

          manifest = {
              'evidenceClass': 'qwen3-candidate-physical-test-bundle',
              'sourceCommit': os.environ['EXACT_SHA'],
              'sourceTree': os.environ['SOURCE_TREE'],
              'semanticProvenanceRunId': os.environ['PROVENANCE_RUN_ID'],
              'candidate': {
                  'repository': 'ggml-org/Qwen3-1.7B-GGUF',
                  'revision': 'daeb8e2d528a760970442092f6bf1e55c3b659eb',
                  'file': 'Qwen3-1.7B-Q4_K_M.gguf',
                  'bytes': 1282439264,
                  'sha256': 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5',
                  'quantization': 'Q4_K_M',
                  'promptFormatPolicy': 'MODEL_DEFAULT_CHAT_TEMPLATE',
              },
              'applicationId': 'pro.liliya.android.semanticprovider',
              'testApplicationId': 'pro.liliya.android.semanticprovider.test',
              'instrumentationRunner': 'androidx.test.runner.AndroidJUnitRunner',
              'files': files,
          }
          (out / 'qwen3-candidate-physical-test-bundle.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          cat "$out/qwen3-candidate-physical-test-bundle.json"

      - name: Publish exact candidate APK bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen3-candidate-physical-test-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qwen3-candidate-physical-bundle
          if-no-files-found: error
          retention-days: 30

  physical-candidate:
    name: Physical ARM64 Qwen3 candidate execution evidence
    if: github.event_name == 'workflow_dispatch'
    needs: build-exact-bundle
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 120
    steps:
      - name: Require explicit large-download confirmation
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirm_large_candidate_download }}' = 'true' || {
            echo 'Qwen3 candidate physical execution requires explicit ~1.28 GB download confirmation.' >&2
            exit 1
          }

      - name: Verify pre-provisioned rish bridge
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v sha256sum
          command -v curl
          token_file='/data/data/com.termux/files/home/.liliya-physical-bridge-token'
          test -s "$token_file"
          token="$(cat "$token_file")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18765/v1/probe \
            > "$RUNNER_TEMP/qwen3-rish-bridge-probe.json"

      - name: Download exact candidate APK bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen3-candidate-physical-test-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/qwen3-candidate-physical-bundle

      - name: Verify exact candidate bundle
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/qwen3-candidate-physical-bundle" \
          EXPECTED_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['BUNDLE_DIR'])
          manifest = json.loads((root / 'qwen3-candidate-physical-test-bundle.json').read_text(encoding='utf-8'))
          if manifest.get('sourceCommit') != os.environ['EXPECTED_SOURCE_COMMIT']:
              raise SystemExit('source commit mismatch')
          source_tree = manifest.get('sourceTree')
          if not isinstance(source_tree, str) or len(source_tree) != 40:
              raise SystemExit('missing exact source tree')

          candidate = manifest.get('candidate', {})
          expected_candidate = {
              'repository': 'ggml-org/Qwen3-1.7B-GGUF',
              'revision': 'daeb8e2d528a760970442092f6bf1e55c3b659eb',
              'file': 'Qwen3-1.7B-Q4_K_M.gguf',
              'bytes': 1282439264,
              'sha256': 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5',
              'quantization': 'Q4_K_M',
              'promptFormatPolicy': 'MODEL_DEFAULT_CHAT_TEMPLATE',
          }
          if candidate != expected_candidate:
              raise SystemExit(f'candidate identity mismatch: {candidate!r}')

          for name, expected in manifest['files'].items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing bundle file: {name}')
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              if h.hexdigest() != expected['sha256'] or path.stat().st_size != expected['size']:
                  raise SystemExit(f'bundle file mismatch: {name}')
          PY

      - name: Verify physical ARM64 device
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/qwen3-rish-bridge-probe.json"
          python3 - "$probe" "$RUNNER_TEMP/qwen3-candidate-device.json" <<'PY'
          import json
          import sys

          probe = json.load(open(sys.argv[1], encoding='utf-8'))
          facts = {}
          for key in ('primaryAbi', 'qemu', 'sdk', 'model', 'shellIdentity'):
              item = probe[key]
              if item['exit'] != 0:
                  raise SystemExit(f'bridge probe failed for {key}: {item}')
              facts[key] = item['output']
          if facts['primaryAbi'] != 'arm64-v8a':
              raise SystemExit(f"not arm64-v8a: {facts['primaryAbi']}")
          if facts['qemu'] == '1':
              raise SystemExit('QEMU/emulator is not accepted')
          if int(facts['sdk']) < 29:
              raise SystemExit('Android API < 29')
          if not facts['shellIdentity'].startswith('uid=2000(shell)'):
              raise SystemExit('rish bridge is not running with Android shell identity')
          evidence = {
              'evidenceClass': 'qwen3-candidate-physical-device',
              'controlBackend': 'rish-bridge',
              **facts,
          }
          with open(sys.argv[2], 'w', encoding='utf-8') as stream:
              json.dump(evidence, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY

      - name: Install exact semantic host and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          auth=(-H "Authorization: Bearer $token")
          bundle="$RUNNER_TEMP/qwen3-candidate-physical-bundle"

          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            http://127.0.0.1:18765/v1/reset-semantic-packages \
            > "$RUNNER_TEMP/qwen3-rish-reset.json"

          app="$bundle/liliya-semantic-host-debug.apk"
          app_sha="$(sha256sum "$app" | awk '{print $1}')"
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            -H "X-Liliya-Sha256: $app_sha" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$app" \
            http://127.0.0.1:18765/v1/install/semantic-app \
            > "$RUNNER_TEMP/qwen3-rish-install-app.json"

          test_apk="$bundle/liliya-semantic-host-debug-androidTest.apk"
          test_sha="$(sha256sum "$test_apk" | awk '{print $1}')"
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            -H "X-Liliya-Sha256: $test_sha" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$test_apk" \
            http://127.0.0.1:18765/v1/install/semantic-test \
            > "$RUNNER_TEMP/qwen3-rish-install-test.json"

          cat "$RUNNER_TEMP/qwen3-rish-install-app.json"
          cat "$RUNNER_TEMP/qwen3-rish-install-test.json"

      - name: Run exact Qwen3 candidate instrumentation
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
          log="$RUNNER_TEMP/qwen3-candidate-instrumentation.log"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18765/v1/instrument/qwen3-candidate \
            2>&1 | tee "$log"
          grep -Fq 'INSTRUMENTATION_CODE: -1' "$log"
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$log"; then
            echo 'Qwen3 candidate instrumentation failed' >&2
            exit 1
          fi

      - name: Parse and validate Qwen3 candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/qwen3-candidate-instrumentation.log" \
            "$RUNNER_TEMP/qwen3-candidate-evidence.json" <<'PY'
          import json
          import sys

          values = {}
          prefix = 'INSTRUMENTATION_STATUS: postOnnxG3.'
          for raw in open(sys.argv[1], encoding='utf-8', errors='replace'):
              line = raw.rstrip('\n')
              if not line.startswith(prefix):
                  continue
              payload = line[len(prefix):]
              if '=' not in payload:
                  continue
              key, value = payload.split('=', 1)
              values[key] = value

          expected = {
              'generationModel': 'Qwen3-1.7B-Q4_K_M.gguf',
              'generationModelBytes': '1282439264',
              'generationModelSha256': 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5',
              'generationModelRevision': 'daeb8e2d528a760970442092f6bf1e55c3b659eb',
              'generationQuantization': 'Q4_K_M',
              'promptFormatPolicy': 'MODEL_DEFAULT_CHAT_TEMPLATE',
              'targetProductionLlmEvidence': 'candidate-physical',
              'primaryAbi': 'arm64-v8a',
              'semanticEntryCount': '20000',
          }
          for key, expected_value in expected.items():
              actual = values.get(key)
              if actual != expected_value:
                  raise SystemExit(f'{key} mismatch: {actual!r} != {expected_value!r}')

          required = (
              'semanticLoadMs',
              'semanticRebuild20kMs',
              'semanticReadyPssBytes',
              'candidateProvisionAndStageMs',
              'afterStagingPssBytes',
              'llamaActivationMs',
              'combinedActivePssBytes',
              'generationActivationPssDeltaBytes',
              'semanticQueryWhileLlamaActiveMs',
              'generationInferenceMs',
              'generationOutputChars',
              'combinedAfterInferencePssBytes',
              'afterBothClosedPssBytes',
          )
          missing = [key for key in required if key not in values]
          if missing:
              raise SystemExit(f'missing candidate evidence fields: {missing}')
          if int(values['generationOutputChars']) <= 0:
              raise SystemExit('candidate inference output is empty')
          for key in ('semanticReadyPssBytes', 'afterStagingPssBytes', 'combinedActivePssBytes', 'combinedAfterInferencePssBytes'):
              if int(values[key]) <= 0:
                  raise SystemExit(f'non-positive memory evidence: {key}={values[key]}')

          with open(sys.argv[2], 'w', encoding='utf-8') as stream:
              json.dump(values, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY

          cat "$RUNNER_TEMP/qwen3-candidate-evidence.json"

      - name: Publish physical Qwen3 candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen3-candidate-physical-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qwen3-candidate-physical-bundle/qwen3-candidate-physical-test-bundle.json
            ${{ runner.temp }}/qwen3-candidate-device.json
            ${{ runner.temp }}/qwen3-candidate-instrumentation.log
            ${{ runner.temp }}/qwen3-candidate-evidence.json
            ${{ runner.temp }}/qwen3-rish-bridge-probe.json
            ${{ runner.temp }}/qwen3-rish-reset.json
            ${{ runner.temp }}/qwen3-rish-install-app.json
            ${{ runner.temp }}/qwen3-rish-install-test.json
          if-no-files-found: error
          retention-days: 30
