name: Phone physical resource read-only snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phone-resource-readonly-snapshot-2026-11-02.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resource-snapshot:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 5
    steps:
      - name: Verify resource service responses without load
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, platform, urllib.request, urllib.error
          print("SOURCE_SHA="+os.environ.get("GITHUB_SHA",""), flush=True)
          print("RUNNER_NAME="+os.environ.get("RUNNER_NAME",""), flush=True)
          print("HOST_ARCH="+platform.machine(), flush=True)
          if platform.machine() not in ("aarch64","arm64"):
              raise SystemExit("FAIL_ARCH")
          token_path=pathlib.Path("/data/data/com.termux/files/home/.liliya-physical-bridge-token")
          token=token_path.read_text().strip()
          req=urllib.request.Request("http://127.0.0.1:18765/v1/resources",headers={"Authorization":"Bearer "+token})
          try:
              with urllib.request.urlopen(req,timeout=110) as response:
                  payload=json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit("BRIDGE_HTTP_ERROR="+str(exc.code)+" "+exc.read(1000).decode("utf-8","replace"))
          if payload.get("evidenceClass")!="phone-readonly-resources-v1":
              raise SystemExit("RESOURCE_EVIDENCE_CLASS_MISMATCH")
          for kind in ("battery","thermal"):
              item=payload.get(kind,{})
              output=item.get("output","")
              print(kind.upper()+"_EXIT="+str(item.get("exit")),flush=True)
              print(kind.upper()+"_OUTPUT_BYTES="+str(len(output.encode())),flush=True)
              if item.get("exit")!=0 or len(output.strip())<10:
                  raise SystemExit("FAIL_"+kind.upper())
              print(kind.upper()+"_SERVICE=PASS",flush=True)
          print("PHONE_READONLY_RESOURCES=PASS",flush=True)
          PY
