name: Export pinned llama.cpp source for local JNI build
on:
  push:
    branches: [technical/local-env-bridge-2026-10-31]
    paths: [.github/workflows/pinned-llama-source-bridge-2026-10-31.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/run-id"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.github/pinned-llama-run-id.txt" -f message="infra: pinned llama run index [skip ci]" -f content="$(base64 -w0 "$RUNNER_TEMP/run-id")" -f branch="technical/local-env-bridge-2026-10-31"
      - name: Fetch exact llama.cpp revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama-export"
          git clone https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-src"
          git -C "$RUNNER_TEMP/llama-src" checkout --detach 0f3a71be15af836d277c9f918adfafb45732677e
          test "$(git -C "$RUNNER_TEMP/llama-src" rev-parse HEAD)" = 0f3a71be15af836d277c9f918adfafb45732677e
          tar -czf "$RUNNER_TEMP/llama-export/llama-src-with-git.tar.gz" -C "$RUNNER_TEMP" llama-src
          (cd "$RUNNER_TEMP/llama-export"; sha256sum llama-src-with-git.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-llama-src-0f3a71be
          path: ${{ runner.temp }}/llama-export/
          retention-days: 1
