name: Temporary LiliyaCore APK Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apk-export-temp.yml'

permissions:
  contents: read

jobs:
  export-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build debug APK
        run: gradle :android-app:assembleDebug --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -f "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/liliyacore-debug-apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -20 | tee "$RUNNER_TEMP/liliyacore-debug-apk.badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-v1.16-test-debug-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            android-app/build/outputs/apk/debug/android-app-debug.apk
            ${{ runner.temp }}/liliyacore-debug-apk.sha256
            ${{ runner.temp }}/liliyacore-debug-apk.badging.txt
