name: Semantic Provider CI

on:
  push:
    branches:
      - main
      - semantic/**
    paths:
      - 'android-offline-semantic-provider/**'
      - '.github/workflows/semantic-provider-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-offline-semantic-provider/**'
      - '.github/workflows/semantic-provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-reference-quality:
    name: Trusted Semantic Reference Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned reference runtime
        run: python -m pip install --disable-pip-version-check 'torch==2.4.1' 'transformers==4.44.2'

      - name: Verify immutable upstream reference ranking
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TRANSFORMERS_VERBOSITY: error
        run: python android-offline-semantic-provider/ci/verify_trusted_reference_quality.py

  semantic-provider-ort:
    name: Android Offline Semantic Provider ORT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Resolve pinned ORT Android dependencies
        run: gradle :android-offline-semantic-provider:dependencies --configuration debugRuntimeClasspath --console=plain

      - name: Run semantic provider unit contracts
        run: gradle :android-offline-semantic-provider:testDebugUnitTest --console=plain

      - name: Compile ORT-backed semantic Android library
        run: gradle :android-offline-semantic-provider:assembleDebug --console=plain

      - name: Compile semantic instrumentation contracts
        run: gradle :android-offline-semantic-provider:assembleDebugAndroidTest --console=plain
