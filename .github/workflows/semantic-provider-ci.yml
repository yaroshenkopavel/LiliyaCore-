name: Semantic Provider CI

on:
  push:
    branches:
      - main
      - semantic/**
    paths:
      - 'android-offline-semantic-provider/**'
      - '.github/workflows/semantic-provider-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-offline-semantic-provider/**'
      - '.github/workflows/semantic-provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-provider-native:
    name: Android Offline Semantic Provider Native
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build pinned semantic JNI for arm64
        run: gradle :android-offline-semantic-provider:assembleRelease --console=plain

      - name: Run semantic provider unit contracts
        run: gradle :android-offline-semantic-provider:testDebugUnitTest --console=plain

      - name: Prepare controlled multilingual embedding fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-offline-semantic-provider/src/androidTest/assets"
          asset="$asset_dir/multilingual-e5-small-q8_0.gguf"
          identity_file="android-offline-semantic-provider/src/androidTest/semantic-fixture-identity.env"
          test_file="android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderRealModelInstrumentedTest.kt"
          mkdir -p "$asset_dir"

          # Diagnostic artifact bisect. Resolve the verified conversion commit to
          # its full immutable revision and record exact bytes before Android use.
          model_repo="TwinSunsLLC/multilingual-e5-small-gguf"
          requested_revision="b6cac96"
          metadata="$(curl --fail --location --retry 3 \
            "https://huggingface.co/api/models/${model_repo}/revision/${requested_revision}")"
          exact_revision="$(jq -er '.sha' <<<"$metadata")"
          filename="$(jq -er '[.siblings[].rfilename | select(test("(?i)q8_0.*\\.gguf$"))][0]' <<<"$metadata")"
          test -n "$exact_revision"
          test -n "$filename"

          curl --fail --location --retry 3 \
            "https://huggingface.co/${model_repo}/resolve/${exact_revision}/${filename}?download=true" \
            --output "$asset"

          fixture_sha256="$(sha256sum "$asset" | awk '{print $1}')"
          fixture_size="$(stat --format=%s "$asset")"
          test "$fixture_size" -gt 100000000
          test "$fixture_size" -lt 170000000

          cat > "$identity_file" <<EOF
          SEMANTIC_FIXTURE_REPOSITORY=${model_repo}
          SEMANTIC_FIXTURE_REVISION=${exact_revision}
          SEMANTIC_FIXTURE_FILE=${filename}
          SEMANTIC_FIXTURE_SHA256=${fixture_sha256}
          SEMANTIC_FIXTURE_SIZE=${fixture_size}
          EOF
          cat "$identity_file"

          # Diagnostic-only binding: compile the Android contract against the
          # exact bytes downloaded above. If this candidate succeeds, these
          # values are committed as constants and this mutation is removed.
          python - "$test_file" "$fixture_size" "$fixture_sha256" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          size = sys.argv[2]
          sha = sys.argv[3]
          text = path.read_text()
          text, size_count = re.subn(
              r'const val FIXTURE_SIZE_BYTES = [0-9_]+L',
              f'const val FIXTURE_SIZE_BYTES = {size}L',
              text,
              count=1,
          )
          text, sha_count = re.subn(
              r'const val FIXTURE_SHA256 =\s*\n\s*"[0-9a-f]{64}"',
              f'const val FIXTURE_SHA256 =\n            "{sha}"',
              text,
              count=1,
          )
          if size_count != 1 or sha_count != 1:
              raise SystemExit('failed to bind exact diagnostic fixture identity')
          path.write_text(text)
          PY

      - name: Compile pinned multilingual instrumentation contract
        run: gradle :android-offline-semantic-provider:assembleDebugAndroidTest --console=plain

      - name: Run pinned multilingual embeddings through API 35 Google APIs translation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :android-offline-semantic-provider:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest#pinned_multilingual_e5_q8_loads_and_closes_without_embedding' --console=plain
            adb logcat -c || true
            embedding_status=0; gradle :android-offline-semantic-provider:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.android.semanticprovider.OfflineSemanticProviderRealModelInstrumentedTest#pinned_multilingual_e5_q8_runs_through_validator_native_session_and_close' --console=plain || embedding_status=$?; if [ "$embedding_status" -ne 0 ]; then echo '=== STRUCTURAL NATIVE CRASH EVIDENCE ==='; adb logcat -d 2>/dev/null | grep -E 'unsupported types:|GGML_ASSERT|GGML_ABORT|ggml_compute_forward_add_non_quantized|ABI:|Fatal signal|signal [0-9]+|backtrace:|#[0-9]+ pc .*lib(liliya-semantic|llama|ggml)' || true; exit "$embedding_status"; fi
            gradle :android-offline-semantic-provider:connectedDebugAndroidTest --console=plain
