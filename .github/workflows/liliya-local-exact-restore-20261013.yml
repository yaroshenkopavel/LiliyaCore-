name: Liliya Exact Main Source Transport
on:
  push:
    branches: [technical/local-env-restore-retry-2026-10-13]
permissions:
  contents: read
jobs:
  exact-main-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 8c18a4ff4394bce89a9f33648feb0a6751879669
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate and export exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/exact-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/exact-source/worktree.tar.gz" HEAD
          tar czf "$RUNNER_TEMP/exact-source/git.tar.gz" .git
          { echo "target_sha=$(git rev-parse HEAD)"; echo "target_tree=$(git rev-parse HEAD^{tree})"; cd "$RUNNER_TEMP/exact-source"; sha256sum worktree.tar.gz git.tar.gz; } > "$RUNNER_TEMP/exact-source/manifest.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-exact-main-source-8c18a4ff
          path: ${{ runner.temp }}/exact-source/
          if-no-files-found: error
          retention-days: 7
