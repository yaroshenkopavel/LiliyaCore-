name: Liliya Local Exact Environment Restore 20261013 Main Transport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liliya-local-exact-restore-20261013.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/liliya-local-exact-restore-20261013.yml'
permissions:
  contents: read
jobs:
  source-and-toolchain:
    if: false # toolchain already verified and exported; source-only reanchor
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: f20120177d04a5d2fb592b25a453472445eb0461
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact canonical source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install exact project SDK dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Apply proven hosted Gradle and Kotlin memory policy to project cache
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/liliya-gradle-home
        run: |
          set -euo pipefail
          bash .github/ci/configure-gradle-memory.sh
          mkdir -p "$GRADLE_USER_HOME"
          cp "$HOME/.gradle/gradle.properties" "$GRADLE_USER_HOME/gradle.properties"
          cat "$GRADLE_USER_HOME/gradle.properties"
      - name: Warm project-only Gradle cache
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/liliya-gradle-home
        run: |
          set -euo pipefail
          gradle :android-app:testDebugUnitTest :android-runtime:testDebugUnitTest :core:test :android-app:compileDebugAndroidTestKotlin --console=plain --no-daemon
          gradle :core:test --offline --console=plain --no-daemon
      - name: Export exact source, toolchain, and checksums
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/liliya-gradle-home
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/liliya-export"
          E="$RUNNER_TEMP/liliya-export"
          git archive --format=tar.gz --output="$E/worktree.tar.gz" HEAD
          tar czf "$E/git.tar.gz" .git
          J="$(readlink -f "$JAVA_HOME")"
          test -x "$J/bin/java"
          tar czf "$E/jdk17-real.tar.gz" -C "$(dirname "$J")" "$(basename "$J")"
          tar tzf "$E/jdk17-real.tar.gz" > "$E/jdk17-archive-list.txt"
          grep -q '/bin/java$' "$E/jdk17-archive-list.txt"
          G="$(readlink -f "$(command -v gradle)")"
          GR="$(cd "$(dirname "$G")/.." && pwd)"
          tar czf "$E/gradle-9.6.1.tar.gz" -C "$(dirname "$GR")" "$(basename "$GR")"
          mkdir -p "$E/sdk-core"
          for p in platforms/android-35 build-tools/35.0.0 build-tools/36.0.0 platform-tools; do
            mkdir -p "$E/sdk-core/$(dirname "$p")"
            cp -a "$ANDROID_HOME/$p" "$E/sdk-core/$p"
          done
          tar czf "$E/android-sdk-core.tar.gz" -C "$E/sdk-core" .
          tar czf "$E/cmake-3.31.6.tar.gz" -C "$ANDROID_HOME/cmake" 3.31.6
          tar czf "$E/ndk.tar.gz" -C "$ANDROID_HOME/ndk" 29.0.13113456
          split -b 300M -d -a 2 "$E/ndk.tar.gz" "$E/ndk.part."
          tar czf "$E/gradle-home.tar.gz" -C "$RUNNER_TEMP" liliya-gradle-home
          split -b 300M -d -a 2 "$E/gradle-home.tar.gz" "$E/gradle-home.part."
          { echo "target_sha=$(git rev-parse HEAD)"; echo "target_tree=$(git rev-parse HEAD^{tree})"; java -version 2>&1 | head -1; gradle --version | grep "^Gradle "; sha256sum "$E"/*.tar.gz "$E"/ndk.part.* "$E"/gradle-home.part.*; } > "$E/manifest.txt"
          # Fail before publishing if a standalone transport archive exceeds the connector limit.
          # Split parts are limited to 300 MiB each; each artifact uploads only its named part.
          python3 - "$E" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          max_bytes = 480 * 1024 * 1024
          names = ("worktree.tar.gz", "git.tar.gz", "jdk17-real.tar.gz",
                   "gradle-9.6.1.tar.gz", "android-sdk-core.tar.gz",
                   "cmake-3.31.6.tar.gz")
          for name in names:
              p = root / name
              if not p.is_file() or not (0 < p.stat().st_size <= max_bytes):
                  raise SystemExit(f"TRANSPORT_ARCHIVE_SIZE_INVALID: {name}")
          for pattern in ("ndk.part.*", "gradle-home.part.*"):
              parts = sorted(root.glob(pattern))
              if not parts or any(not (0 < p.stat().st_size <= max_bytes) for p in parts):
                  raise SystemExit(f"TRANSPORT_PART_SIZE_INVALID: {pattern}")
          print("TRANSPORT_ALL_ARTIFACT_PARTS_WITHIN_480_MIB")
          PY
          mkdir -p "$E/transport"
          mv "$E"/*.tar.gz "$E"/ndk.part.* "$E"/gradle-home.part.* "$E"/manifest.txt "$E/transport/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-source-manifest
          path: |
            ${{ runner.temp }}/liliya-export/transport/worktree.tar.gz
            ${{ runner.temp }}/liliya-export/transport/git.tar.gz
            ${{ runner.temp }}/liliya-export/transport/manifest.txt
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-jdk17
          path: |
            ${{ runner.temp }}/liliya-export/transport/jdk17-real.tar.gz
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-runtime
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-9.6.1.tar.gz
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-android-sdk
          path: |
            ${{ runner.temp }}/liliya-export/transport/android-sdk-core.tar.gz
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-cmake
          path: |
            ${{ runner.temp }}/liliya-export/transport/cmake-3.31.6.tar.gz
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part00
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.00
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part01
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.01
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part02
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.02
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part03
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.03
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part04
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.04
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part05
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.05
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-ndk-part06
          path: |
            ${{ runner.temp }}/liliya-export/transport/ndk.part.06
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part00
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.00
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part01
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.01
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part02
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.02
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part03
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.03
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part04
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.04
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part05
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.05
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-local-20261012-gradle-cache-part06
          path: |
            ${{ runner.temp }}/liliya-export/transport/gradle-home.part.06
          if-no-files-found: warn
          retention-days: 2
  exact-source-reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ba86ebf8f51a72203ea9220fca114e523dc222bb
          fetch-depth: 1
      - name: Export immutable current-main Git source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba86ebf8f51a72203ea9220fca114e523dc222bb"
          mkdir -p "$RUNNER_TEMP/exact-reanchor"
          git archive --format=tar.gz --output="$RUNNER_TEMP/exact-reanchor/worktree.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/exact-reanchor/git.tar.gz" .git
          { echo "target_sha=$(git rev-parse HEAD)"; echo "target_tree=$(git rev-parse HEAD^{tree})"; sha256sum "$RUNNER_TEMP/exact-reanchor/"*.tar.gz; } > "$RUNNER_TEMP/exact-reanchor/manifest.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liliya-source-reanchor-ba86ebf8
          path: ${{ runner.temp }}/exact-reanchor/
          retention-days: 2
