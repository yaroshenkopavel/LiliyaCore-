name: Local Snapshot Bridge

on:
  push:
    branches:
      - foundation/local-snapshot-bridge-2026-09-12

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: 78f4b7f5333977e6aae26fc890da3599b8d47f97
          fetch-depth: 1

      - name: Verify canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78f4b7f5333977e6aae26fc890da3599b8d47f97"
          test "$(git rev-parse HEAD^{tree})" = "59b351cd3bb5bf4e21fde079ba1797a175e9b14a"
          printf '%s\n' "78f4b7f5333977e6aae26fc890da3599b8d47f97" > CANONICAL_COMMIT
          printf '%s\n' "59b351cd3bb5bf4e21fde079ba1797a175e9b14a" > CANONICAL_TREE

      - name: Build exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='**/build' \
            --exclude='.gradle' \
            --exclude='**/.gradle' \
            -czf /tmp/liliyacore-main-78f4b7f5.tar.gz .
          sha256sum /tmp/liliyacore-main-78f4b7f5.tar.gz > /tmp/liliyacore-main-78f4b7f5.tar.gz.sha256

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-main-78f4b7f5-snapshot
          path: |
            /tmp/liliyacore-main-78f4b7f5.tar.gz
            /tmp/liliyacore-main-78f4b7f5.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
