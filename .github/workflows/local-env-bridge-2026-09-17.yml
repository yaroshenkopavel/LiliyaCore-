name: Local First JDK17 Repair Bridge 2026-09-17

on:
  push:
    branches:
      - technical/local-env-bridge-2026-09-17

permissions:
  contents: read

env:
  TARGET_SHA: 6578b7a7da9e855e7659e3f48043f0e0b6bad178

jobs:
  export-jdk17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "42633277e2ecf99d04c162ea10a782df7f4e3a57"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Package dereferenced JDK 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          REAL_JAVA_HOME="$(readlink -f "$JAVA_HOME")"
          test -x "$REAL_JAVA_HOME/bin/java"
          tar -C "$(dirname "$REAL_JAVA_HOME")" -czf "$RUNNER_TEMP/export/jdk17-real.tar.gz" "$(basename "$REAL_JAVA_HOME")"
          tar -tzf "$RUNNER_TEMP/export/jdk17-real.tar.gz" | grep -q '/bin/java$'
          sha256sum "$RUNNER_TEMP/export/jdk17-real.tar.gz" > "$RUNNER_TEMP/export/jdk17-real.sha256"
          "$REAL_JAVA_HOME/bin/java" -version

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: local-first-jdk17-real
          path: |
            ${{ runner.temp }}/export/jdk17-real.tar.gz
            ${{ runner.temp }}/export/jdk17-real.sha256
          retention-days: 1
          compression-level: 0
