name: Core CI

on:
  push:
    branches:
      - main
      - foundation/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    name: Test LiliyaCore
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run core tests
        run: gradle :core:test --console=plain

  android-device-key-instrumentation:
    name: Android Keystore Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: core-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Android device-key tests
        run: gradle :android-device-key:assembleDebug :android-device-key:assembleDebugAndroidTest --console=plain

      - name: Run Android Keystore instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :android-device-key:connectedDebugAndroidTest --console=plain

  android-protected-model-staging-instrumentation:
    name: Android Protected Model Staging Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: core-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Android staging tests
        run: gradle :android-protected-model-staging:assembleDebug :android-protected-model-staging:assembleDebugAndroidTest --console=plain

      - name: Run Android staging instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :android-protected-model-staging:connectedDebugAndroidTest --console=plain

  android-protected-model-engine-source-instrumentation:
    name: Android Protected Model Engine Source Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: core-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Android engine-source tests
        run: gradle :android-protected-model-engine-source:assembleDebug :android-protected-model-engine-source:assembleDebugAndroidTest --console=plain

      - name: Run Android engine-source instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :android-protected-model-engine-source:connectedDebugAndroidTest --console=plain

  android-llama-cpp-arm64-build:
    name: Android llama.cpp arm64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: core-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run llama.cpp engine ownership contracts
        run: gradle :android-llama-cpp-engine:testDebugUnitTest --console=plain

      - name: Prepare verified real-model instrumentation fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-llama-cpp-engine/src/androidTest/assets"
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true" \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344

      - name: Compile verified real-model instrumentation contract
        run: gradle :android-llama-cpp-engine:assembleDebugAndroidTest --console=plain

      - name: Build pinned llama.cpp JNI for arm64
        run: gradle :android-llama-cpp-engine:assembleRelease --console=plain

      - name: Run arm64 real-model instrumentation through API 35 Google APIs translation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :android-llama-cpp-engine:connectedDebugAndroidTest --console=plain
