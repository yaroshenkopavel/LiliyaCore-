name: Visual APK VM Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/visual-apk-vm-acceptance.yml'
      - 'android-app/**'
      - 'android-runtime/**'
      - 'core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-apk-vm:
    name: Install and inspect APK on Android VM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android VM toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Build exact debug APK
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: "1"
        run: gradle :android-app:assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK, launch app, capture visible screen
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/liliya-visual"
            apk='android-app/build/outputs/apk/debug/android-app-debug.apk'
            test -f "$apk"
            adb install -r "$apk"
            adb shell am force-stop pro.liliya.app
            adb shell monkey -p pro.liliya.app -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > "$RUNNER_TEMP/liliya-visual/window-focus.txt" || true
            adb exec-out screencap -p > "$RUNNER_TEMP/liliya-visual/launcher.png"
            adb shell uiautomator dump /sdcard/liliya-window.xml
            adb pull /sdcard/liliya-window.xml "$RUNNER_TEMP/liliya-visual/window.xml"
            test -s "$RUNNER_TEMP/liliya-visual/launcher.png"
            grep -F 'pro.liliya.app' "$RUNNER_TEMP/liliya-visual/window-focus.txt"
            grep -F 'Liliya — подготовка доступа' "$RUNNER_TEMP/liliya-visual/window.xml"
            grep -F 'Требуется доступ продукта' "$RUNNER_TEMP/liliya-visual/window.xml"
            grep -F 'Импортировать доступ продукта' "$RUNNER_TEMP/liliya-visual/window.xml"

      - name: Upload visual APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-apk-vm-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/liliya-visual/launcher.png
            ${{ runner.temp }}/liliya-visual/window.xml
            ${{ runner.temp }}/liliya-visual/window-focus.txt
