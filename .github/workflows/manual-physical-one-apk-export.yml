name: Manual Physical One-APK Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/manual-physical-one-apk-export.yml'
      - 'android-app/src/debug/**'

permissions:
  contents: read

jobs:
  build-manual-physical-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Guard test-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/src/debug/kotlin/pro/liliya/app/ManualPhysicalAcceptanceActivity.kt
          test -f android-app/src/debug/AndroidManifest.xml
          test ! -e android-app/src/main/kotlin/pro/liliya/app/ManualPhysicalAcceptanceActivity.kt
          grep -Fq 'ManualPhysicalAcceptanceActivity' android-app/src/debug/AndroidManifest.xml
          grep -Fq 'LPAUTH1' android-app/src/debug/kotlin/pro/liliya/app/ManualPhysicalAcceptanceActivity.kt
          grep -Fq 'ProductionAndroidProductAuthCredentialImport.import' android-app/src/debug/kotlin/pro/liliya/app/ManualPhysicalAcceptanceActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build manual physical debug APK
        run: gradle :android-app:assembleDebug --console=plain

      - name: Verify APK and publish identity
        shell: bash
        run: |
          set -euo pipefail
          apk='android-app/build/outputs/apk/debug/android-app-debug.apk'
          test -f "$apk"
          mkdir -p "$RUNNER_TEMP/manual-physical-apk"
          cp "$apk" "$RUNNER_TEMP/manual-physical-apk/LiliyaCore-manual-physical-test.apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/manual-physical-apk/SHA256.txt"
          stat --format='%s bytes' "$apk" | tee "$RUNNER_TEMP/manual-physical-apk/SIZE.txt"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/manual-physical-apk/SOURCE_SHA.txt"

      - name: Upload manual physical test APK
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-manual-physical-test-apk-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/manual-physical-apk/
