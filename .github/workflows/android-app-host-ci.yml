name: Production Android App Host CI

concurrency:
  group: production-android-app-host-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/259-android-activation-redemption-v1-2026-10-02
      - fix/259-cold-launch-policy-reconstruction-2026-10-05
      - reconciliation/product-core-next-2026-10-05
    paths:
      - '.github/workflows/android-app-host-ci.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'android-app/**'
      - 'android-runtime/**'
      - 'core/**'
      - 'android-device-key/**'
      - 'android-protected-model-staging/**'
      - 'android-protected-model-engine-source/**'
      - 'android-llama-cpp-engine/**'
      - 'android-offline-semantic-provider/**'
      - 'android-durable-persistence/**'
      - 'android-cognitive-storage/**'
      - 'android-license-state/**'
      - 'license-transport-client/**'
      - 'protected-model-packager/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-app-host-ci.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'android-app/**'
      - 'android-runtime/**'
      - 'core/**'
      - 'android-device-key/**'
      - 'android-protected-model-staging/**'
      - 'android-protected-model-engine-source/**'
      - 'android-llama-cpp-engine/**'
      - 'android-offline-semantic-provider/**'
      - 'android-durable-persistence/**'
      - 'android-cognitive-storage/**'
      - 'android-license-state/**'
      - 'license-transport-client/**'
      - 'protected-model-packager/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-app-host:
    name: Android App Host exact build gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'

      - name: Configure hosted CI Gradle/Kotlin memory
        shell: bash
        run: bash .github/ci/configure-gradle-memory.sh

      - name: Cache reviewed llama.cpp source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/liliya-cmake-fetchcontent/*/llama_cpp-src
          key: liliya-llama-src-${{ runner.os }}-${{ hashFiles('android-llama-cpp-engine/src/main/cpp/CMakeLists.txt') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Run exact production app host gate
        run: |
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            :android-app:assembleRelease \
            --max-workers=2 \
            -Pkotlin.daemon.jvmargs=-Xmx1536m \
            --console=plain

      - name: Verify monotonic Android release version
        shell: bash
        run: |
          set -euo pipefail

          props="android-app/version.properties"
          apk="android-app/build/outputs/apk/release/android-app-release-unsigned.apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -f "$props"
          test -f "$apk"
          test -x "$aapt"

          current_code="$(awk -F= '$1=="versionCode"{print $2}' "$props")"
          current_name="$(awk -F= '$1=="versionName"{print $2}' "$props")"
          previous_code="$(awk -F= '$1=="previousAcceptedVersionCode"{print $2}' "$props")"
          previous_name="$(awk -F= '$1=="previousAcceptedVersionName"{print $2}' "$props")"

          [[ "$current_code" =~ ^[0-9]{8}$ ]]
          [[ "$previous_code" =~ ^[0-9]+$ ]]
          [[ "$current_name" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$previous_name" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]

          python3 - "$current_code" <<'PY'
          import datetime
          import sys

          code = sys.argv[1]
          yy = int(code[0:2])
          mm = int(code[2:4])
          dd = int(code[4:6])
          rr = int(code[6:8])
          datetime.date(2000 + yy, mm, dd)
          if not 1 <= rr <= 99:
              raise SystemExit("versionCode RR must be in 01..99")
          PY

          test "$current_code" -ge "$previous_code"
          if test "$current_code" -eq "$previous_code"; then
            test "$current_name" = "$previous_name"
            version_state="ACCEPTED_BASELINE"
          else
            version_state="SUCCESSOR_CANDIDATE"
          fi

          package_line="$("$aapt" dump badging "$apk" | grep -m1 '^package:')"
          echo "$package_line" | grep -Fq "name='pro.liliya.app'"
          echo "$package_line" | grep -Fq "versionCode='$current_code'"
          echo "$package_line" | grep -Fq "versionName='$current_name'"

          echo "ANDROID_VERSION_POLICY=PASS"
          echo "ANDROID_VERSION_STATE=$version_state"
          echo "ANDROID_VERSION_TRANSITION=$previous_code/$previous_name->$current_code/$current_name"

      - name: Guard release APK from cold-start test payloads
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/release/android-app-release-unsigned.apk"
          test -f "$apk"
          listing="$RUNNER_TEMP/android-app-release-files.txt"
          unzip -Z1 "$apk" > "$listing"

          if grep -E \
              'stories15M-q4_0\.gguf|multilingual-e5-small-liliya-v0\.1\.onnx|multilingual-e5-small-tokenizer-v0\.1\.onnx' \
              "$listing"; then
            echo "cold-start test model asset leaked into production release APK"
            exit 1
          fi

          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Fq \
                'pro/liliya/packager/ProtectedModelOfflinePackager'; then
              echo "offline protected-model packager leaked into production release APK: $dex"
              exit 1
            fi
          done < <(grep -E '^classes([0-9]+)?\.dex$' "$listing")

  development-first-working-liliya-cold-start:
    name: Development First Working Liliya cold-start fixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: android-app-host

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve live semantic provenance artifact
        id: semantic-provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-semantic-provenance-run.sh

      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ steps.semantic-provenance.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["RUNNER_TEMP"]) / "semantic-onnx-download"
          manifests = list(root.rglob("semantic-onnx-provenance.json"))
          encoders = list(root.rglob("multilingual-e5-small-liliya-v0.1.onnx"))
          tokenizers = list(root.rglob("multilingual-e5-small-tokenizer-v0.1.onnx"))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f"unexpected provenance layout: manifest={manifests}, "
                  f"encoder={encoders}, tokenizer={tokenizers}"
              )

          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          encoder = manifest["encoder"]
          tokenizer = manifest["tokenizer"]

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder["size"] or digest(encoders[0]) != encoder["sha256"]:
              raise SystemExit("encoder provenance mismatch")
          if tokenizers[0].stat().st_size != tokenizer["size"] or digest(tokenizers[0]) != tokenizer["sha256"]:
              raise SystemExit("tokenizer provenance mismatch")

          assets = Path("android-app/src/androidTest/assets")
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)
          PY

      - name: Prepare verified real-model cold-start fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-app/src/androidTest/assets"
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true" \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'

      - name: Configure hosted CI Gradle/Kotlin memory
        shell: bash
        run: bash .github/ci/configure-gradle-memory.sh

      - name: Cache reviewed llama.cpp source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/liliya-cmake-fetchcontent/*/llama_cpp-src
          key: liliya-llama-src-${{ runner.os }}-${{ hashFiles('android-llama-cpp-engine/src/main/cpp/CMakeLists.txt') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android instrumentation toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile cold-start instrumentation
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: "1"
        run: >-
          gradle
          :android-app:assembleDebug
          :android-app:assembleDebugAndroidTest
          --max-workers=2
          -Pkotlin.daemon.jvmargs=-Xmx1536m
          --console=plain

      - name: Run First Working Liliya cold-start instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: "1"
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash -lc 'set -o pipefail; gradle :android-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=pro.liliya.app.DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx1536m --console=plain 2>&1 | tee "$RUNNER_TEMP/development-first-working-liliya-cold-start.log"'

      - name: Upload cold-start instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-first-working-liliya-cold-start-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/development-first-working-liliya-cold-start.log
            android-app/build/outputs/androidTest-results/connected/**
            android-app/build/reports/androidTests/connected/**
