name: Production Android App Host CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-app-host-ci.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'android-app/**'
      - 'android-runtime/**'
      - 'core/**'
      - 'android-device-key/**'
      - 'android-protected-model-staging/**'
      - 'android-protected-model-engine-source/**'
      - 'android-llama-cpp-engine/**'
      - 'android-offline-semantic-provider/**'
      - 'android-durable-persistence/**'
      - 'android-cognitive-storage/**'
      - 'android-license-state/**'
      - 'license-transport-client/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-app-host-ci.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'android-app/**'
      - 'android-runtime/**'
      - 'core/**'
      - 'android-device-key/**'
      - 'android-protected-model-staging/**'
      - 'android-protected-model-engine-source/**'
      - 'android-llama-cpp-engine/**'
      - 'android-offline-semantic-provider/**'
      - 'android-durable-persistence/**'
      - 'android-cognitive-storage/**'
      - 'android-license-state/**'
      - 'license-transport-client/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-app-host:
    name: Android App Host exact build gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Run exact production app host gate
        run: |
          gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:assembleDebug \
            --console=plain
