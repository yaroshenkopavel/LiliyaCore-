name: Local Full Gradle Modules Cache Export 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/local-full-modules-cache-export-2026-09-11.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 source tree
        uses: actions/checkout@v4
        with:
          ref: e2fd4d112d7edb17bbae743d872b96e1fbcffa25

      - name: Verify exact PR 212 tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e2fd4d112d7edb17bbae743d872b96e1fbcffa25"
          test "$(git rev-parse HEAD^{tree})" = "28acb8a8df9fda3e27d6350cefa71fa459035d69"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Resolve exact local acceptance dependency graph
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :core:test \
            :android-runtime:testDebugUnitTest \
            :android-app:testDebugUnitTest \
            :android-app:compileDebugAndroidTestKotlin \
            :android-app:assembleDebug \
            :android-app:assembleRelease \
            --console=plain --no-daemon

      - name: Package full modules cache
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLE_USER_HOME"
          test -d caches/modules-2
          tar -czf "$RUNNER_TEMP/gradle-modules-2-pr212-host-ready.tar.gz" caches/modules-2
          gzip -t "$RUNNER_TEMP/gradle-modules-2-pr212-host-ready.tar.gz"
          du -h "$RUNNER_TEMP/gradle-modules-2-pr212-host-ready.tar.gz"

      - name: Upload full modules cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-modules-2-pr212-host-ready
          path: ${{ runner.temp }}/gradle-modules-2-pr212-host-ready.tar.gz
          retention-days: 7
          if-no-files-found: error
