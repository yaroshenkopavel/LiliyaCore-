name: Physical First Working Liliya Acceptance

on:
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: Successful Semantic Model Provenance run ID containing semantic-onnx-provenance
        required: false
        default: '33981322350'
        type: string
      device_backend:
        description: Physical Android control backend on the self-hosted ARM64 runner
        required: true
        default: rish-bridge
        type: choice
        options:
          - rish-bridge
          - adb
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/physical-first-working-liliya-acceptance.yml'
      - 'tools/physical-runner/**'
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalProductAuthProvisioningToChatInstrumentedTest.kt'
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'

permissions:
  contents: read
  actions: read

jobs:
  validate-physical-acceptance-contract:
    name: Validate physical acceptance workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate workflow, provisioning gate, and cold-start contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/physical-first-working-liliya-acceptance.yml'
          bridge='tools/physical-runner/liliya_physical_rish_bridge.py'
          provisioning_test='android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalProductAuthProvisioningToChatInstrumentedTest.kt'
          cold_start_test='android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'

          test -f "$workflow"
          test -f "$bridge"
          test -f "$provisioning_test"
          test -f "$cold_start_test"
          grep -Fq 'runs-on: [self-hosted, ARM64, android-device]' "$workflow"
          grep -Fq "if: github.event_name == 'workflow_dispatch'" "$workflow"
          grep -Fq 'Build exact physical acceptance APK bundle' "$workflow"
          grep -Fq 'Verify exact physical acceptance bundle' "$workflow"
          grep -Fq 'device_backend:' "$workflow"
          grep -Fq 'rish-bridge' "$workflow"
          grep -Fq 'test "$abi" = "arm64-v8a"' "$workflow"
          grep -Fq 'test "$qemu" != "1"' "$workflow"
          grep -Fq 'PhysicalProductAuthProvisioningToChatInstrumentedTest' "$workflow"
          grep -Fq 'DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest' "$workflow"
          grep -Fq 'MODEL_DEFAULT_CHAT_TEMPLATE' \
            android-offline-semantic-provider/src/androidTest/kotlin/pro/liliya/android/semanticprovider/OfflineSemanticProviderProductionGenerationCandidateInstrumentedTest.kt
          grep -Fq 'class PhysicalProductAuthProvisioningToChatInstrumentedTest' "$provisioning_test"
          grep -Fq 'class DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest' "$cold_start_test"
          grep -Fq 'ThreadingHTTPServer((HOST, PORT), Handler)' "$bridge"
          grep -Fq 'HOST = "127.0.0.1"' "$bridge"
          grep -Fq 'Authorization' "$bridge"
          if grep -Eq '/v1/(shell|command|exec)' "$bridge"; then
            echo 'physical bridge must not expose arbitrary command execution' >&2
            exit 1
          fi
          python3 -m py_compile "$bridge"

          forbidden='LILIYA_LLAMA_ALLOW_X86_64_API35_'
          forbidden+='TRANSLATION'
          if grep -Fq "$forbidden" "$workflow"; then
            echo 'physical acceptance must not enable x86_64 translation mode' >&2
            exit 1
          fi

  build-physical-acceptance-bundle:
    name: Build exact physical acceptance APK bundle
    needs: validate-physical-acceptance-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provenance_run_id || '33981322350' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["RUNNER_TEMP"]) / "semantic-onnx-download"
          manifests = list(root.rglob("semantic-onnx-provenance.json"))
          encoders = list(root.rglob("multilingual-e5-small-liliya-v0.1.onnx"))
          tokenizers = list(root.rglob("multilingual-e5-small-tokenizer-v0.1.onnx"))
          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f"unexpected provenance layout: manifest={manifests}, "
                  f"encoder={encoders}, tokenizer={tokenizers}"
              )

          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          encoder = manifest["encoder"]
          tokenizer = manifest["tokenizer"]

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder["size"] or digest(encoders[0]) != encoder["sha256"]:
              raise SystemExit("encoder provenance mismatch")
          if tokenizers[0].stat().st_size != tokenizer["size"] or digest(tokenizers[0]) != tokenizer["sha256"]:
              raise SystemExit("tokenizer provenance mismatch")

          assets = Path("android-app/src/androidTest/assets")
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)
          PY

      - name: Prepare verified real-model cold-start fixture
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="android-app/src/androidTest/assets"
          asset="$asset_dir/stories15M-q4_0.gguf"
          mkdir -p "$asset_dir"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true" \
            --output "$asset"
          echo "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  $asset" | sha256sum --check --strict
          test "$(stat --format=%s "$asset")" -eq 19077344

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android instrumentation toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Compile physical provisioning and cold-start instrumentation
        run: gradle :android-app:assembleDebug :android-app:assembleDebugAndroidTest --console=plain

      - name: Build exact physical acceptance APK bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/physical-first-working-liliya-test-bundle"
          mkdir -p "$bundle"

          app_apk='android-app/build/outputs/apk/debug/android-app-debug.apk'
          test_apk='android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk'
          test -f "$app_apk"
          test -f "$test_apk"

          cp "$app_apk" "$bundle/liliya-app-debug.apk"
          cp "$test_apk" "$bundle/liliya-app-debug-androidTest.apk"

          SOURCE_COMMIT="$(git rev-parse HEAD)" \
          SOURCE_TREE="$(git rev-parse HEAD^{tree})" \
          BUNDLE_DIR="$bundle" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BUNDLE_DIR"])
          files = {}
          for name in ("liliya-app-debug.apk", "liliya-app-debug-androidTest.apk"):
              path = root / name
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              files[name] = {
                  "sha256": h.hexdigest(),
                  "size": path.stat().st_size,
              }

          manifest = {
              "evidenceClass": "physical-first-working-liliya-test-bundle",
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "applicationId": "pro.liliya.app",
              "testApplicationId": "pro.liliya.app.test",
              "instrumentationRunner": "androidx.test.runner.AndroidJUnitRunner",
              "files": files,
          }
          (root / "physical-first-working-liliya-test-bundle.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat "$bundle/physical-first-working-liliya-test-bundle.json"

      - name: Publish exact physical acceptance APK bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-first-working-liliya-test-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/physical-first-working-liliya-test-bundle/**

  physical-first-working-liliya:
    name: Physical ARM64 First Working Liliya READY-to-first-chat acceptance
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate-physical-acceptance-contract
      - build-physical-acceptance-bundle
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 30

    steps:
      - name: Verify pre-provisioned ARM64 physical runner
        shell: bash
        env:
          DEVICE_BACKEND: ${{ inputs.device_backend || 'rish-bridge' }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "runner host must be ARM64" >&2; exit 1 ;;
          esac
          command -v python3
          command -v sha256sum
          command -v curl
          case "$DEVICE_BACKEND" in
            adb)
              command -v adb
              ;;
            rish-bridge)
              token_file='/data/data/com.termux/files/home/.liliya-physical-bridge-token'
              test -s "$token_file"
              token="$(cat "$token_file")"
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $token" \
                http://127.0.0.1:18765/v1/probe \
                > "$RUNNER_TEMP/physical-rish-bridge-probe.json"
              ;;
            *)
              echo "unsupported device backend: $DEVICE_BACKEND" >&2
              exit 1
              ;;
          esac
          echo "LILIYA_PHYSICAL_DEVICE_BACKEND=$DEVICE_BACKEND" >> "$GITHUB_ENV"

      - name: Download exact physical acceptance APK bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: physical-first-working-liliya-test-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/physical-first-working-liliya-test-bundle

      - name: Verify exact physical acceptance bundle
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/physical-first-working-liliya-test-bundle" \
          EXPECTED_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BUNDLE_DIR"])
          manifest_path = root / "physical-first-working-liliya-test-bundle.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("sourceCommit") != os.environ["EXPECTED_SOURCE_COMMIT"]:
              raise SystemExit(
                  f"source commit mismatch: manifest={manifest.get('sourceCommit')} "
                  f"expected={os.environ['EXPECTED_SOURCE_COMMIT']}"
              )
          source_tree = manifest.get("sourceTree")
          if not isinstance(source_tree, str) or len(source_tree) != 40:
              raise SystemExit("missing exact source tree")

          for name, expected in manifest["files"].items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"missing bundle file: {name}")
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              actual_sha = h.hexdigest()
              actual_size = path.stat().st_size
              if actual_sha != expected["sha256"] or actual_size != expected["size"]:
                  raise SystemExit(
                      f"bundle file mismatch for {name}: "
                      f"sha={actual_sha}/{expected['sha256']} "
                      f"size={actual_size}/{expected['size']}"
                  )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Verify one physical ARM64 Android device
        shell: bash
        run: |
          set -euo pipefail
          backend="$LILIYA_PHYSICAL_DEVICE_BACKEND"
          serial=''
          shell_identity=''

          if [ "$backend" = 'adb' ]; then
            adb start-server
            adb devices
            mapfile -t devices < <(adb devices | awk 'NR>1 && $2=="device" {print $1}')
            test "${#devices[@]}" -eq 1
            serial="${devices[0]}"
            case "$serial" in
              emulator-*) echo "emulator is not accepted for physical First Working Liliya gate" >&2; exit 1 ;;
            esac
            abi="$(adb -s "$serial" shell getprop ro.product.cpu.abi | tr -d '\r')"
            qemu="$(adb -s "$serial" shell getprop ro.kernel.qemu | tr -d '\r')"
            sdk="$(adb -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
            model="$(adb -s "$serial" shell getprop ro.product.model | tr -d '\r')"
            echo "ANDROID_DEVICE_SERIAL=$serial" >> "$GITHUB_ENV"
          else
            token_file='/data/data/com.termux/files/home/.liliya-physical-bridge-token'
            token="$(cat "$token_file")"
            probe="$RUNNER_TEMP/physical-rish-bridge-probe.json"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $token" \
              http://127.0.0.1:18765/v1/probe > "$probe"
            readarray -t facts < <(python3 - "$probe" <<'PY'
          import json
          import sys
          probe = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("primaryAbi", "qemu", "sdk", "model", "shellIdentity"):
              item = probe[key]
              if item["exit"] != 0:
                  raise SystemExit(f"bridge probe failed for {key}: {item}")
              print(item["output"])
          PY
            )
            abi="${facts[0]}"
            qemu="${facts[1]}"
            sdk="${facts[2]}"
            model="${facts[3]}"
            shell_identity="${facts[4]}"
            [[ "$shell_identity" == uid=2000\(shell\)* ]]
          fi

          test "$abi" = "arm64-v8a"
          test "$qemu" != "1"
          test "$sdk" -ge 29

          BUNDLE_DIR="$RUNNER_TEMP/physical-first-working-liliya-test-bundle" \
          python3 - "$RUNNER_TEMP/physical-first-working-liliya-device.json" \
            "$backend" "$serial" "$abi" "$qemu" "$sdk" "$model" "$shell_identity" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path, backend, serial, abi, qemu, sdk, model, shell_identity = sys.argv[1:]
          bundle = Path(os.environ["BUNDLE_DIR"])
          source = json.loads(
              (bundle / "physical-first-working-liliya-test-bundle.json").read_text(encoding="utf-8")
          )
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(
                  {
                      "evidenceClass": "physical-first-working-liliya-device",
                      "controlBackend": backend,
                      "serialPresent": bool(serial),
                      "shellIdentity": shell_identity or None,
                      "primaryAbi": abi,
                      "qemu": qemu,
                      "sdk": int(sdk),
                      "model": model,
                      "sourceCommit": source["sourceCommit"],
                      "sourceTree": source["sourceTree"],
                      "appApkSha256": source["files"]["liliya-app-debug.apk"]["sha256"],
                      "testApkSha256": source["files"]["liliya-app-debug-androidTest.apk"]["sha256"],
                  },
                  stream,
                  indent=2,
                  sort_keys=True,
              )
              stream.write("\n")
          PY

      - name: Install exact app and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/physical-first-working-liliya-test-bundle"

          if [ "$LILIYA_PHYSICAL_DEVICE_BACKEND" = 'adb' ]; then
            serial="$ANDROID_DEVICE_SERIAL"
            adb -s "$serial" uninstall pro.liliya.app.test >/dev/null 2>&1 || true
            adb -s "$serial" uninstall pro.liliya.app >/dev/null 2>&1 || true
            adb -s "$serial" install -r -t "$bundle/liliya-app-debug.apk"
            adb -s "$serial" install -r -t "$bundle/liliya-app-debug-androidTest.apk"
          else
            token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
            auth=(-H "Authorization: Bearer $token")
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              http://127.0.0.1:18765/v1/reset-packages \
              > "$RUNNER_TEMP/physical-rish-bridge-reset.json"

            app="$bundle/liliya-app-debug.apk"
            app_sha="$(sha256sum "$app" | awk '{print $1}')"
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              -H "X-Liliya-Sha256: $app_sha" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              --data-binary "@$app" \
              http://127.0.0.1:18765/v1/install/app \
              > "$RUNNER_TEMP/physical-rish-bridge-install-app.json"

            test_apk="$bundle/liliya-app-debug-androidTest.apk"
            test_sha="$(sha256sum "$test_apk" | awk '{print $1}')"
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              -H "X-Liliya-Sha256: $test_sha" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              --data-binary "@$test_apk" \
              http://127.0.0.1:18765/v1/install/test \
              > "$RUNNER_TEMP/physical-rish-bridge-install-test.json"

            cat "$RUNNER_TEMP/physical-rish-bridge-install-app.json"
            cat "$RUNNER_TEMP/physical-rish-bridge-install-test.json"
          fi

      - name: Run physical Product Auth provisioning-to-chat instrumentation
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          log="$RUNNER_TEMP/physical-product-auth-provisioning-to-chat.log"
          if [ "$LILIYA_PHYSICAL_DEVICE_BACKEND" = 'adb' ]; then
            adb -s "$ANDROID_DEVICE_SERIAL" shell am instrument -w -r \
              -e class pro.liliya.app.PhysicalProductAuthProvisioningToChatInstrumentedTest \
              pro.liliya.app.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee "$log"
          else
            token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $token" \
              http://127.0.0.1:18765/v1/instrument/provisioning \
              2>&1 | tee "$log"
          fi
          grep -Fq 'INSTRUMENTATION_CODE: -1' "$log"
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$log"; then
            echo 'physical Product Auth provisioning instrumentation failed' >&2
            exit 1
          fi

      - name: Run physical First Working Liliya cold-start instrumentation
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          log="$RUNNER_TEMP/physical-first-working-liliya-cold-start.log"
          if [ "$LILIYA_PHYSICAL_DEVICE_BACKEND" = 'adb' ]; then
            adb -s "$ANDROID_DEVICE_SERIAL" shell am instrument -w -r \
              -e class pro.liliya.app.DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest \
              pro.liliya.app.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee "$log"
          else
            token="$(cat /data/data/com.termux/files/home/.liliya-physical-bridge-token)"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $token" \
              http://127.0.0.1:18765/v1/instrument/cold-start \
              2>&1 | tee "$log"
          fi
          grep -Fq 'INSTRUMENTATION_CODE: -1' "$log"
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$log"; then
            echo 'physical First Working Liliya cold-start instrumentation failed' >&2
            exit 1
          fi

      - name: Publish physical First Working Liliya evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-first-working-liliya-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/physical-first-working-liliya-test-bundle/physical-first-working-liliya-test-bundle.json
            ${{ runner.temp }}/physical-first-working-liliya-device.json
            ${{ runner.temp }}/physical-product-auth-provisioning-to-chat.log
            ${{ runner.temp }}/physical-first-working-liliya-cold-start.log
            ${{ runner.temp }}/physical-rish-bridge-probe.json
            ${{ runner.temp }}/physical-rish-bridge-reset.json
            ${{ runner.temp }}/physical-rish-bridge-install-app.json
            ${{ runner.temp }}/physical-rish-bridge-install-test.json
