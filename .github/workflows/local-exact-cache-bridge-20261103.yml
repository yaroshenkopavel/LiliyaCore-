name: Local Environment Exact Cache Bridge 2026-11-03
on:
  push:
    branches:
      - technical/local-env-cache-bridge-2026-11-03
permissions:
  contents: read
jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: b22afe0025576b9a45cde9b0e62009d5f470665e
      TARGET_TREE: 8d9707cc04fb7dfdab565cf377e3954bd79e1332
      GRADLE_USER_HOME: ${{ github.workspace }}/.bridge-gradle-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify canonical source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install exact Android components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Warm project cache and verify offline acceptance
        run: |
          set -euo pipefail
          gradle :core:test :android-runtime:testDebugUnitTest :android-app:testDebugUnitTest :android-app:compileDebugAndroidTestKotlin --console=plain --no-daemon
          gradle :core:test --offline --console=plain --no-daemon
      - name: Export verified cache in parts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-export"
          if [ ! -d "$GRADLE_USER_HOME" ]; then echo 'NO_CACHE_TO_EXPORT'; exit 1; fi
          tar -czf "$RUNNER_TEMP/cache-export/project-gradle-cache.tar.gz" -C "$GITHUB_WORKSPACE" .bridge-gradle-home
          cd "$RUNNER_TEMP/cache-export"
          split -b 250M -d -a 2 project-gradle-cache.tar.gz cache.part.
          sha256sum project-gradle-cache.tar.gz cache.part.* > SHA256SUMS
          printf 'target_sha=%s\ntarget_tree=%s\n' "$TARGET_SHA" "$TARGET_TREE" > SOURCE.txt
          rm project-gradle-cache.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liliya-exact-project-cache-20261103
          path: ${{ runner.temp }}/cache-export/
          retention-days: 3
