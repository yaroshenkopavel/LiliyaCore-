name: Structured Grammar Native Builder 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/structured-grammar-native-builder-2026-09-11.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development slice
        uses: actions/checkout@v4
        with:
          ref: development-structured-generation-grammar-v0.1
          fetch-depth: 0

      - name: Patch native grammar sampler
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Run constrained generation gate
        run: gradle :android-llama-cpp-engine:testDebugUnitTest :android-llama-cpp-engine:assembleDebug --console=plain

      - name: Publish tested development slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git add android-llama-cpp-engine
          git diff --cached --check
          git commit -m "Constrain cognitive llama generation with GBNF"
          git push origin HEAD:refs/heads/development-structured-generation-grammar-v0.1
