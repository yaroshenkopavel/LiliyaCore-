name: Read-only phone semantic package presence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-package-preflight:
    runs-on: [self-hosted, ARM64, android-device]
    timeout-minutes: 5
    steps:
      - name: Check installed semantic packages via Shizuku rish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          rish = os.environ.get('LILIYA_RISH_PATH', '/data/data/com.termux/files/usr/bin/rish')
          if not os.path.isfile(rish):
              print('RISH_AVAILABLE=NO')
              raise SystemExit(2)
          result = subprocess.run([rish, '-c', 'pm list packages'], text=True, capture_output=True, timeout=45)
          if result.returncode != 0 or not result.stdout.strip():
              print('PACKAGE_LIST=UNAVAILABLE')
              raise SystemExit(3)
          packages = {line.removeprefix('package:').strip() for line in result.stdout.splitlines() if line.startswith('package:')}
          if len(packages) < 10:
              print('PACKAGE_LIST=INCOMPLETE')
              raise SystemExit(4)
          for name in ('pro.liliya.android.semanticprovider', 'pro.liliya.android.semanticprovider.test'):
              print(name + '=' + ('INSTALLED' if name in packages else 'ABSENT'))
          print('PACKAGE_LIST=OK')
          PY
