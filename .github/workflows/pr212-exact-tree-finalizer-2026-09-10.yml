name: PR212 Exact Tree Finalizer 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR 212 head
        uses: actions/checkout@v4
        with:
          ref: development-first-working-liliya-cold-start-fixture-v0.1
          fetch-depth: 0

      - name: Build exact tested fixture tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development-first-working-liliya-cold-start-fixture-v0.1
          test "$(git rev-parse origin/main)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse origin/development-first-working-liliya-cold-start-fixture-v0.1)" = "5e31b7ee882a568c5bdcb5f414eddaacb65b4be3"
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          s = p.read_text()
          replacements = [
              ('import java.security.KeyPairGenerator\n', 'import java.security.KeyFactory\nimport java.security.KeyPairGenerator\n'),
              ('import java.security.spec.ECGenParameterSpec\n', 'import java.security.spec.ECGenParameterSpec\nimport java.security.spec.X509EncodedKeySpec\n'),
              ('        val modelSigner = KeyPairGenerator.getInstance("Ed25519", modelSignerProvider).generateKeyPair()\n', '        val modelSigner = KeyPairGenerator.getInstance("Ed25519", modelSignerProvider).generateKeyPair()\n        val verifierCompatibleModelSignerPublicKey = KeyFactory.getInstance("Ed25519").generatePublic(\n            X509EncodedKeySpec(modelSigner.public.encoded)\n        )\n'),
              ('            val signerResolver = ProtectedModelSignerResolver { requested, algorithm ->\n                modelSigner.public.takeIf {\n', '            val signerResolver = ProtectedModelSignerResolver { requested, algorithm ->\n                verifierCompatibleModelSignerPublicKey.takeIf {\n'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'exact replacement precondition failed: {old!r}, count={s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "TREE=$TREE"
          test "$TREE" = "2f2a83c95664714b1f178642af2179a97cb5785d"
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "2f2a83c95664714b1f178642af2179a97cb5785d"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Publish exact-tree candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
