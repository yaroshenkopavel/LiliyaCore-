name: PR212 Exact Tree Finalizer 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR 212 head
        uses: actions/checkout@v4
        with:
          ref: development-first-working-liliya-cold-start-fixture-v0.1
          fetch-depth: 0

      - name: Build exact tested provider-compatible verification tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development-first-working-liliya-cold-start-fixture-v0.1
          test "$(git rev-parse origin/main)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse origin/development-first-working-liliya-cold-start-fixture-v0.1)" = "13713be49e620ab39a56d9f0a88b9f8fafc88c6e"
          python - <<'PY'
          from pathlib import Path
          import base64
          production_files = [Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/ProtectedModelManifestVerification.kt'), Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/LargeProtectedModelSegmentedCrypto.kt')]
          old_import = 'import java.security.Signature\n'
          old_verifier = '            val verifier = Signature.getInstance(signatureName(manifest.signatureAlgorithm))\n            verifier.initVerify(signerKey)\n'
          new_verifier = '            val verifier = ProtectedModelSignatureVerification.verifier(\n                signatureName(manifest.signatureAlgorithm),\n                signerKey\n            )\n'
          for path in production_files:
              text = path.read_text()
              if text.count(old_import) != 1 or text.count(old_verifier) != 1:
                  raise SystemExit(f'{path}: production replacement precondition failed')
              path.write_text(text.replace(old_import, '', 1).replace(old_verifier, new_verifier, 1))
          helper_b64 = ''
          test_b64 = ''
          Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/ProtectedModelSignatureVerification.kt').write_bytes(base64.b64decode(helper_b64))
          Path('core/src/test/kotlin/pro/liliya/core/protectedmodel/ProtectedModelSignatureProviderSelectionContractTest.kt').write_bytes(base64.b64decode(test_b64))
          PY
          git diff --check
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "TREE=$TREE"
          test "$TREE" = "5b2b38842d70aa3c6b4e3aec5070fc95a989af79"
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "5b2b38842d70aa3c6b4e3aec5070fc95a989af79"

      - name: Publish exact-tree candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
