name: PR212 Exact Tree Finalizer 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: 9a8ca6e8327ca38d1f5d5e17bbc0fab19a3893da
          fetch-depth: 0

      - name: Apply bounded fixture API migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "aeb5a86d15909f74465e67616121fc4bad802046"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          s = p.read_text()
          old = '''                val verified = pro.liliya.core.protectedmodel.LargeProtectedModelPackageVerifier(
                    signerResolver = signerResolver,
                    budgets = packageBudgets,
                    signatureProvider = modelSignerProvider
                ).verify(openedPackage.envelope)
'''
          new = '''                val verified = pro.liliya.core.protectedmodel.LargeProtectedModelPackageVerifier(
                    signerResolver = signerResolver,
                    budgets = packageBudgets
                ).verify(openedPackage.envelope)
'''
          if s.count(old) != 1:
              raise SystemExit('stale preflight verifier shape precondition failed')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile exact cold-start instrumentation
        shell: bash
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: "1"
        run: gradle :android-app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      - name: Publish one-commit candidate from canonical main
        shell: bash
        run: |
          set -euo pipefail
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "CANDIDATE_TREE=$TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "aeb5a86d15909f74465e67616121fc4bad802046"
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
