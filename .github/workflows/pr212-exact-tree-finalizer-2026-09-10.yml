name: PR212 Exact Tree Finalizer 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout known clean fixture commit
        uses: actions/checkout@v4
        with:
          ref: 13713be49e620ab39a56d9f0a88b9f8fafc88c6e
          fetch-depth: 0

      - name: Build exact tested product signer trust tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "1892a1fdbceeae79e3bd558eb71eca1565778495"
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          text = p.read_text()
          anchor = 'import pro.liliya.android.runtime.AndroidProductRuntimeProtectedModelBudgetInput\n'
          imports = (
              anchor
              + 'import pro.liliya.android.runtime.AndroidProductRuntimeProtectedModelSignerTrust\n'
              + 'import pro.liliya.android.runtime.AndroidProductRuntimeProtectedModelSignerTrustKey\n'
              + 'import pro.liliya.android.runtime.AndroidProductRuntimeProtectedModelSignerTrustResult\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('signer trust import anchor precondition failed')
          text = text.replace(anchor, imports, 1)
          old = '''            val fixtureFoundation = foundation()
            val signerResolver = ProtectedModelSignerResolver { requested, algorithm ->
                modelSigner.public.takeIf {
                    requested == modelSignerId &&
                        algorithm == ProtectedModelSignatureAlgorithm.ED25519
                }
            }
'''
          new = '''            val fixtureFoundation = foundation()
            val signerTrust = AndroidProductRuntimeProtectedModelSignerTrust.create(
                listOf(
                    AndroidProductRuntimeProtectedModelSignerTrustKey(
                        signerId = modelSignerId.value,
                        material = modelSigner.public.encoded
                    )
                )
            )
            val signerResolver = (
                signerTrust as? AndroidProductRuntimeProtectedModelSignerTrustResult.Ready
            )?.resolver ?: error("Cold-start protected-model signer trust rejected")
'''
          if text.count(old) != 1:
              raise SystemExit('direct signer resolver precondition failed')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "TREE=$TREE"
          test "$TREE" = "82c8a09d39bb151d87b6da4e6fc6b28efb0f1719"
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "82c8a09d39bb151d87b6da4e6fc6b28efb0f1719"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Publish exact-tree candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
