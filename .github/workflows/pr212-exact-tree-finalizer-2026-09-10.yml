name: PR212 Exact Tree Finalizer 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR 212 head
        uses: actions/checkout@v4
        with:
          ref: development-first-working-liliya-cold-start-fixture-v0.1
          fetch-depth: 0

      - name: Build exact tested fixture tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development-first-working-liliya-cold-start-fixture-v0.1
          test "$(git rev-parse origin/main)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse origin/development-first-working-liliya-cold-start-fixture-v0.1)" = "34c21ad79e5b2469e0084b2df72e8d7edcfa717a"
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          lines = p.read_text().splitlines()
          lines.remove('import java.security.KeyFactory')
          lines.remove('import java.security.spec.X509EncodedKeySpec')
          kp = lines.index('import java.security.KeyPairGenerator')
          lines.insert(kp + 1, 'import java.security.KeyStore')
          start = lines.index('        val modelSignerProvider = org.bouncycastle.jce.provider.BouncyCastleProvider()')
          end = lines.index('        )', start) + 1
          replacement = [
              '        val modelSignerAlias = "first-working-liliya-model-signer-ed25519"',
              '        val androidKeyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }',
              '        androidKeyStore.deleteEntry(modelSignerAlias)',
              '        val modelSigner = KeyPairGenerator.getInstance("EC", "AndroidKeyStore").run {',
              '            initialize(',
              '                android.security.keystore.KeyGenParameterSpec.Builder(',
              '                    modelSignerAlias,',
              '                    android.security.keystore.KeyProperties.PURPOSE_SIGN or',
              '                        android.security.keystore.KeyProperties.PURPOSE_VERIFY',
              '                )',
              '                    .setAlgorithmParameterSpec(ECGenParameterSpec("ed25519"))',
              '                    .setDigests(android.security.keystore.KeyProperties.DIGEST_NONE)',
              '                    .build()',
              '            )',
              '            generateKeyPair()',
              '        }',
          ]
          lines[start:end] = replacement
          sig = '                            val signer = Signature.getInstance("Ed25519", modelSignerProvider)'
          lines[lines.index(sig)] = '                            val signer = Signature.getInstance("Ed25519")'
          resolver = '                verifierCompatibleModelSignerPublicKey.takeIf {'
          lines[lines.index(resolver)] = '                modelSigner.public.takeIf {'
          cleanup = '            application.runtimeOwner.close()'
          ci = lines.index(cleanup)
          lines.insert(ci, '            runCatching { androidKeyStore.deleteEntry(modelSignerAlias) }')
          p.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "TREE=$TREE"
          test "$TREE" = "1892a1fdbceeae79e3bd558eb71eca1565778495"
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "1892a1fdbceeae79e3bd558eb71eca1565778495"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Publish exact-tree candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
