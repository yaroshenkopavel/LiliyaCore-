name: PR212 Exact Tree Finalizer 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/pr212-exact-tree-finalizer-2026-09-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR 212 head
        uses: actions/checkout@v4
        with:
          ref: development-first-working-liliya-cold-start-fixture-v0.1
          fetch-depth: 0

      - name: Build exact tested provider-compatible verification tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development-first-working-liliya-cold-start-fixture-v0.1
          test "$(git rev-parse origin/main)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse origin/development-first-working-liliya-cold-start-fixture-v0.1)" = "13713be49e620ab39a56d9f0a88b9f8fafc88c6e"
          python - <<'PY'
          from pathlib import Path

          production_files = [
              Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/ProtectedModelManifestVerification.kt'),
              Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/LargeProtectedModelSegmentedCrypto.kt'),
          ]
          old_import = 'import java.security.Signature\n'
          old_verifier = '''            val verifier = Signature.getInstance(signatureName(manifest.signatureAlgorithm))
            verifier.initVerify(signerKey)
'''
          new_verifier = '''            val verifier = ProtectedModelSignatureVerification.verifier(
                signatureName(manifest.signatureAlgorithm),
                signerKey
            )
'''
          for path in production_files:
              text = path.read_text()
              if text.count(old_import) != 1:
                  raise SystemExit(f'{path}: Signature import precondition failed: {text.count(old_import)}')
              if text.count(old_verifier) != 1:
                  raise SystemExit(f'{path}: verifier precondition failed: {text.count(old_verifier)}')
              text = text.replace(old_import, '', 1)
              text = text.replace(old_verifier, new_verifier, 1)
              path.write_text(text)

          Path('core/src/main/kotlin/pro/liliya/core/protectedmodel/ProtectedModelSignatureVerification.kt').write_text('''package pro.liliya.core.protectedmodel

import java.security.GeneralSecurityException
import java.security.NoSuchAlgorithmException
import java.security.PublicKey
import java.security.Security
import java.security.Signature

/**
 * Resolves a signature implementation that can actually consume the supplied signer key.
 *
 * Some JCA runtimes expose more than one implementation for the same signature algorithm and
 * their first/default implementation may reject a public key owned by another provider. Package
 * authenticity must not depend on that provider ordering, so verification walks the advertised
 * implementations in runtime order and selects the first one that accepts the trusted key.
 */
internal object ProtectedModelSignatureVerification {
    fun verifier(
        signatureName: String,
        signerKey: PublicKey
    ): Signature {
        val providers = Security.getProviders("Signature.$signatureName")?.asList().orEmpty()
        if (providers.isEmpty()) {
            return Signature.getInstance(signatureName).apply {
                initVerify(signerKey)
            }
        }

        var lastFailure: GeneralSecurityException? = null
        for (provider in providers) {
            try {
                return Signature.getInstance(signatureName, provider).apply {
                    initVerify(signerKey)
                }
            } catch (failure: GeneralSecurityException) {
                lastFailure = failure
            }
        }

        throw lastFailure ?: NoSuchAlgorithmException(
            "No $signatureName signature provider accepted the signer key"
        )
    }
}
''')

          Path('core/src/test/kotlin/pro/liliya/core/protectedmodel/ProtectedModelSignatureProviderSelectionContractTest.kt').write_text('''package pro.liliya.core.protectedmodel

import java.security.InvalidKeyException
import java.security.KeyPairGenerator
import java.security.PrivateKey
import java.security.Provider
import java.security.PublicKey
import java.security.Security
import java.security.Signature
import java.security.SignatureSpi
import kotlin.test.Test
import kotlin.test.assertTrue

class ProtectedModelSignatureProviderSelectionContractTest {
    @Test
    fun verification_skips_an_earlier_provider_that_rejects_the_signer_key() {
        val keys = KeyPairGenerator.getInstance("Ed25519").generateKeyPair()
        val payload = "provider-order-independent-verification".encodeToByteArray()
        val realProvider = Signature.getInstance("Ed25519").provider
        val signature = Signature.getInstance("Ed25519", realProvider).run {
            initSign(keys.private)
            update(payload)
            sign()
        }
        val rejectingProvider = RejectingEd25519Provider()

        Security.insertProviderAt(rejectingProvider, 1)
        try {
            val verifier = ProtectedModelSignatureVerification.verifier("Ed25519", keys.public)
            verifier.update(payload)
            assertTrue(verifier.verify(signature))
            assertTrue(verifier.provider.name != rejectingProvider.name)
        } finally {
            Security.removeProvider(rejectingProvider.name)
        }
    }
}

class RejectingEd25519Provider : Provider(
    "LiliyaRejectingEd25519",
    "1.0",
    "Test provider that advertises Ed25519 but rejects verification keys"
) {
    init {
        put("Signature.Ed25519", RejectingEd25519SignatureSpi::class.java.name)
    }
}

class RejectingEd25519SignatureSpi : SignatureSpi() {
    override fun engineInitVerify(publicKey: PublicKey) {
        throw InvalidKeyException("intentional test provider rejection")
    }

    override fun engineInitSign(privateKey: PrivateKey) {
        throw InvalidKeyException("signing is unsupported")
    }

    override fun engineUpdate(b: Byte) = Unit

    override fun engineUpdate(b: ByteArray, off: Int, len: Int) = Unit

    override fun engineSign(): ByteArray = error("signing is unsupported")

    override fun engineVerify(sigBytes: ByteArray): Boolean = false

    @Deprecated("Deprecated in Java")
    override fun engineSetParameter(param: String, value: Any) = Unit

    @Deprecated("Deprecated in Java")
    override fun engineGetParameter(param: String): Any? = null
}
''')
          PY
          git diff --check
          git reset --mixed origin/main
          git add -A
          TREE="$(git write-tree)"
          echo "TREE=$TREE"
          test "$TREE" = "5b2b38842d70aa3c6b4e3aec5070fc95a989af79"
          git config user.name "yaroshenkopavel"
          git config user.email "78513566+yaroshenkopavel@users.noreply.github.com"
          git commit -m "First Working Liliya cold-start fixture v0.1"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git rev-parse HEAD^)" = "5f949ec37cb17fad408509e2a1453c270aac1f63"
          test "$(git rev-parse HEAD^{tree})" = "5b2b38842d70aa3c6b4e3aec5070fc95a989af79"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Publish exact-tree candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/maintenance/pr212-exact-tree-candidate-2026-09-10
