name: Local Toolchain Export 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout active development branch
        uses: actions/checkout@v4
        with:
          ref: development-first-working-liliya-cold-start-fixture-v0.1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Warm project-only Gradle home
        shell: bash
        run: |
          set -euo pipefail
          LILIYA_GRADLE_HOME="$RUNNER_TEMP/liliya-gradle-home"
          rm -rf "$LILIYA_GRADLE_HOME"
          mkdir -p "$LILIYA_GRADLE_HOME"
          GRADLE_USER_HOME="$LILIYA_GRADLE_HOME" gradle \
            :android-app:testDebugUnitTest \
            :android-runtime:testDebugUnitTest \
            :core:test \
            :android-app:compileDebugAndroidTestKotlin \
            --console=plain
          GRADLE_USER_HOME="$LILIYA_GRADLE_HOME" gradle \
            :core:test \
            --offline --console=plain

      - name: Pack local toolchain
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          mkdir -p "$RUNNER_TEMP/local-toolchain"
          tar -C "$(dirname "$JAVA_HOME")" -czf "$RUNNER_TEMP/local-toolchain/temurin-jdk17.tar.gz" "$(basename "$JAVA_HOME")"
          tar -C "$(dirname "$GRADLE_HOME")" -czf "$RUNNER_TEMP/local-toolchain/gradle-9.6.1-runtime.tar.gz" "$(basename "$GRADLE_HOME")"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/local-toolchain/liliya-gradle-home.tar.gz" liliya-gradle-home
          tar -C "$ANDROID_HOME" -czf "$RUNNER_TEMP/local-toolchain/android-sdk-pinned.tar.gz" \
            platforms/android-35 \
            build-tools/35.0.0 \
            platform-tools \
            ndk/29.0.13113456 \
            cmake/3.31.6 \
            licenses
          printf '%s\n' "JAVA_HOME=$(basename "$JAVA_HOME")" "GRADLE_HOME=$(basename "$GRADLE_HOME")" > "$RUNNER_TEMP/local-toolchain/MANIFEST.txt"
          du -sh "$RUNNER_TEMP/local-toolchain"/*

      - name: Upload local toolchain
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-toolchain-${{ github.sha }}
          path: ${{ runner.temp }}/local-toolchain/*
          retention-days: 1
          if-no-files-found: error
