name: Local Native Toolchain Export 2026-09-10

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10

permissions:
  contents: read

jobs:
  export-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Pack and split native toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-native"
          tar -C "$ANDROID_HOME" -czf "$RUNNER_TEMP/local-native/ndk-29.0.13113456.tar.gz" ndk/29.0.13113456
          tar -C "$ANDROID_HOME" -czf "$RUNNER_TEMP/local-native/cmake-3.31.6.tar.gz" cmake/3.31.6
          split -b 450M -d -a 2 "$RUNNER_TEMP/local-native/ndk-29.0.13113456.tar.gz" "$RUNNER_TEMP/local-native/ndk.part."
          rm "$RUNNER_TEMP/local-native/ndk-29.0.13113456.tar.gz"
          du -sh "$RUNNER_TEMP/local-native"/*

      - name: Upload NDK part 00
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-ndk-part-00-${{ github.sha }}
          path: ${{ runner.temp }}/local-native/ndk.part.00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload NDK part 01
        if: ${{ hashFiles(format('{0}/local-native/ndk.part.01', runner.temp)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-ndk-part-01-${{ github.sha }}
          path: ${{ runner.temp }}/local-native/ndk.part.01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload NDK part 02
        if: ${{ hashFiles(format('{0}/local-native/ndk.part.02', runner.temp)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-ndk-part-02-${{ github.sha }}
          path: ${{ runner.temp }}/local-native/ndk.part.02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: liliyacore-local-cmake-${{ github.sha }}
          path: ${{ runner.temp }}/local-native/cmake-3.31.6.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
