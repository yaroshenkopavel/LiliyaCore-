name: Physical Live HostBootstrap Qwen Output Budget v6

on:
  push:
    branches:
      - acceptance/physical-live-hostbootstrap-qwen-output-budget-v6-30b9ad
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_SHA: 30b9ad2853bf31f17a84b524a6f643ee1d23d72f
  SEMANTIC_PROVENANCE_RUN_ID: '33981322350'

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout v6 overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen RC ancestry and test-only overlay boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_SHA" HEAD
          changed="$(git diff --name-only "$FROZEN_SHA"..HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAuthorityAdmissionInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveStartupAdmissionGateInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAdmittedQwenExecutionInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/TypedDiagnosticCognitiveMaterializationPort\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/AcceptanceCognitiveProtectorCleanup\.kt|\.github/scripts/prepare-hostbootstrap-qwen-v5\.py|\.github/scripts/prepare-hostbootstrap-qwen-v6\.py|\.github/scripts/stage-semantic-provenance-v5\.py|\.github/workflows/physical-live-authority-overlay-build\.yml|\.github/workflows/physical-live-startup-gate-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-source-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-https-overlay-build\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build-v2\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build-v3\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-diagnostic-v4\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-diagnostic-v5\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-output-budget-v6\.yml)$' || true)"
          test -z "$unexpected"
          echo "FROZEN_RC_PRODUCTION_SOURCE_UNCHANGED=YES"
          echo "OVERLAY_SCOPE=TEST_ONLY_OUTPUT_BUDGET_V6"

      - name: Prepare exact v6 output-budget patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-hostbootstrap-qwen-v6.py
          t='android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'
          grep -Fq 'const val MAX_OUTPUT_CHARS = 2_048' "$t"
          grep -Fq 'maxGeneratedTokens = 768' "$t"
          grep -Fq 'first-working-liliya-cognitive-protector-v6' "$t"
          grep -Fq 'TypedDiagnosticCognitiveMaterializationPort' "$t"
          sha256sum "$t" | tee /tmp/PATCHED_TEST_SHA256
          sha256sum android-app/src/androidTest/kotlin/pro/liliya/app/AcceptanceCognitiveProtectorCleanup.kt | tee /tmp/CLEANUP_HELPER_SHA256
          echo "HOSTBOOTSTRAP_QWEN_V6_PATCH=PASS"

      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@v4
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_PROVENANCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/stage-semantic-provenance-v5.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned native Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build HostBootstrap Qwen v6 instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:assembleDebugAndroidTest --console=plain --no-daemon --max-workers=2

      - name: Verify semantic assets are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-app/build/outputs/apk/androidTest -type f -name '*.apk' | head -1)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'assets/multilingual-e5-small-liliya-v0.1.onnx'
          unzip -l "$apk" | grep -F 'assets/multilingual-e5-small-tokenizer-v0.1.onnx'
          echo "SEMANTIC_ASSETS_PACKAGED=PASS"

      - name: Record APK and v6 identities
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-app/build/outputs/apk/androidTest -type f -name '*.apk' | head -1)"
          test -n "$apk"
          out="$RUNNER_TEMP/physical-live-hostbootstrap-qwen-output-budget-v6"
          mkdir -p "$out"
          cp "$apk" "$out/physical-live-hostbootstrap-qwen-output-budget-v6-androidTest.apk"
          sha256sum "$out/physical-live-hostbootstrap-qwen-output-budget-v6-androidTest.apk" | tee "$out/SHA256SUMS"
          cp /tmp/PATCHED_TEST_SHA256 "$out/PATCHED_TEST_SHA256"
          cp /tmp/CLEANUP_HELPER_SHA256 "$out/CLEANUP_HELPER_SHA256"
          printf '%s\n' "$FROZEN_SHA" > "$out/FROZEN_SHA"
          git rev-parse HEAD > "$out/OVERLAY_SHA"
          git rev-parse 'HEAD^{tree}' > "$out/OVERLAY_TREE"
          printf '%s\n' "$SEMANTIC_PROVENANCE_RUN_ID" > "$out/SEMANTIC_PROVENANCE_RUN_ID"
          printf '%s\n' 'V6 test-only validation of 2048-char structured-response capacity after V5 hit the exact 768-char ceiling; 768 generated-token ceiling; exact acceptance protector cleanup; frozen production source unchanged' > "$out/DIAGNOSTIC_SCOPE"

      - name: Upload v6 instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: physical-live-hostbootstrap-qwen-output-budget-v6-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/physical-live-hostbootstrap-qwen-output-budget-v6/**
