name: Android Chat Terminal Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-chat-terminal-regression.yml'
      - '.github/scripts/run-chat-terminal-regression.sh'
      - 'android-app/src/main/**'
      - 'android-app/src/androidTest/kotlin/pro/liliya/app/LiliyaActivityConsumedTerminalChatInstrumentedTest.kt'

permissions:
  contents: read

jobs:
  chat-terminal-regression:
    name: Chat terminal consume-race regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.1'

      - name: Configure hosted CI Gradle/Kotlin memory
        shell: bash
        run: bash .github/ci/configure-gradle-memory.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build exact debug app and test APK
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: '1'
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:assembleDebug :android-app:assembleDebugAndroidTest --console=plain
          test -f android-app/build/outputs/apk/debug/android-app-debug.apk
          test -f android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk

      - name: Run exact chat terminal regression in Android VM
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          LILIYA_LLAMA_ALLOW_X86_64_API35_TRANSLATION: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-chat-terminal-regression.sh

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-terminal-regression-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/chat-terminal-regression.txt
            android-app/build/outputs/apk/debug/android-app-debug.apk
            android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
