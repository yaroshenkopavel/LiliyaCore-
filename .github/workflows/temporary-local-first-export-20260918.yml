name: Temporary Local-First Environment Export 2026-09-18

on:
  push:
    branches:
      - infra/local-first-restore-20260918

permissions:
  contents: read

env:
  CANONICAL_SHA: 25d9b6a8e118154bedafa5772b6fc0bd89469f2f
  CANONICAL_TREE: 995c92d89169eeac481f0fdab0ede11418bcf5d0

jobs:
  export-local-environment:
    name: Export exact source and pinned offline toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure project-only Gradle home
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/liliya-gradle-home" >> "$GITHUB_ENV"

      - name: Re-anchor to exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_SHA"
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANONICAL_TREE"
          printf 'HEAD=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git status --short --branch

      - name: Export exact source mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export/parts"
          tar --exclude='./.gradle' --exclude='*/build' --exclude='*/.cxx' -I 'zstd -6 -T0' -cf "$RUNNER_TEMP/export/liliyacore-source.tar.zst" .
          test -s "$RUNNER_TEMP/export/liliyacore-source.tar.zst"
          tar -I zstd -tf "$RUNNER_TEMP/export/liliyacore-source.tar.zst" > "$RUNNER_TEMP/export/source-list.txt"
          grep -q '^./.git/' "$RUNNER_TEMP/export/source-list.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install exact Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-35"             "build-tools;35.0.0"             "build-tools;36.0.0"             "platform-tools"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/29.0.13113456"
          test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Warm project cache and prove online gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle :core:test :android-runtime:testDebugUnitTest :android-app:testDebugUnitTest :android-app:compileDebugAndroidTestKotlin :android-app:assembleDebug --console=plain --no-daemon

      - name: Prove same gate offline on runner
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:test :android-runtime:testDebugUnitTest :android-app:testDebugUnitTest :android-app:compileDebugAndroidTestKotlin :android-app:assembleDebug --offline --console=plain --no-daemon

      - name: Package portable environment
        shell: bash
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/export"
          parts="$export_root/parts"
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_root="$(dirname "$(dirname "$gradle_bin")")"

          tar -C "$JAVA_HOME" -I 'zstd -6 -T0' -cf "$export_root/jdk17.tar.zst" .
          tar -C "$gradle_root" -I 'zstd -6 -T0' -cf "$export_root/gradle-9.6.1.tar.zst" .
          tar -C "$GRADLE_USER_HOME" -I 'zstd -6 -T0' -cf "$export_root/gradle-home.tar.zst" .
          tar -C "$ANDROID_HOME" -I 'zstd -6 -T0' -cf "$export_root/android-sdk-core.tar.zst"             platforms/android-35 build-tools/35.0.0 build-tools/36.0.0 platform-tools licenses
          tar -C "$ANDROID_HOME/ndk/29.0.13113456" -I 'zstd -6 -T0' -cf "$export_root/ndk-29.0.13113456.tar.zst" .
          tar -C "$ANDROID_HOME/cmake/3.31.6" -I 'zstd -6 -T0' -cf "$export_root/cmake-3.31.6.tar.zst" .

          split -b 200M -d -a 2 "$export_root/gradle-home.tar.zst" "$parts/gradle-home.part."
          split -b 200M -d -a 2 "$export_root/ndk-29.0.13113456.tar.zst" "$parts/ndk.part."

          {
            echo "canonical_sha=$(git rev-parse HEAD)"
            echo "canonical_tree=$(git rev-parse HEAD^{tree})"
            echo "java_home=$JAVA_HOME"
            echo "java_version=$(java -version 2>&1 | head -1)"
            echo "gradle_root=$gradle_root"
            echo "gradle_version=$(gradle --version | awk '/^Gradle /{print $2; exit}')"
            echo "android_api=35"
            echo "build_tools=35.0.0,36.0.0"
            echo "ndk=29.0.13113456"
            echo "cmake=3.31.6"
          } > "$export_root/environment-manifest.txt"

          sha256sum             "$export_root/liliyacore-source.tar.zst"             "$export_root/jdk17.tar.zst"             "$export_root/gradle-9.6.1.tar.zst"             "$export_root/gradle-home.tar.zst"             "$export_root/android-sdk-core.tar.zst"             "$export_root/ndk-29.0.13113456.tar.zst"             "$export_root/cmake-3.31.6.tar.zst"             > "$export_root/SHA256SUMS"
          sha256sum "$parts"/* > "$export_root/PARTS_SHA256SUMS"

          ls -lh "$export_root" "$parts"
          cat "$export_root/environment-manifest.txt"

      - name: Upload source mirror
        uses: actions/upload-artifact@v4
        with:
          name: local-env-source
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/liliyacore-source.tar.zst

      - name: Upload JDK
        uses: actions/upload-artifact@v4
        with:
          name: local-env-jdk17
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/jdk17.tar.zst

      - name: Upload Gradle runtime
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/gradle-9.6.1.tar.zst

      - name: Upload Android SDK core
        uses: actions/upload-artifact@v4
        with:
          name: local-env-android-sdk-core
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/android-sdk-core.tar.zst

      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: local-env-cmake
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/cmake-3.31.6.tar.zst

      - name: Upload manifest and checksums
        uses: actions/upload-artifact@v4
        with:
          name: local-env-manifest
          retention-days: 1
          path: |
            ${{ runner.temp }}/export/environment-manifest.txt
            ${{ runner.temp }}/export/SHA256SUMS
            ${{ runner.temp }}/export/PARTS_SHA256SUMS

      - name: Upload Gradle cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-part-00
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/gradle-home.part.00

      - name: Upload Gradle cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-gradle-home-part-01
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/gradle-home.part.01

      - name: Upload NDK part 00
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-part-00
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/ndk.part.00

      - name: Upload NDK part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-part-01
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/ndk.part.01

      - name: Upload NDK part 02
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-part-02
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/ndk.part.02

      - name: Upload NDK part 03
        uses: actions/upload-artifact@v4
        with:
          name: local-env-ndk-part-03
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/export/parts/ndk.part.03
