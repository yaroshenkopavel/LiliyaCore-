name: Physical Live HostBootstrap Qwen Chat Overlay Build v3

on:
  push:
    branches:
      - acceptance/physical-live-hostbootstrap-qwen-30b9ad
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_SHA: 30b9ad2853bf31f17a84b524a6f643ee1d23d72f
  SEMANTIC_PROVENANCE_RUN_ID: '33981322350'

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout acceptance overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen RC ancestry and test-only overlay boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_SHA" HEAD
          changed="$(git diff --name-only "$FROZEN_SHA"..HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(
            printf '%s\n' "$changed" |
            grep -v -E \
              '^(android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAuthorityAdmissionInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveStartupAdmissionGateInstrumentedTest\.kt|android-app/src/androidTest/kotlin/pro/liliya/app/PhysicalLiveAdmittedQwenExecutionInstrumentedTest\.kt|\.github/workflows/physical-live-authority-overlay-build\.yml|\.github/workflows/physical-live-startup-gate-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-source-overlay-build\.yml|\.github/workflows/physical-live-admitted-qwen-local-https-overlay-build\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build-v2\.yml|\.github/workflows/physical-live-hostbootstrap-qwen-overlay-build-v3\.yml)$' \
              || true
          )"
          test -z "$unexpected"
          echo "FROZEN_RC_PRODUCTION_SOURCE_UNCHANGED=YES"
          echo "OVERLAY_SCOPE=TEST_ONLY_HOSTBOOTSTRAP_QWEN_CHAT_V3"

      - name: Reuse verified HostBootstrap-Qwen patch
        shell: bash
        run: |
          set -euo pipefail
          src='.github/workflows/physical-live-hostbootstrap-qwen-overlay-build.yml'
          script="$RUNNER_TEMP/reuse-hostbootstrap-patch.sh"
          python3 - "$src" "$script" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Patch canonical cold-start for isolated live Qwen physical acceptance')
          end = next(i for i in range(start + 1, len(src)) if src[i].strip() == '- name: Set up Java 17')
          block = src[start + 1:end]
          run_index = next(i for i, line in enumerate(block) if line.strip() == 'run: |')
          body = block[run_index + 1:]
          out = []
          for line in body:
              if line.startswith('          '):
                  out.append(line[10:])
              else:
                  out.append(line)
          Path(sys.argv[2]).write_text('\n'.join(out) + '\n')
          PY
          bash "$script"
          echo "REUSED_VERIFIED_PATCH=PASS"

      - name: Apply compile-only fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt')
          s = p.read_text()

          def once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one compile-fix replacement, got {n}: {old!r}')
              s = s.replace(old, new, 1)

          once(
              '            expiresAt = entitlement.expiresAt,\n',
              '            expiresAt = requireNotNull(entitlement.expiresAt) { "live entitlement expiry required by startup authority grant" },\n'
          )
          once(
              '        const val STORIES_15M_ASSET = QWEN_FILE_NAME\n',
              '        const val STORIES_15M_ASSET = "Qwen3-1.7B-Q4_K_M.gguf"\n'
          )
          once(
              '        const val STORIES_15M_BYTES = QWEN_BYTES\n',
              '        const val STORIES_15M_BYTES = 1_282_439_264L\n'
          )

          p.write_text(s)
          PY

          t='android-app/src/androidTest/kotlin/pro/liliya/app/DevelopmentFirstWorkingLiliyaColdStartInstrumentedTest.kt'
          grep -Fq 'expiresAt = requireNotNull(entitlement.expiresAt)' "$t"
          grep -Fq 'const val STORIES_15M_ASSET = "Qwen3-1.7B-Q4_K_M.gguf"' "$t"
          grep -Fq 'const val STORIES_15M_BYTES = 1_282_439_264L' "$t"
          grep -Fq 'const val QWEN_BYTES = 1_282_439_264L' "$t"
          grep -Fq 'application.configureFirstRun(input)' "$t"
          grep -Fq 'application.startApplicationRuntime()' "$t"
          grep -Fq 'ProductionAndroidAppRuntimeState.READY' "$t"
          grep -Fq 'application.runtimeOwner.send("Hello Liliya /no_think")' "$t"
          sha256sum "$t" | tee /tmp/PATCHED_TEST_SHA256
          echo "HOSTBOOTSTRAP_QWEN_COMPILE_FIX=PASS"

      - name: Download exact semantic provenance bundle
        uses: actions/download-artifact@v4
        with:
          name: semantic-onnx-provenance
          path: ${{ runner.temp }}/semantic-onnx-download
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_PROVENANCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and stage exact semantic test assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ['RUNNER_TEMP']) / 'semantic-onnx-download'
          manifests = list(root.rglob('semantic-onnx-provenance.json'))
          encoders = list(root.rglob('multilingual-e5-small-liliya-v0.1.onnx'))
          tokenizers = list(root.rglob('multilingual-e5-small-tokenizer-v0.1.onnx'))

          if len(manifests) != 1 or len(encoders) != 1 or len(tokenizers) != 1:
              raise SystemExit(
                  f'unexpected provenance layout: manifest={manifests}, encoder={encoders}, tokenizer={tokenizers}'
              )

          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          encoder = manifest['encoder']
          tokenizer = manifest['tokenizer']

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          if encoders[0].stat().st_size != encoder['size'] or digest(encoders[0]) != encoder['sha256']:
              raise SystemExit('encoder provenance mismatch')
          if tokenizers[0].stat().st_size != tokenizer['size'] or digest(tokenizers[0]) != tokenizer['sha256']:
              raise SystemExit('tokenizer provenance mismatch')

          assets = Path('android-app/src/androidTest/assets')
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(encoders[0], assets / encoders[0].name)
          shutil.copy2(tokenizers[0], assets / tokenizers[0].name)

          print(f"SEMANTIC_ENCODER_BYTES={encoders[0].stat().st_size}")
          print(f"SEMANTIC_ENCODER_SHA256={digest(encoders[0])}")
          print(f"SEMANTIC_TOKENIZER_BYTES={tokenizers[0].stat().st_size}")
          print(f"SEMANTIC_TOKENIZER_SHA256={digest(tokenizers[0])}")
          PY

          test -s android-app/src/androidTest/assets/multilingual-e5-small-liliya-v0.1.onnx
          test -s android-app/src/androidTest/assets/multilingual-e5-small-tokenizer-v0.1.onnx
          echo "SEMANTIC_TEST_ASSETS_STAGED=PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned native Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build HostBootstrap Qwen acceptance instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:assembleDebugAndroidTest --console=plain --no-daemon --max-workers=2

      - name: Verify semantic assets are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-app/build/outputs/apk/androidTest -type f -name '*.apk' | head -1)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'assets/multilingual-e5-small-liliya-v0.1.onnx'
          unzip -l "$apk" | grep -F 'assets/multilingual-e5-small-tokenizer-v0.1.onnx'
          echo "SEMANTIC_ASSETS_PACKAGED=PASS"

      - name: Record APK and overlay identities
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-app/build/outputs/apk/androidTest -type f -name '*.apk' | head -1)"
          test -n "$apk"
          out="$RUNNER_TEMP/physical-live-hostbootstrap-qwen-overlay-v3"
          mkdir -p "$out"
          cp "$apk" "$out/physical-live-hostbootstrap-qwen-androidTest.apk"
          sha256sum "$out/physical-live-hostbootstrap-qwen-androidTest.apk" | tee "$out/SHA256SUMS"
          cp /tmp/PATCHED_TEST_SHA256 "$out/PATCHED_TEST_SHA256"
          printf '%s\n' "$FROZEN_SHA" > "$out/FROZEN_SHA"
          printf '%s\n' "$(git rev-parse HEAD)" > "$out/OVERLAY_SHA"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$out/OVERLAY_TREE"
          printf '%s\n' "$SEMANTIC_PROVENANCE_RUN_ID" > "$out/SEMANTIC_PROVENANCE_RUN_ID"
          printf '%s\n' 'Live License + verified semantic assets + isolated runtime storage + canonical configureFirstRun/startApplicationRuntime/READY/chat + exact Qwen via loopback HTTPS' > "$out/ACCEPTANCE_SCOPE"

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: physical-live-hostbootstrap-qwen-overlay-v3-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/physical-live-hostbootstrap-qwen-overlay-v3/**
