name: Stories15M constrained structured response probe 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/smollm-structured-probe-2026-09-11.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build exact pinned llama.cpp completion
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth=1 origin 0f3a71be15af836d277c9f918adfafb45732677e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0f3a71be15af836d277c9f918adfafb45732677e"
          cd ..
          cmake -S llama.cpp -B llama-build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama-build --target llama-completion -j2
          test -x llama-build/bin/llama-completion

      - name: Download exact Stories15M fixture GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true' --output model.gguf
          echo '6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  model.gguf' | sha256sum --check --strict

      - name: Probe exact constrained structured envelope
        shell: bash
        env:
          GRAMMAR_B64: 
          PROMPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$GRAMMAR_B64" | base64 -d > fixture.gbnf
          printf '%s' "$PROMPT_B64" | base64 -d > prompt.txt
          llama-build/bin/llama-completion -m model.gguf -c 2048 -n 512 --temp 0 --no-display-prompt -no-cnv --grammar-file fixture.gbnf -p "$(cat prompt.txt)" > constrained.out 2> constrained.err
          cat constrained.out
          python3 -c "from pathlib import Path; t=Path('constrained.out').read_text(errors='strict').strip('\\n'); k=['LILIYA_COGNITIVE_RESPONSE_V1','PLANNING_GOAL=','PLANNING_STEP_COUNT=1','PLANNING_STEP=','REASONING_PREMISE_COUNT=1','REASONING_PREMISE=','REASONING_ANALYSIS=','REASONING_CONCLUSION=','DECISION_OPTION_COUNT=1','DECISION_OPTION=','DECISION_SELECTED_INDEX=0','DECISION_RATIONALE=','RESULT_CONTENT=','REFLECTION_CONTENT=','LEARNING_PROPOSAL=','END']; p=[t.find(x) for x in k]; assert all(x>=0 for x in p),(p,t); assert p==sorted(p),p; assert 323<=len(t)<=768,len(t); print('CONSTRAINED_STRUCTURE_ORDERED=true'); print('CONSTRAINED_OUTPUT_CHARS='+str(len(t)))"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories15m-constrained-structured-probe
          path: |
            constrained.out
            constrained.err
            fixture.gbnf
          retention-days: 2
          if-no-files-found: warn
