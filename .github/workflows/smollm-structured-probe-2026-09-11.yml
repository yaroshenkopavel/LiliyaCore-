name: Stories15M constrained structured response probe 2026-09-11

on:
  push:
    branches:
      - maintenance/local-mirror-export-2026-09-10
    paths:
      - .github/workflows/smollm-structured-probe-2026-09-11.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build exact pinned llama.cpp completion
        shell: bash
        run: |
          set -euo pipefail
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth=1 origin 0f3a71be15af836d277c9f918adfafb45732677e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0f3a71be15af836d277c9f918adfafb45732677e"
          cd ..
          cmake -S llama.cpp -B llama-build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama-build --target llama-completion -j2
          test -x llama-build/bin/llama-completion

      - name: Download exact Stories15M fixture GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories15M-q4_0.gguf?download=true' \
            --output model.gguf
          echo '6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04  model.gguf' | sha256sum --check --strict

      - name: Probe exact constrained structured envelope
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > fixture.gbnf
          cat > prompt.txt <<'PROMPT'
LILIYA_COGNITIVE_REQUEST_V1

RESPONSE_PROTOCOL
RESPONSE_VERSION=LILIYA_COGNITIVE_RESPONSE_V1
RULE=OUTPUT_ONLY_PROTOCOL_ENVELOPE_NO_PROSE
RULE=ALL_FIELDS_REQUIRED_IN_EXACT_ORDER
RULE=LIST_RECORDS_REPEAT_EXACTLY_DECLARED_COUNT
LIMIT_ENGINE_OUTPUT_CHARS=768
LIMIT_PROTOCOL_OUTPUT_CHARS=768
LIMIT_PLANNING_GOAL_CHARS=64
LIMIT_PLANNING_STEPS=1
LIMIT_PLANNING_STEP_CHARS=64
LIMIT_REASONING_PREMISES=1
LIMIT_REASONING_PREMISE_CHARS=64
LIMIT_REASONING_ANALYSIS_CHARS=64
LIMIT_REASONING_CONCLUSION_CHARS=64
LIMIT_DECISION_OPTIONS=1
LIMIT_DECISION_OPTION_CHARS=64
LIMIT_DECISION_RATIONALE_CHARS=64
LIMIT_RESULT_CHARS=64
LIMIT_REFLECTION_CHARS=64
LIMIT_LEARNING_PROPOSAL_CHARS=64
SCHEMA
PLANNING_GOAL=<escaped>
PLANNING_STEP_COUNT=<int 1..1>
PLANNING_STEP=<escaped> repeat exactly PLANNING_STEP_COUNT times
REASONING_PREMISE_COUNT=<int 1..1>
REASONING_PREMISE=<escaped> repeat exactly REASONING_PREMISE_COUNT times
REASONING_ANALYSIS=<escaped>
REASONING_CONCLUSION=<escaped>
DECISION_OPTION_COUNT=<int 1..1>
DECISION_OPTION=<escaped> repeat exactly DECISION_OPTION_COUNT times
DECISION_SELECTED_INDEX=<int 0..DECISION_OPTION_COUNT-1>
DECISION_RATIONALE=<escaped>
RESULT_CONTENT=<escaped>
REFLECTION_CONTENT=<escaped>
LEARNING_PROPOSAL=<escaped>
END
INPUT
Hello Liliya
CONTEXT
1:SELF
Liliya
2:PERSONALITY
helpful concise assistant
PROMPT
          llama-build/bin/llama-completion \
            -m model.gguf -c 2048 -n 512 --temp 0 --no-display-prompt -no-cnv \
            --grammar-file fixture.gbnf -p "$(cat prompt.txt)" > constrained.out 2> constrained.err
          cat constrained.out
          python3 - <<'PY'
          from pathlib import Path
          text = Path('constrained.out').read_text(errors='strict').strip('\n')
          keys = [
              'LILIYA_COGNITIVE_RESPONSE_V1', 'PLANNING_GOAL=', 'PLANNING_STEP_COUNT=1',
              'PLANNING_STEP=', 'REASONING_PREMISE_COUNT=1', 'REASONING_PREMISE=',
              'REASONING_ANALYSIS=', 'REASONING_CONCLUSION=', 'DECISION_OPTION_COUNT=1',
              'DECISION_OPTION=', 'DECISION_SELECTED_INDEX=0', 'DECISION_RATIONALE=',
              'RESULT_CONTENT=', 'REFLECTION_CONTENT=', 'LEARNING_PROPOSAL=', 'END'
          ]
          positions = [text.find(k) for k in keys]
          assert all(p >= 0 for p in positions), (positions, text)
          assert positions == sorted(positions), positions
          assert len(text) <= 768, len(text)
          assert len(text) >= 323, len(text)
          print('CONSTRAINED_STRUCTURE_ORDERED=true')
          print('CONSTRAINED_OUTPUT_CHARS=' + str(len(text)))
          PY

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories15m-constrained-structured-probe
          path: |
            constrained.out
            constrained.err
            fixture.gbnf
          retention-days: 2
          if-no-files-found: warn
